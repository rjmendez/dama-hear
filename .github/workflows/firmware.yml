name: firmware

on:
  workflow_call:
    inputs:
      retention-days:
        type: number
        default: 14

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  ARDUINO_CLI_VERSION: "1.5.1"
  ESP32_CORE: "3.3.11"
  ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json

jobs:
  build:
    name: build ${{ matrix.sketch }}${{ matrix.board_class && format(' ({0})', matrix.board_class) || '' }}${{ matrix.psram_mode == 'quad' && ' [quad psram]' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sketch: hear_node,     fqbn: "esp32:esp32:XIAO_ESP32S3:PSRAM=opi", guarded: true,  board_class: "xiao-s3-pps",      release_stem: "hear_node-xiao-s3-pps",      build_flags: "-DHEAR_ALLOW_NO_WIFI",                                guard_flags: "",                              artifact: "fw-hear_node-xiao-s3-pps", psram_mode: "octal" }
          - { sketch: hear_node,     fqbn: "esp32:esp32:XIAO_ESP32S3:PSRAM=opi", guarded: true,  board_class: "esp32s3-i2s-gps", release_stem: "hear_node-esp32s3-i2s-gps", build_flags: "-DHEAR_ALLOW_NO_WIFI -DHEAR_BOARD_ESP32S3_I2S_GPS", guard_flags: "-DHEAR_BOARD_ESP32S3_I2S_GPS", artifact: "fw-hear_node-esp32s3-i2s-gps", psram_mode: "octal" }
          # ⚠️SAME board class, DIFFERENT silicon. esp32s3-i2s-gps covers boards wired alike that
          # do not carry the same memory: ageev is 8MB OCTAL PSRAM, gold is 2MB QUAD. PSRAM bus
          # mode is compiled in, so one FQBN cannot serve both; this publishes gold's qspi variant
          # as its own release stem while keeping the default octal stem unchanged.
          - { sketch: hear_node,     fqbn: "esp32:esp32:esp32s3:PSRAM=enabled,FlashSize=8M,PartitionScheme=default_8MB,USBMode=default,CDCOnBoot=cdc", guarded: true, board_class: "esp32s3-i2s-gps", release_stem: "hear_node-esp32s3-i2s-gps-qspi", build_flags: "-DHEAR_ALLOW_NO_WIFI -DHEAR_BOARD_ESP32S3_I2S_GPS", guard_flags: "-DHEAR_BOARD_ESP32S3_I2S_GPS", artifact: "fw-hear_node-esp32s3-i2s-gps-qspi", psram_mode: "quad" }
          - { sketch: puc_node,      fqbn: "esp32:esp32:esp32s3:PSRAM=opi",      guarded: true,  board_class: "",                 release_stem: "",                            build_flags: "-DHEAR_ALLOW_NO_WIFI",                                guard_flags: "",                              artifact: "fw-puc_node", psram_mode: "octal" }
          - { sketch: hear_poc,      fqbn: "esp32:esp32:XIAO_ESP32S3:PSRAM=opi", guarded: false, board_class: "",                 release_stem: "",                            build_flags: "-DHEAR_ALLOW_NO_WIFI",                                guard_flags: "",                              artifact: "fw-hear_poc", psram_mode: "octal" }
          - { sketch: path_test,     fqbn: "esp32:esp32:XIAO_ESP32S3:PSRAM=opi", guarded: false, board_class: "",                 release_stem: "",                            build_flags: "-DHEAR_ALLOW_NO_WIFI",                                guard_flags: "",                              artifact: "fw-path_test", psram_mode: "octal" }
          - { sketch: sense_bringup, fqbn: "esp32:esp32:XIAO_ESP32S3:PSRAM=opi", guarded: false, board_class: "",                 release_stem: "",                            build_flags: "-DHEAR_ALLOW_NO_WIFI",                                guard_flags: "",                              artifact: "fw-sense_bringup", psram_mode: "octal" }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Every artifact this job uploads can become a release asset, so it must be unprovisioned by
      # construction: no secrets.h anywhere in the tree it compiles. Asserted rather than assumed,
      # because the failure mode is a fleet token published in a public binary.
      - name: no compiled-in credentials in the build tree
        run: |
          found=$(find firmware -name secrets.h -not -name '*.example' -print)
          if [ -n "$found" ]; then
            echo "::error::secrets.h in the build tree: $found"
            exit 1
          fi

      - name: build_info.h (what /status reports as fw)
        run: |
          printf '#pragma once\n#ifndef FW_BUILD\n#define FW_BUILD "%s"\n#endif\n' \
            "$(git describe --always --tags --dirty)" > "firmware/${{ matrix.sketch }}/build_info.h"
          cat "firmware/${{ matrix.sketch }}/build_info.h"

      - uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - uses: actions/cache@v6
        with:
          path: ~/.arduino15
          key: arduino15-esp32-${{ env.ESP32_CORE }}-cli-${{ env.ARDUINO_CLI_VERSION }}

      - name: esp32 core ${{ env.ESP32_CORE }}
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          arduino-cli core install "esp32:esp32@$ESP32_CORE" --additional-urls "$ESP32_INDEX"

      - name: compile (no Wi-Fi credentials, -DHEAR_ALLOW_NO_WIFI)
        run: |
          arduino-cli compile --fqbn "${{ matrix.fqbn }}" --libraries firmware/lib \
            --build-property "compiler.cpp.extra_flags=${{ matrix.build_flags }}" \
            --output-dir "out/${{ matrix.sketch }}" "firmware/${{ matrix.sketch }}" | tee build.log
          {
            echo "### ${{ matrix.sketch }}${{ matrix.board_class && format(' ({0})', matrix.board_class) || '' }} (${{ matrix.fqbn }})"
            grep -E "Sketch uses|Global variables" build.log
          } >> "$GITHUB_STEP_SUMMARY"

      - name: a build with no Wi-Fi configuration must fail on the guard
        if: matrix.guarded
        run: |
          extra=()
          if [ -n "${{ matrix.guard_flags }}" ]; then
            extra+=(--build-property "compiler.cpp.extra_flags=${{ matrix.guard_flags }}")
          fi
          set +e
          arduino-cli compile --fqbn "${{ matrix.fqbn }}" --libraries firmware/lib \
            "${extra[@]}" "firmware/${{ matrix.sketch }}" > guard.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::${{ matrix.sketch }} built with no secrets.h and no -DHEAR_ALLOW_NO_WIFI"
            exit 1
          fi
          if ! grep -q "HEAR_ALLOW_NO_WIFI" guard.log; then
            echo "::error::${{ matrix.sketch }} failed, but not on the Wi-Fi guard"
            tail -40 guard.log
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            out/${{ matrix.sketch }}/*.bin
            out/${{ matrix.sketch }}/*.elf
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
