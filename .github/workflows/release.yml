name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  firmware:
    uses: ./.github/workflows/firmware.yml
    with:
      retention-days: 30

  release:
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: fw-hear_node-xiao-s3-pps
          path: ${{ runner.temp }}/hear-node-release/xiao-s3-pps

      - uses: actions/download-artifact@v8
        with:
          name: fw-hear_node-esp32s3-i2s-gps
          path: ${{ runner.temp }}/hear-node-release/esp32s3-i2s-gps

      - uses: actions/download-artifact@v8
        with:
          name: fw-hear_node-esp32s3-i2s-gps-qspi
          path: ${{ runner.temp }}/hear-node-release/esp32s3-i2s-gps-qspi

      - name: assemble
        run: |
          mkdir dist
          cp "$RUNNER_TEMP/hear-node-release/xiao-s3-pps/hear_node.ino.bin"            "dist/hear_node-xiao-s3-pps-$TAG.bin"
          cp "$RUNNER_TEMP/hear-node-release/xiao-s3-pps/hear_node.ino.bootloader.bin" "dist/hear_node-xiao-s3-pps-$TAG-bootloader.bin"
          cp "$RUNNER_TEMP/hear-node-release/xiao-s3-pps/hear_node.ino.partitions.bin" "dist/hear_node-xiao-s3-pps-$TAG-partitions.bin"
          cp "$RUNNER_TEMP/hear-node-release/xiao-s3-pps/hear_node.ino.merged.bin"     "dist/hear_node-xiao-s3-pps-$TAG-merged.bin"
          cp "$RUNNER_TEMP/hear-node-release/xiao-s3-pps/hear_node.ino.elf"            "dist/hear_node-xiao-s3-pps-$TAG.elf"
          cp "$RUNNER_TEMP/hear-node-release/esp32s3-i2s-gps/hear_node.ino.bin"            "dist/hear_node-esp32s3-i2s-gps-$TAG.bin"
          cp "$RUNNER_TEMP/hear-node-release/esp32s3-i2s-gps/hear_node.ino.bootloader.bin" "dist/hear_node-esp32s3-i2s-gps-$TAG-bootloader.bin"
          cp "$RUNNER_TEMP/hear-node-release/esp32s3-i2s-gps/hear_node.ino.partitions.bin" "dist/hear_node-esp32s3-i2s-gps-$TAG-partitions.bin"
          cp "$RUNNER_TEMP/hear-node-release/esp32s3-i2s-gps/hear_node.ino.merged.bin"     "dist/hear_node-esp32s3-i2s-gps-$TAG-merged.bin"
          cp "$RUNNER_TEMP/hear-node-release/esp32s3-i2s-gps/hear_node.ino.elf"            "dist/hear_node-esp32s3-i2s-gps-$TAG.elf"
          cp "$RUNNER_TEMP/hear-node-release/esp32s3-i2s-gps-qspi/hear_node.ino.bin"            "dist/hear_node-esp32s3-i2s-gps-qspi-$TAG.bin"
          cp "$RUNNER_TEMP/hear-node-release/esp32s3-i2s-gps-qspi/hear_node.ino.bootloader.bin" "dist/hear_node-esp32s3-i2s-gps-qspi-$TAG-bootloader.bin"
          cp "$RUNNER_TEMP/hear-node-release/esp32s3-i2s-gps-qspi/hear_node.ino.partitions.bin" "dist/hear_node-esp32s3-i2s-gps-qspi-$TAG-partitions.bin"
          cp "$RUNNER_TEMP/hear-node-release/esp32s3-i2s-gps-qspi/hear_node.ino.merged.bin"     "dist/hear_node-esp32s3-i2s-gps-qspi-$TAG-merged.bin"
          cp "$RUNNER_TEMP/hear-node-release/esp32s3-i2s-gps-qspi/hear_node.ino.elf"            "dist/hear_node-esp32s3-i2s-gps-qspi-$TAG.elf"
          python3 - <<'PY'
          import json, os
          tag = os.environ["TAG"]
          json.dump({
              "tag": tag,
              "commit": os.environ["GITHUB_SHA"],
              "sketch": "firmware/hear_node",
              "fqbn": "esp32:esp32:XIAO_ESP32S3:PSRAM=opi",
              "esp32_core": "3.3.11",
              "arduino_cli": "1.5.1",
              "variants": [
                  {"board_class": "xiao-s3-pps",
                   "release_stem": "hear_node-xiao-s3-pps",
                   "fqbn": "esp32:esp32:XIAO_ESP32S3:PSRAM=opi",
                   "psram_mode": "octal",
                   "build_flags": ["-DHEAR_ALLOW_NO_WIFI"]},
                  {"board_class": "esp32s3-i2s-gps",
                   "release_stem": "hear_node-esp32s3-i2s-gps",
                   "fqbn": "esp32:esp32:XIAO_ESP32S3:PSRAM=opi",
                   "psram_mode": "octal",
                   "build_flags": ["-DHEAR_ALLOW_NO_WIFI", "-DHEAR_BOARD_ESP32S3_I2S_GPS"]},
                  {"board_class": "esp32s3-i2s-gps",
                   "release_stem": "hear_node-esp32s3-i2s-gps-qspi",
                   "fqbn": "esp32:esp32:esp32s3:PSRAM=enabled,FlashSize=8M,PartitionScheme=default_8MB,USBMode=default,CDCOnBoot=cdc",
                   "psram_mode": "quad",
                   "build_flags": ["-DHEAR_ALLOW_NO_WIFI", "-DHEAR_BOARD_ESP32S3_I2S_GPS"]},
              ],
              "credentials": "none compiled in; read from the node's NVS (enroll.py)",
          }, open("dist/build-info.json", "w"), indent=2)
          PY
          python3 firmware/hear_node/release_manifest.py generate \
            --dist dist \
            --build-info dist/build-info.json
          python3 firmware/hear_node/release_manifest.py verify \
            --dist dist \
            --tag "$TAG" \
            --source-root .
          (cd dist && sha256sum * > SHA256SUMS)
          cat > notes.md <<EOF
          Firmware for \`firmware/hear_node\` at \`$GITHUB_SHA\`. \`/status\` reports it as \`fw: $TAG\`.

          These images carry **no Wi-Fi credentials and no node name**. Each node keeps its own in NVS, which OTA does not touch, so the release publishes one image per board class/PSRAM-bus variant and \`flash.py --release\` chooses the one that matches the node's live \`/status\`.

          An enrolled node, over the air:

              python3 firmware/hear_node/flash.py <node> <ip> --release $TAG

          A new board, over USB, once:

              python3 firmware/hear_node/enroll.py <node> /dev/ttyACM0 --class <board-class> --release $TAG

          A board that was never enrolled comes up as its own access point and says so in \`/status\`.

          | file | what it is |
          |---|---|
          | \`hear_node-xiao-s3-pps-$TAG.*\` | Seeed XIAO ESP32-S3 Sense release set |
          | \`hear_node-esp32s3-i2s-gps-$TAG.*\` | ESP32-S3 + I2S mic + PMTK GPS octal-PSRAM release set |
          | \`hear_node-esp32s3-i2s-gps-qspi-$TAG.*\` | ESP32-S3 + I2S mic + PMTK GPS quad-PSRAM (QSPI) release set |
          | \`build-info.json\` | toolchain and flags |
          | \`release-manifest.json\` | immutable offline-verifiable release manifest |
          | \`release-manifest.schema.json\` | manifest JSON schema |
          | \`SHA256SUMS\` | checksums of all of the above |

          Verify a downloaded release offline:

              python3 firmware/hear_node/release_manifest.py verify --dist dist --tag $TAG
          EOF

      - name: publish
        run: gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file notes.md
