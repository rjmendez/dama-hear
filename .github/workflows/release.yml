name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  firmware:
    uses: ./.github/workflows/firmware.yml
    with:
      retention-days: 30

  release:
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: fw-hear_node
          path: build

      - name: assemble
        run: |
          mkdir dist
          cp build/hear_node.ino.bin            "dist/hear_node-$TAG.bin"
          cp build/hear_node.ino.bootloader.bin "dist/hear_node-$TAG-bootloader.bin"
          cp build/hear_node.ino.partitions.bin "dist/hear_node-$TAG-partitions.bin"
          cp build/hear_node.ino.merged.bin     "dist/hear_node-$TAG-merged.bin"
          cp build/hear_node.ino.elf            "dist/hear_node-$TAG.elf"
          python3 - <<'PY'
          import json, os
          tag = os.environ["TAG"]
          json.dump({
              "tag": tag,
              "commit": os.environ["GITHUB_SHA"],
              "sketch": "firmware/hear_node",
              "fqbn": "esp32:esp32:XIAO_ESP32S3:PSRAM=opi",
              "esp32_core": "3.3.11",
              "arduino_cli": "1.5.1",
              "build_flags": ["-DHEAR_ALLOW_NO_WIFI"],
              "credentials": "none compiled in; read from the node's NVS (enroll.py)",
          }, open("dist/build-info.json", "w"), indent=2)
          PY
          (cd dist && sha256sum * > SHA256SUMS)
          cat > notes.md <<EOF
          Firmware for \`firmware/hear_node\` at \`$GITHUB_SHA\`. \`/status\` reports it as \`fw: $TAG\`.

          These images carry **no Wi-Fi credentials and no node name**. Each node keeps its own in NVS, which OTA does not touch, so the same image goes to every node.

          An enrolled node, over the air:

              python3 firmware/hear_node/flash.py <node> <ip> --release $TAG

          A new board, over USB, once:

              python3 firmware/hear_node/enroll.py <node> /dev/ttyACM0 --release $TAG

          A board that was never enrolled comes up as its own access point and says so in \`/status\`.

          | file | what it is |
          |---|---|
          | \`hear_node-$TAG.bin\` | app image, what \`/update\` and \`flash.py --release\` take |
          | \`hear_node-$TAG-bootloader.bin\`, \`-partitions.bin\` | what \`enroll.py\` uploads beside the app |
          | \`hear_node-$TAG-merged.bin\` | bootloader + partitions + app, to write at 0x0 with esptool |
          | \`hear_node-$TAG.elf\` | symbols, for backtraces |
          | \`build-info.json\` | toolchain and flags |
          | \`SHA256SUMS\` | checksums of all of the above |
          EOF

      - name: publish
        run: gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file notes.md
