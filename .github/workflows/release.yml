name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  firmware:
    uses: ./.github/workflows/firmware.yml
    with:
      retention-days: 30

  release:
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # ⚠️THE ONLY TWO PERMISSIONS THE SIGNATURE NEEDS, AND NEITHER IS A SECRET. `id-token: write`
      # lets the job mint a short-lived GitHub OIDC token, which Sigstore exchanges for a
      # certificate bound to this repository, this workflow file and this commit;
      # `attestations: write` records the result. There is no signing key in `secrets`, nothing to
      # rotate and nothing an operator can leak -- which is the only reason this repository can
      # sign releases at all. A fork's pull request cannot reach either: this workflow runs on tag
      # pushes only.
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: fw-hear_node-xiao-s3-pps
          path: ${{ runner.temp }}/hear-node-release/xiao-s3-pps

      - uses: actions/download-artifact@v8
        with:
          name: fw-hear_node-esp32s3-i2s-gps
          path: ${{ runner.temp }}/hear-node-release/esp32s3-i2s-gps

      - uses: actions/download-artifact@v8
        with:
          name: fw-hear_node-esp32s3-i2s-gps-qspi
          path: ${{ runner.temp }}/hear-node-release/esp32s3-i2s-gps-qspi

      # A release asset must never contain a fleet credential. CI has no secrets.h -- that is why
      # every published image is unprovisioned -- but "must not exist" is worth asserting rather
      # than assuming, because the failure mode is a published token and a fleet-wide rotation.
      - name: the release tree carries no compiled-in credentials
        run: |
          for f in firmware/hear_node/secrets.h firmware/puc_node/secrets.h; do
            if [ -e "$f" ]; then
              echo "::error::$f exists in the release checkout; the images may carry fleet credentials"
              exit 1
            fi
          done

      - name: assemble
        run: |
          mkdir dist
          cp "$RUNNER_TEMP/hear-node-release/xiao-s3-pps/hear_node.ino.bin"            "dist/hear_node-xiao-s3-pps-$TAG.bin"
          cp "$RUNNER_TEMP/hear-node-release/xiao-s3-pps/hear_node.ino.bootloader.bin" "dist/hear_node-xiao-s3-pps-$TAG-bootloader.bin"
          cp "$RUNNER_TEMP/hear-node-release/xiao-s3-pps/hear_node.ino.partitions.bin" "dist/hear_node-xiao-s3-pps-$TAG-partitions.bin"
          cp "$RUNNER_TEMP/hear-node-release/xiao-s3-pps/hear_node.ino.merged.bin"     "dist/hear_node-xiao-s3-pps-$TAG-merged.bin"
          cp "$RUNNER_TEMP/hear-node-release/xiao-s3-pps/hear_node.ino.elf"            "dist/hear_node-xiao-s3-pps-$TAG.elf"
          cp "$RUNNER_TEMP/hear-node-release/esp32s3-i2s-gps/hear_node.ino.bin"            "dist/hear_node-esp32s3-i2s-gps-$TAG.bin"
          cp "$RUNNER_TEMP/hear-node-release/esp32s3-i2s-gps/hear_node.ino.bootloader.bin" "dist/hear_node-esp32s3-i2s-gps-$TAG-bootloader.bin"
          cp "$RUNNER_TEMP/hear-node-release/esp32s3-i2s-gps/hear_node.ino.partitions.bin" "dist/hear_node-esp32s3-i2s-gps-$TAG-partitions.bin"
          cp "$RUNNER_TEMP/hear-node-release/esp32s3-i2s-gps/hear_node.ino.merged.bin"     "dist/hear_node-esp32s3-i2s-gps-$TAG-merged.bin"
          cp "$RUNNER_TEMP/hear-node-release/esp32s3-i2s-gps/hear_node.ino.elf"            "dist/hear_node-esp32s3-i2s-gps-$TAG.elf"
          cp "$RUNNER_TEMP/hear-node-release/esp32s3-i2s-gps-qspi/hear_node.ino.bin"            "dist/hear_node-esp32s3-i2s-gps-qspi-$TAG.bin"
          cp "$RUNNER_TEMP/hear-node-release/esp32s3-i2s-gps-qspi/hear_node.ino.bootloader.bin" "dist/hear_node-esp32s3-i2s-gps-qspi-$TAG-bootloader.bin"
          cp "$RUNNER_TEMP/hear-node-release/esp32s3-i2s-gps-qspi/hear_node.ino.partitions.bin" "dist/hear_node-esp32s3-i2s-gps-qspi-$TAG-partitions.bin"
          cp "$RUNNER_TEMP/hear-node-release/esp32s3-i2s-gps-qspi/hear_node.ino.merged.bin"     "dist/hear_node-esp32s3-i2s-gps-qspi-$TAG-merged.bin"
          cp "$RUNNER_TEMP/hear-node-release/esp32s3-i2s-gps-qspi/hear_node.ino.elf"            "dist/hear_node-esp32s3-i2s-gps-qspi-$TAG.elf"
          python3 - <<'PY'
          import json, os
          tag = os.environ["TAG"]
          json.dump({
              "tag": tag,
              "commit": os.environ["GITHUB_SHA"],
              "sketch": "firmware/hear_node",
              "fqbn": "esp32:esp32:XIAO_ESP32S3:PSRAM=opi",
              "esp32_core": "3.3.11",
              "arduino_cli": "1.5.1",
              "variants": [
                  {"board_class": "xiao-s3-pps",
                   "release_stem": "hear_node-xiao-s3-pps",
                   "fqbn": "esp32:esp32:XIAO_ESP32S3:PSRAM=opi",
                   "psram_mode": "octal",
                   "build_flags": ["-DHEAR_ALLOW_NO_WIFI"]},
                  {"board_class": "esp32s3-i2s-gps",
                   "release_stem": "hear_node-esp32s3-i2s-gps",
                   "fqbn": "esp32:esp32:XIAO_ESP32S3:PSRAM=opi",
                   "psram_mode": "octal",
                   "build_flags": ["-DHEAR_ALLOW_NO_WIFI", "-DHEAR_BOARD_ESP32S3_I2S_GPS"]},
                  {"board_class": "esp32s3-i2s-gps",
                   "release_stem": "hear_node-esp32s3-i2s-gps-qspi",
                   "fqbn": "esp32:esp32:esp32s3:PSRAM=enabled,FlashSize=8M,PartitionScheme=default_8MB,USBMode=default,CDCOnBoot=cdc",
                   "psram_mode": "quad",
                   "build_flags": ["-DHEAR_ALLOW_NO_WIFI", "-DHEAR_BOARD_ESP32S3_I2S_GPS"]},
              ],
              # THE INSTALLER CONTRACT, in a field rather than in prose. These images are
              # unprovisioned: no Wi-Fi credentials, no node name, no admin token, no push
              # token. A node supplies all four from its NVS record, and flash.py refuses to
              # install this image on a node that does not report holding them -- the check
              # that v0.1.5 did not have when rankine lost admin and telemetry auth to it.
              "image_class": "unprovisioned",
              "compiled_in_credentials": False,
              "provisioning_required": ["node_id", "wifi", "admin_token", "push_token"],
              "credentials": "none compiled in; read from the node's NVS (enroll.py)",
          }, open("dist/build-info.json", "w"), indent=2)
          PY
          python3 firmware/hear_node/release_sbom.py generate \
            --dist dist \
            --build-info dist/build-info.json
          python3 firmware/hear_node/release_manifest.py generate \
            --dist dist \
            --build-info dist/build-info.json
          python3 firmware/hear_node/release_manifest.py verify \
            --dist dist \
            --tag "$TAG" \
            --source-root .
          python3 firmware/hear_node/release_sbom.py verify --dist dist --tag "$TAG"
          cat > notes.md <<EOF
          Firmware for \`firmware/hear_node\` at \`$GITHUB_SHA\`. \`/status\` reports it as \`fw: $TAG\`.

          These images are **unprovisioned**: no Wi-Fi credentials, no node name, **no admin token and no push token**. A fleet token compiled into a public asset would be a published fleet credential. Each node keeps its own in NVS, which OTA does not touch, so the release publishes one image per board class/PSRAM-bus variant and \`flash.py --release\` chooses the one that matches the node's live \`/status\`.

          **An unprovisioned image is not a node-ready image.** A node whose NVS holds no tokens comes up on this firmware answering \`/status\`, having every heartbeat rejected with 401, and refusing \`/reboot\`, \`/format\` and \`/gate\` from everyone. \`/update\` alone stays open while no admin token is configured, as a recovery valve for a tokenless image. \`flash.py\` refuses that combination: it requires the node's live \`/status\` to report \`auth.admin.src\` and \`auth.push.src\` of \`nvs\` before it downloads anything, and checks the node's auth again, including a 2xx backend push, after the flash.

          An enrolled node, over the air:

              python3 firmware/hear_node/flash.py <node> <ip> --release $TAG

          A new board, over USB, once:

              python3 firmware/hear_node/enroll.py <node> /dev/ttyACM0 --class <board-class> --release $TAG

          A board that was never enrolled comes up as its own access point and says so in \`/status\`. Its \`auth\` block reports whether credentials are configured and where they come from (\`compiled\` or \`nvs\`), never what they are.

          | file | what it is |
          |---|---|
          | \`hear_node-xiao-s3-pps-$TAG.*\` | Seeed XIAO ESP32-S3 Sense release set |
          | \`hear_node-esp32s3-i2s-gps-$TAG.*\` | ESP32-S3 + I2S mic + PMTK GPS octal-PSRAM release set |
          | \`hear_node-esp32s3-i2s-gps-qspi-$TAG.*\` | ESP32-S3 + I2S mic + PMTK GPS quad-PSRAM (QSPI) release set |
          | \`build-info.json\` | toolchain and flags |
          | \`release-manifest.json\` | immutable offline-verifiable release manifest |
          | \`release-manifest.schema.json\` | manifest JSON schema |
          | \`release-sbom.cdx.json\` | CycloneDX 1.6 SBOM: binaries, source closure, vendored libraries, toolchain pins |
          | \`release-provenance.intoto.jsonl\` | Sigstore bundle: SLSA provenance attestation over every file above |
          | \`SHA256SUMS\` | checksums of all of the above |

          **Provenance.** Every asset in this release is covered by a SLSA v1 provenance attestation, signed by this repository's \`release.yml\` through GitHub OIDC (keyless Sigstore -- no signing key exists to leak). The bundle is published here, so verification needs no GitHub credential:

              gh attestation verify hear_node-<variant>-$TAG.bin \\
                --repo $GITHUB_REPOSITORY \\
                --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml \\
                --bundle release-provenance.intoto.jsonl

          **SBOM.** \`release-sbom.cdx.json\` (CycloneDX 1.6) lists the published binaries, the source files they were built from, the vendored \`firmware/lib\` libraries and the pinned toolchain (arduino-cli, esp32 core), all by SHA-256. It is derived from the same tree the manifest is, and its own hash is recorded in the manifest. It does **not** enumerate the contents of the esp32 board package: that is pinned by version, not built here.

          Verify a downloaded release offline (hashes, manifest, SBOM, and that the attestation covers every asset):

              python3 firmware/hear_node/release_manifest.py verify --dist dist --tag $TAG --attestation

          The offline check does not check the signature -- \`gh attestation verify\` above does.
          EOF

      # ⚠️SIGNED AFTER THE MANIFEST AND THE SBOM EXIST, AND OVER ALL OF THEM. The subject set is
      # every file that will be published, so the signature covers the images, the manifest that
      # describes them, the SBOM and build-info.json together -- an attacker cannot swap one of
      # them for a matching set from another build. Keyless: the identity is this workflow at this
      # tag, minted from the job's OIDC token. No secret is read, written or printed.
      - name: sign the release with a SLSA provenance attestation
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      # The bundle becomes a release asset so an operator can verify a download without a GitHub
      # credential (`gh attestation verify --bundle`). SHA256SUMS is written last, after the
      # bundle is in place, so it covers every published file. The manifest deliberately does not
      # hash the bundle -- the bundle's subjects include the manifest.
      - name: publish the attestation bundle with the release
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" "dist/release-provenance.intoto.jsonl"
          python3 firmware/hear_node/release_manifest.py verify \
            --dist dist --tag "$TAG" --attestation
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist

      - name: publish
        run: gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file notes.md
