name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: tests (py${{ matrix.python }}, ${{ matrix.pins }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.12", pins: dev }
          - { python: "3.13", pins: pods }
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/ci-${{ matrix.pins }}.txt
      - run: python -m pip install -r requirements/ci-${{ matrix.pins }}.txt
      - run: python -m pytest -q -rs --color=yes

  adapter-conformance:
    name: adapter conformance and recoupling boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci-dev.txt
      - run: python -m pip install -r requirements/ci-dev.txt

      # ⚠️MERGE-BLOCKING, AND DELIBERATELY ITS OWN JOB. docs/standalone-migration.md calls an
      # adapter import into `hear/`/`modules/` a merge-blocking violation, so the reviewer needs
      # to see WHICH check went red without reading a 4,000-test log. It also runs inside the
      # pytest job (tests/test_recoupling_guard.py), so turning this job off does not disarm it.
      - name: core imports no transport, cloud or shared volume
        run: python tools/recoupling_guard.py

      - name: every ingress adapter passes the same conformance suite
        run: python -m pytest -q -rs tests/test_adapter_conformance.py
                             tests/test_recoupling_guard.py

  generated-headers:
    name: generated headers are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci-dev.txt
      - run: python -m pip install -r requirements/ci-dev.txt
      - name: regenerate
        run: |
          python firmware/gen_decim.py > firmware/hear_node/decim.h
          python firmware/gen_mel.py
          python firmware/gen_mel_scene.py
          python firmware/gen_golden.py
          python tools/gen_ingest_contracts.py
      - name: nothing changed
        run: |
          if ! git diff --quiet; then
            git diff --stat
            echo "::error::a generated header differs from its generator; rerun the generators and commit"
            exit 1
          fi

  contracts:
    name: contract layout and frozen baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # No pip install: the layout rules are checked on a bare interpreter, which is the
      # same no-dependency baseline they require of the contract core itself.
      - name: contract layout
        run: python tools/check_contract_layout.py
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci-dev.txt
      - run: python -m pip install -r requirements/ci-dev.txt
      - name: frozen baseline matches the tree
        run: python tools/freeze_contracts.py --check

  durable-postgres:
    name: durable outbox on an ephemeral postgres
    runs-on: ubuntu-latest
    # The Phase 2 migration plan's gate G7: the ephemeral-Postgres suite runs in CI, or the
    # schema's behaviour is only ever checked by reading it. The service container is created
    # and destroyed with the job, and every test creates its own scratch database inside it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: hear-ephemeral-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HEAR_PG_TEST_DSN: postgresql://postgres:hear-ephemeral-ci@127.0.0.1:5432/postgres
      # Without this the live tests would skip, and a skipped suite is a green tick for nothing.
      HEAR_PG_REQUIRE_LIVE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci-dev.txt
      - run: python -m pip install -r requirements/ci-dev.txt
      - name: postgres client
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: apply, re-apply, exercise and roll back on a scratch database
        run: python tools/hear_durable_pg_testdb.py --self-test
      - name: migration files are still additive and reversible
        run: python tools/hear_durable_pg.py --check
      - run: >-
          python -m pytest -q -rs --color=yes
          tests/test_hear_durable_pg_schema.py
          tests/test_hear_durable_pg_store_parity.py

  firmware:
    uses: ./.github/workflows/firmware.yml

  images:
    # Publishes only from main: a pull request builds, scans and throws the image away.
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write
    with:
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
