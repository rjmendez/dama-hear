---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hear-mqtt-bridge-state
  namespace: dama
  labels:
    app: hear-mqtt-bridge
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hear-mqtt-bridge
  namespace: dama
  labels:
    app: hear-mqtt-bridge
  annotations:
    dama-hear/what: >-
      Subscribes to the local mqtt-broker for hear_node telemetry relayed through dama-gotchi's
      AWS ingest API, commits each accepted record to the phase-0 durable outbox, and reflects it
      into the same dama:hear:* Redis schema hear-heartbeat.yaml's LAN receiver writes.
spec:
  replicas: 1
  # The bridge is a single writer: it owns one RWO PVC holding the SQLite durable
  # outbox and connects with a fixed MQTT client id. A RollingUpdate would surge a
  # second pod before the old one exits, producing SQLite lock contention and an
  # MQTT client-id takeover loop (repeated rc=7 disconnect/reconnect). Recreate
  # guarantees the old pod is fully gone before the replacement starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hear-mqtt-bridge
  template:
    metadata:
      labels:
        app: hear-mqtt-bridge
      annotations:
        # Forces a new ReplicaSet (Recreate: a full pod restart) whenever
        # hear-mqtt-bridge-code.yaml's content changes. Both volumeMounts below use
        # subPath, which kubelet's ConfigMap sync does not live-update -- without this
        # annotation changing too, `kubectl apply -f hear-mqtt-bridge-code.yaml` alone
        # updates only the ConfigMap object and the already-running pod keeps executing
        # whatever code it started with, indefinitely. Kept in sync by
        # deploy/k8s/gen_configmap.py (DEPLOYMENT_CHECKSUM_TARGETS) whenever the bundle
        # is regenerated; see tests/test_configmap_sync.py for the guard.
        checksum/hear-mqtt-bridge-code: 'a2d25143f194a2f9801e45235910cccf195b207a76887489d7d101a8b152e04f'
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: bridge
          image: python:3.13-slim
          command: ["/bin/sh", "-lc"]
          args:
            - |
              set -e
              LIB=/deps
              export PYTHONPATH="$LIB:/app"
              need_install=0
              python -c 'import redis,sys; sys.exit(0 if redis.__version__=="7.4.0" else 1)' 2>/dev/null || need_install=1
              python -c 'import paho.mqtt.client,sys; sys.exit(0 if paho.mqtt.client.__version__=="1.6.1" else 1)' 2>/dev/null || need_install=1
              if [ "$need_install" = "1" ]; then
                echo "installing redis==7.4.0 paho-mqtt==1.6.1 into $LIB"
                pip install --no-cache-dir --upgrade --target "$LIB" 'redis==7.4.0' 'paho-mqtt==1.6.1' >/dev/null 2>&1
              fi
              exec python /app/tools/hear_mqtt_bridge.py
          env:
            - { name: MQTT_HOST, value: "127.0.0.1" }
            # TLS port. The broker on 31883/1883 plaintext must be retired once every
            # publisher (hear_node fleet + this bridge) has been cut over to mTLS.
            - { name: MQTT_PORT, value: "8883" }
            - { name: MQTT_TOPIC, value: "dama/+/telemetry" }
            - { name: MQTT_CLIENT_ID, value: "hear-mqtt-bridge" }
            - { name: HEAR_DURABLE_STORE, value: "sqlite" }
            - { name: HEAR_DURABLE_DB, value: "/state/mqtt-bridge.sqlite3" }
            - { name: HEAR_DURABLE_REPLAY_LIMIT, value: "256" }
            - { name: REDIS_HOST, value: "audit-redis.infra.svc.cluster.local" }
            - { name: REDIS_PORT, value: "6379" }
            - name: REDIS_PASS
              valueFrom:
                secretKeyRef:
                  name: dama-redis-secret
                  key: REDIS_PASS
                  optional: true
            # mTLS: broker CA bundle (to verify the broker) plus this bridge's own client
            # cert/key (so the broker can verify and authorize *this* client). All three
            # come from the hear-mqtt-bridge-tls Secret mounted below.
            - { name: MQTT_CA_CERTS, value: "/tls/ca.crt" }
            - { name: MQTT_CERTFILE, value: "/tls/tls.crt" }
            - { name: MQTT_KEYFILE, value: "/tls/tls.key" }
            - { name: MQTT_TLS_INSECURE, value: "false" }
            - { name: MQTT_TLS_VERSION, value: "tlsv1_2" }
          volumeMounts:
            - { name: code, mountPath: /app/hear/__init__.py, subPath: hear__init__.py }
            - { name: code, mountPath: /app/hear/ingest/__init__.py, subPath: hear_ingest__init__.py }
            - { name: code, mountPath: /app/hear/ingest/envelope.py, subPath: hear_ingest_envelope.py }
            - { name: code, mountPath: /app/hear/ingest/batch.py, subPath: hear_ingest_batch.py }
            - { name: code, mountPath: /app/hear/ingest/observability.py, subPath: hear_ingest_observability.py }
            - { name: code, mountPath: /app/tools/hear_heartbeat_receiver.py, subPath: tools_hear_heartbeat_receiver.py }
            - { name: code, mountPath: /app/tools/hear_mqtt_bridge.py, subPath: tools_hear_mqtt_bridge.py }
            - { name: deps, mountPath: /deps }
            - { name: state, mountPath: /state }
            - { name: tls, mountPath: /tls, readOnly: true }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: "1",  memory: 256Mi }
      volumes:
        - name: code
          configMap:
            name: hear-mqtt-bridge-code
        - name: deps
          emptyDir: {}
        - name: state
          persistentVolumeClaim:
            claimName: hear-mqtt-bridge-state
        # Populate with: ca.crt (broker's CA bundle), tls.crt + tls.key (this bridge's own
        # client certificate/key, issued by the same CA, CN/SAN scoped to this bridge's
        # identity so the broker's ACLs can restrict it to subscribing only).
        - name: tls
          secret:
            secretName: hear-mqtt-bridge-tls
