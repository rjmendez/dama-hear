---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hear-pool
  namespace: dama
  labels:
    app: hear-drain
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hear-drain
  namespace: dama
  labels:
    app: hear-drain
  annotations:
    dama-hear/what: >-
      Drains the ESP32-S3 hear nodes into the pooled sketch corpus on the hear-pool PVC.
      Content-addressed and idempotent, so overlapping runs and re-fetched files cost nothing.
spec:
  # ⚠️`--phone-corpus /pool/sketch_corpus` IS HALF OF A CROSS-REPO CONTRACT. The other half is
  # dama-gotchi's dama-sketch-corpus Deployment, whose SKETCH_CORPUS_OUT_DIR writes that same path
  # on this same hear-pool PVC. It was added to the LIVE object by hand and was in neither this
  # file nor last-applied-configuration, so the next `kubectl apply -f` of this manifest would have
  # deleted it and the phone leg would have gone quiet with nothing reporting the loss.
  #
  # ⚠️THIS FILE IS APPLIED WHOLE, SO IT MUST BE A SUPERSET OF THE LIVE OBJECT. That is the general
  # rule the above is one instance of, and two sessions edited the live args within one hour, so:
  # `kubectl get cronjob hear-drain -n dama -o jsonpath='{...args}'` BEFORE every apply.
  #
  # The scene lane that was dead here -- nodes writing scene-YYYYMMDD.csv while the drain asked
  # only for scene.csv, every run reporting `ok` over a 3.27 h hole -- is fixed in the drain, not
  # in this file: tools/hear_drain.py now DISCOVERS the names from /ls. See
  # docs/acoustic-stack.md section 0.1.
  # ⚠️THE CLIP LANE, AND ITS ORDERING CONSTRAINT. Measured 2026-09-09: 625 clips written across
  # the fleet, ~478 already destroyed, and NOT ONE CLIP HAD EVER LEFT A NODE. `--clip-max-per-node
  # 49` is the card's own ceiling (6291456/128044 = 49 exactly, and all three nodes report
  # `budget_left_clips 0`), so a backlog is BOUNDED at 49 per node however long this was down --
  # the crucial difference from scene.csv, which grows without bound.
  #
  # ⚠️DRAINING PRECEDES ANY BUDGET INCREASE. Raising CLIP_BUDGET_B on the node without collection
  # does not save one clip; it changes WHICH clips are destroyed and how long each survives first.
  # Raise the node budget and this cap in the SAME change, and only after >= 7 days of
  # `clips_deferred_by_cap == 0` read off the heartbeat ring rather than off one run.
  #
  # Every 15 minutes. The nodes roll dets.csv to dets-prev.csv on reflash, so the window a
  # missed run can lose is bounded well under one boot; the fetch is tens of KB.
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      # ⚠️Runs already take 218-307 s of the 900 s interval, and `Forbid` with no deadline means
      # one overrun silently SKIPS the next tick -- a 15-minute schedule quietly becomes a
      # 30-minute one. Simulated against the measured write rate: 15 min loses 0 clips, 30 min
      # loses 0, 45 min loses 3 of nyquist's 321. The margin is exactly two missed runs, and the
      # clip lane below is what spends part of it, so the bound goes in WITH it.
      activeDeadlineSeconds: 780
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: hear-drain
        spec:
          restartPolicy: Never
          containers:
            - name: drain
              image: python:3.13-slim
              command: ["/bin/sh", "-lc"]
              args:
                - |
                  set -e
                  # numpy is cached on the PVC rather than pulled every 15 minutes. The version is
                  # pinned so a silent upgrade cannot change a decode; bump it deliberately.
                  LIB=/pool/pylib
                  if [ ! -d "$LIB/numpy" ]; then
                    echo "installing numpy into $LIB"
                    pip install --no-cache-dir --target "$LIB" 'numpy==2.2.6' >/dev/null 2>&1
                  fi
                  export PYTHONPATH="$LIB:/app"
                  exec python /app/tools/hear_drain.py \
                    --pool /pool/corpus \
                    --node nyquist=172.16.100.105 \
                    --node mach=172.16.100.116 \
                    --phone-corpus /pool/sketch_corpus \
                    --node rankine=172.16.100.50 \
                    --clip-max-per-node 49 \
                    --clip-deadline-s 120
              volumeMounts:
                - { name: code, mountPath: /app/hear/__init__.py,  subPath: hear__init__.py }
                - { name: code, mountPath: /app/hear/sketch.py,    subPath: hear_sketch.py }
                - { name: code, mountPath: /app/hear/corpus.py,    subPath: hear_corpus.py }
                - { name: code, mountPath: /app/hear/detsfile.py,  subPath: hear_detsfile.py }
                - { name: code, mountPath: /app/hear/scenefile.py, subPath: hear_scenefile.py }
                - { name: code, mountPath: /app/hear/identity.py,  subPath: hear_identity.py }
                - { name: code, mountPath: /app/hear/pool.py,      subPath: hear_pool.py }
                - { name: code, mountPath: /app/hear/clips.py,     subPath: hear_clips.py }
                - { name: code, mountPath: /app/tools/hear_drain.py, subPath: tools_hear_drain.py }
                - { name: code, mountPath: /app/tools/fleet.py,    subPath: tools_fleet.py }
                - { name: pool, mountPath: /pool }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits:   { cpu: "1",  memory: 512Mi }
          volumes:
            - name: code
              configMap:
                name: hear-drain-code
            - name: pool
              persistentVolumeClaim:
                claimName: hear-pool
---
# ⚠️STALENESS IS THE FAILURE THAT MATTERS AND IT IS SILENT. The drain above exits 0 whenever its
# HTTP succeeds, so a node that fell off the wifi -- or one whose SD card stopped being written --
# produces a green CronJob history forever. This second job asserts on the SENSOR's own last
# success, which is what a monitor should alert on.
#
# ⚠️IT ALSO ASSERTS THAT THE SCENE TAIL REACHED BACK FAR ENOUGH. A drain whose HTTP succeeded and
# whose window started hours after the previous one ended is fresh, adds rows and exits 0. The
# 2 MB tail covers 2.42 h on nyquist and 2.45 h on mach (derived from the pool ledger's own
# 235.0 / 232.1 B per row at 1.024 s per row), which is not comfortably longer than a boot. How
# much has already been lost that way is NOT asserted here: it was never measured, which is the
# reason the drain now measures it. `--check` fails on any whole row the fetch never asked for;
# see the byte watermark in tools/hear_drain.py. Threshold: --max-unfetched-bytes, default 0.
#
# ⚠️THIS JOB RUNS ONE FIFTH AS OFTEN AS THE DRAIN ABOVE (`*/15 * * * *` vs `17 * * * *`), so four
# drains land between two checks. A per-run heartbeat field would be overwritten three times
# before the gate looked at it, so the heartbeat keeps a ring and `--unfetched-window-s` says how
# much of it to sum. It is passed explicitly BECAUSE it is coupled to these two schedules: change
# either cron and this number has to move with it. 7200 s is two check periods, so one missed
# check run still reports the loss.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hear-drain-check
  namespace: dama
  labels:
    app: hear-drain
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: hear-drain
        spec:
          restartPolicy: Never
          containers:
            - name: check
              image: python:3.13-slim
              command: ["/bin/sh", "-lc"]
              args:
                - |
                  # ⚠️THE EXIT CODE MUST BE --check's, NOT --stats'. This script used to end on
                  # --stats, which always succeeds, so the shell returned 0 and the CronJob was
                  # green no matter what --check found. Reproduced: `sh -lc 'false; echo x; true'`
                  # exits 0. A staleness gate that cannot fail is worse than none -- it is a green
                  # light nobody checks.
                  # `set +e` is explicit rather than assumed: if -e is ever added to the command
                  # line above, `rc=$?` would never run and this silently reverts.
                  set +e
                  export PYTHONPATH=/pool/pylib:/app
                  python /app/tools/hear_drain.py --pool /pool/corpus --check \
                    --unfetched-window-s 7200 \
                    --max-clips-deferred 0
                  rc=$?
                  # --stats runs EVEN WHEN THE CHECK FAILED: a failure is exactly when the pool
                  # summary is wanted. Its own status is discarded so it cannot mask rc.
                  echo "--- pool ---"
                  python /app/tools/hear_drain.py --pool /pool/corpus --stats || true
                  # ⚠️BUILD DRIFT IS CHECKED HERE BECAUSE THIS IS THE ONLY THING THAT REACHES
                  # EVERY NODE ON A SCHEDULE. tools/fleet.py has always been able to spot a split
                  # fleet and was never run: it addressed nodes as `<name>.local`, and .local does
                  # not resolve from WSL or from in here, so wherever anyone tried it every node
                  # came back UNREACHABLE. It now takes `name=host`, the same form the drain above
                  # already uses, so one node map serves both.
                  #
                  # It went unwatched long enough that the three nodes ran three different builds,
                  # one of them a hand-built sketch reporting `fw: unknown` -- arrivals that are
                  # not comparable, with nothing in the fleet saying so.
                  #
                  # --require-one-build gates on the SPLIT ALONE. A node with no fix yet is not a
                  # failure and must not turn this job red; a split never self-heals.
                  echo "--- builds ---"
                  python /app/tools/fleet.py --require-one-build \
                    nyquist=172.16.100.105 \
                    mach=172.16.100.116 \
                    rankine=172.16.100.50
                  fw_rc=$?
                  # ⚠️A SPLIT MUST NOT BE MASKED BY A CLEAN DRAIN. rc is still preferred when both
                  # fail, because a stale pool is the more urgent of the two.
                  if [ "$rc" = "0" ] && [ "$fw_rc" != "0" ]; then rc="$fw_rc"; fi
                  exit "$rc"
              volumeMounts:
                - { name: code, mountPath: /app/hear/__init__.py,  subPath: hear__init__.py }
                - { name: code, mountPath: /app/hear/sketch.py,    subPath: hear_sketch.py }
                - { name: code, mountPath: /app/hear/corpus.py,    subPath: hear_corpus.py }
                - { name: code, mountPath: /app/hear/detsfile.py,  subPath: hear_detsfile.py }
                - { name: code, mountPath: /app/hear/scenefile.py, subPath: hear_scenefile.py }
                - { name: code, mountPath: /app/hear/identity.py,  subPath: hear_identity.py }
                - { name: code, mountPath: /app/hear/pool.py,      subPath: hear_pool.py }
                - { name: code, mountPath: /app/hear/clips.py,     subPath: hear_clips.py }
                - { name: code, mountPath: /app/tools/hear_drain.py, subPath: tools_hear_drain.py }
                - { name: code, mountPath: /app/tools/fleet.py,    subPath: tools_fleet.py }
                - { name: pool, mountPath: /pool }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits:   { cpu: "1",  memory: 512Mi }
          volumes:
            - name: code
              configMap:
                name: hear-drain-code
            - name: pool
              persistentVolumeClaim:
                claimName: hear-pool
