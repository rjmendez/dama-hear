---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hear-pool
  namespace: dama
  labels:
    app: hear-drain
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hear-drain
  namespace: dama
  labels:
    app: hear-drain
  annotations:
    dama-hear/what: >-
      Drains the ESP32-S3 hear nodes into the pooled sketch corpus on the hear-pool PVC.
      Pool ingest is content-addressed and re-fetched files dedupe, but the nodes themselves
      serve one client at a time, so do not overlap another drain or any other card-reading
      workload against the same nodes.
spec:
  # ⚠️`--phone-corpus /pool/sketch_corpus` IS HALF OF A CROSS-REPO CONTRACT. The other half is
  # dama-gotchi's dama-sketch-corpus Deployment, whose SKETCH_CORPUS_OUT_DIR writes that same path
  # on this same hear-pool PVC. It was added to the LIVE object by hand and was in neither this
  # file nor last-applied-configuration, so the next `kubectl apply -f` of this manifest would have
  # deleted it and the phone leg would have gone quiet with nothing reporting the loss.
  #
  # ⚠️THIS FILE IS APPLIED WHOLE, SO IT MUST BE A SUPERSET OF THE LIVE OBJECT. That is the general
  # rule the above is one instance of, and two sessions edited the live args within one hour, so:
  # `kubectl get cronjob hear-drain -n dama -o jsonpath='{...args}'` BEFORE every apply.
  #
  # The scene lane that was dead here -- nodes writing scene-YYYYMMDD.csv while the drain asked
  # only for scene.csv, every run reporting `ok` over a 3.27 h hole -- is fixed in the drain, not
  # in this file: tools/hear_drain.py now DISCOVERS the names from /ls. See
  # docs/acoustic-stack.md section 0.1.
  # CLIP WAV RETENTION IS RE-ENABLED, GATED BY AN AUTOMATED VOICE PURGE ON EVERY RUN. Raw WAVs
  # are fetched (`--clip-max-per-node 96 --clip-store-max-b 2147483648`, the pre-privacy-mode
  # defaults, §THE CLIP LANE below) and then, in the SAME cron cycle, `tools/hear_privacy_purge.py`
  # scores every clip on the pool with Silero VAD v5 and destroys any that contain confirmed human
  # speech before the run exits -- see docs/silero-vad-privacy-contract.md. This bounds how long a
  # voice recording can exist on disk to one drain interval (~15 minutes), not indefinitely, and it
  # is why `set -e` above the purge call is load-bearing: a purge failure must fail the CronJob
  # red, not leave unscored speech sitting on the PVC with a green history. Fail-closed detail:
  # `hear_privacy_purge.py` exits 2 or 3 on any clip it could not confidently score or destroy, and
  # `set -e` turns that straight into a failed run.
  #
  # Every 15 minutes. The nodes roll dets.csv to dets-prev.csv on reflash, so the window a
  # missed run can lose is bounded well under one boot; the fetch is tens of KB.
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      # ⚠️Runs already take 218-307 s of the 900 s interval, and `Forbid` with no deadline means
      # one overrun silently SKIPS the next tick -- a 15-minute schedule quietly becomes a
      # 30-minute one. Simulated against the measured write rate: 15 min loses 0 clips, 30 min
      # loses 0, 45 min loses 3 of nyquist's 321. The margin is exactly two missed runs, and the
      # clip lane below is what spends part of it, so the bound goes in WITH it.
      #
      # ⚠️THE PURGE STEP ADDED TO THIS SAME RUN SPENDS MORE OF THAT MARGIN. Scoring up to ~672
      # freshly-fetched clips (96/node * 7 nodes) at Silero's ~0.5-1.0 ms/frame upstream claim is
      # on the order of 100 s, well inside the 590 s of headroom above -- but it is UNMEASURED on
      # this fleet's hardware, and the first run per pod additionally pays a one-time onnxruntime
      # install and model fetch. If the purge step starts eating the margin, it is the thing to
      # profile before raising activeDeadlineSeconds.
      #
      # ⚠️2026-09-16 INCIDENT: `--clip-deadline-s` bounds ONE node's clip lane, and `main()` drains
      # nodes STRICTLY SEQUENTIALLY (drain_clips.__doc__: one client at a time is a node property,
      # not a style choice). There is no cross-node cap, so worst case is
      # num_nodes * clip-deadline-s, not clip-deadline-s once. At 270 s/node * 6 nodes = 1620 s,
      # that worst case was already 2x this deadline BEFORE the purge step -- invisible only
      # because `--clip-max-per-node 0` made every node's clip lane a no-op for as long as privacy
      # mode was on. The first live cycle after retention was restored hit it: nyquist and
      # rankine were both slow to answer, the pod was killed by activeDeadlineSeconds mid-fetch,
      # and the purge line at the end of this script never ran -- clips nyquist had already
      # written that cycle sat unscored until the next run's purge caught them (it scans the
      # whole pool, so nothing was lost, only delayed). Fixed by shrinking the per-node clip
      # budget below so 6 * clip-deadline-s fits with room for dets/scene and the purge step;
      # `TestTheClipLaneIsBounded` in tests/test_hear_drain_manifest.py now asserts this
      # arithmetic instead of relying on it being re-derived by hand during the next incident.
      activeDeadlineSeconds: 840
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: hear-drain
        spec:
          restartPolicy: Never
          containers:
            - name: drain
              image: python:3.13-slim
              command: ["/bin/sh", "-lc"]
              args:
                - |
                  set -e
                  # numpy is cached on the PVC rather than pulled every 15 minutes. The version is
                  # pinned so a silent upgrade cannot change a decode; bump it deliberately.
                  LIB=/pool/pylib
                  if [ ! -d "$LIB/numpy" ]; then
                    echo "installing numpy into $LIB"
                    pip install --no-cache-dir --target "$LIB" 'numpy==2.2.6' >/dev/null 2>&1
                  fi
                  # onnxruntime runs the real Silero VAD v5 graph the purge step below calls.
                  # Cached the same way as numpy: a fresh pod every 15 minutes must not re-pull a
                  # multi-MB wheel from PyPI on every tick. Absence here is not fatal -- purge.py
                  # falls back to BandEnergyVAD and says so on every receipt -- but it must not be
                  # silently slow either, hence the version pin.
                  if [ ! -d "$LIB/onnxruntime" ]; then
                    echo "installing onnxruntime into $LIB"
                    pip install --no-cache-dir --target "$LIB" 'onnxruntime==1.27.0' >/dev/null 2>&1
                  fi
                  # The Silero v5 weights (MIT licence, docs/silero-vad-privacy-contract.md §1)
                  # are ~2 MB and are fetched once onto the PVC rather than checked into this repo.
                  # The sha256 pin is what stops a compromised or rotated upstream file from being
                  # scored as though it were the audited release.
                  MODEL=/pool/models/silero_vad.onnx
                  MODEL_SHA256=1a153a22f4509e292a94e67d6f9b85e8deb25b4988682b7e174c65279d8788e3
                  if [ ! -f "$MODEL" ]; then
                    echo "fetching silero_vad.onnx"
                    mkdir -p /pool/models
                    python3 -c "import urllib.request; urllib.request.urlretrieve('https://raw.githubusercontent.com/snakers4/silero-vad/master/src/silero_vad/data/silero_vad.onnx', '$MODEL.tmp')"
                    echo "$MODEL_SHA256  $MODEL.tmp" | sha256sum -c - >/dev/null
                    mv "$MODEL.tmp" "$MODEL"
                  fi
                  export PYTHONPATH="$LIB:/app"
                  export HEAR_SILERO_VAD_MODEL="$MODEL"
                  python /app/tools/hear_drain.py \
                    --pool /pool/corpus \
                    --node nyquist=172.16.100.105 \
                    --node mach=172.16.100.116 \
                    --phone-corpus /pool/sketch_corpus \
                    --node rankine=172.16.100.50 \
                    --node gold=172.16.100.82 \
                    --node kasami=172.16.100.90 \
                    --node ageev=172.16.100.83 \
                    --clip-max-per-node 96 \
                    --clip-store-max-b 2147483648 \
                    --clip-deadline-s 60
                  # PRIVACY GATE: every clip the fetch above just wrote is scored and, if it holds
                  # confirmed speech, destroyed before this run exits -- see the comment on the
                  # CronJob's `spec` field above. `--receipt-clean` also writes a NO_SPEECH row for
                  # every clip that was scored and kept, so the audit log can prove coverage and
                  # not only destructions.
                  exec python /app/tools/hear_privacy_purge.py \
                    --pool /pool/corpus/clips \
                    --receipt-clean \
                    --audit-log /pool/corpus/clips/vad_purge.jsonl
              volumeMounts:
                - { name: code, mountPath: /app/hear/__init__.py,  subPath: hear__init__.py }
                - { name: code, mountPath: /app/hear/wire.py,      subPath: hear_wire.py }
                - { name: code, mountPath: /app/hear/sketch.py,    subPath: hear_sketch.py }
                - { name: code, mountPath: /app/hear/corpus.py,    subPath: hear_corpus.py }
                - { name: code, mountPath: /app/hear/detsfile.py,  subPath: hear_detsfile.py }
                - { name: code, mountPath: /app/hear/scenefile.py, subPath: hear_scenefile.py }
                - { name: code, mountPath: /app/hear/identity.py,  subPath: hear_identity.py }
                - { name: code, mountPath: /app/hear/pool.py,      subPath: hear_pool.py }
                - { name: code, mountPath: /app/hear/clips.py,     subPath: hear_clips.py }
                - { name: code, mountPath: /app/tools/hear_drain.py, subPath: tools_hear_drain.py }
                - { name: code, mountPath: /app/tools/fleet.py,    subPath: tools_fleet.py }
                - { name: code, mountPath: /app/hear/privacy/__init__.py, subPath: hear_privacy__init__.py }
                - { name: code, mountPath: /app/hear/privacy/purge.py, subPath: hear_privacy_purge.py }
                - { name: code, mountPath: /app/hear/privacy/silero_vad.py, subPath: hear_privacy_silero_vad.py }
                - { name: code, mountPath: /app/hear/privacy/transient_tdoa.py, subPath: hear_privacy_transient_tdoa.py }
                - { name: code, mountPath: /app/tools/hear_privacy_purge.py, subPath: tools_hear_privacy_purge.py }
                - { name: code, mountPath: /app/hear/resample.py, subPath: hear_resample.py }
                - { name: pool, mountPath: /pool }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits:   { cpu: "1",  memory: 512Mi }
          volumes:
            - name: code
              configMap:
                name: hear-drain-code
            - name: pool
              persistentVolumeClaim:
                claimName: hear-pool
---
# ⚠️STALENESS IS THE FAILURE THAT MATTERS AND IT IS SILENT. The drain above exits 0 whenever its
# HTTP succeeds, so a node that fell off the wifi -- or one whose SD card stopped being written --
# produces a green CronJob history forever. This second job asserts on the SENSOR's own last
# success, which is what a monitor should alert on.
#
# ⚠️IT ALSO ASSERTS THAT THE SCENE TAIL REACHED BACK FAR ENOUGH. A drain whose HTTP succeeded and
# whose window started hours after the previous one ended is fresh, adds rows and exits 0. The
# 2 MB tail covers 2.42 h on nyquist and 2.45 h on mach (derived from the pool ledger's own
# 235.0 / 232.1 B per row at 1.024 s per row), which is not comfortably longer than a boot. How
# much has already been lost that way is NOT asserted here: it was never measured, which is the
# reason the drain now measures it. `--check` fails on any whole row the fetch never asked for;
# see the byte watermark in tools/hear_drain.py. Threshold: --max-unfetched-bytes, default 0.
#
# ⚠️THE SAME CHECK NOW POLLS THE LIVE RING-WALL-SPAN SIGNAL (§0.2 of docs/acoustic-stack.md) from
# `/status` and bare `/audio` in the SAME pass, and each span is divided by ITS OWN sample count.
# That is why the node map is repeated here: the heartbeat can say whether the drain moved data,
# but the audio-loss signal lives on the node.
#
# ⚠️CLIP LOSS IS A PAGE, NOT A STAT. The default `--max-clips-lost -1` reports historical
# `evicted_before_fetch` rows without failing because the first deployment had hundreds of
# already-dead names to classify. The live fleet is past that bootstrap: if a check-window contains
# any newly confirmed destroyed clip, the drain schedule/storage budget is losing audio and the
# CronJob must be red until an operator changes the cadence, budget, or trigger rate.
#
# ⚠️THIS JOB RUNS ONE FIFTH AS OFTEN AS THE DRAIN ABOVE (`*/15 * * * *` vs `17 * * * *`), so four
# drains land between two checks. A per-run heartbeat field would be overwritten three times
# before the gate looked at it, so the heartbeat keeps a ring and `--unfetched-window-s` says how
# much of it to sum. It is passed explicitly BECAUSE it is coupled to these two schedules: change
# either cron and this number has to move with it. 7200 s is two check periods, so one missed
# check run still reports the loss.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hear-drain-check
  namespace: dama
  labels:
    app: hear-drain
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: hear-drain
        spec:
          restartPolicy: Never
          containers:
            - name: check
              image: python:3.13-slim
              command: ["/bin/sh", "-lc"]
              args:
                - |
                  # ⚠️THE EXIT CODE MUST BE --check's, NOT --stats'. This script used to end on
                  # --stats, which always succeeds, so the shell returned 0 and the CronJob was
                  # green no matter what --check found. Reproduced: `sh -lc 'false; echo x; true'`
                  # exits 0. A staleness gate that cannot fail is worse than none -- it is a green
                  # light nobody checks.
                  # `set +e` is explicit rather than assumed: if -e is ever added to the command
                  # line above, `rc=$?` would never run and this silently reverts.
                  set +e
                  export PYTHONPATH=/pool/pylib:/app
                  python /app/tools/hear_drain.py --pool /pool/corpus --check \
                    --node nyquist=172.16.100.105 \
                    --node mach=172.16.100.116 \
                    --node rankine=172.16.100.50 \
                    --node gold=172.16.100.82 \
                    --node kasami=172.16.100.90 \
                    --node ageev=172.16.100.83 \
                    --unfetched-window-s 7200 \
                    --max-ring-wall-span 1.02 \
                    --max-clips-deferred 0 \
                    --max-clips-lost 0
                  rc=$?
                  # --stats runs EVEN WHEN THE CHECK FAILED: a failure is exactly when the pool
                  # summary is wanted. Its own status is discarded so it cannot mask rc.
                  echo "--- pool ---"
                  python /app/tools/hear_drain.py --pool /pool/corpus --stats || true
                  # ⚠️BUILD DRIFT IS CHECKED HERE BECAUSE THIS IS THE ONLY THING THAT REACHES
                  # EVERY NODE ON A SCHEDULE. tools/fleet.py has always been able to spot a split
                  # fleet and was never run: it addressed nodes as `<name>.local`, and .local does
                  # not resolve from WSL or from in here, so wherever anyone tried it every node
                  # came back UNREACHABLE. It now takes `name=host`, the same form the drain above
                  # already uses, so one node map serves both.
                  #
                  # It went unwatched long enough that the three nodes ran three different builds,
                  # one of them a hand-built sketch reporting `fw: unknown` -- arrivals that are
                  # not comparable, with nothing in the fleet saying so.
                  #
                  # --require-one-build fails CLOSED on build identity: a split fails, and a node
                  # that does not answer means "could not verify" rather than a silent green.
                  echo "--- builds ---"
                  python /app/tools/fleet.py --require-one-build \
                    nyquist=172.16.100.105 \
                    mach=172.16.100.116 \
                    rankine=172.16.100.50
                  fw_rc=$?
                  # ⚠️A SPLIT MUST NOT BE MASKED BY A CLEAN DRAIN. rc is still preferred when both
                  # fail, because a stale pool is the more urgent of the two.
                  if [ "$rc" = "0" ] && [ "$fw_rc" != "0" ]; then rc="$fw_rc"; fi
                  exit "$rc"
              volumeMounts:
                - { name: code, mountPath: /app/hear/__init__.py,  subPath: hear__init__.py }
                - { name: code, mountPath: /app/hear/wire.py,      subPath: hear_wire.py }
                - { name: code, mountPath: /app/hear/sketch.py,    subPath: hear_sketch.py }
                - { name: code, mountPath: /app/hear/corpus.py,    subPath: hear_corpus.py }
                - { name: code, mountPath: /app/hear/detsfile.py,  subPath: hear_detsfile.py }
                - { name: code, mountPath: /app/hear/scenefile.py, subPath: hear_scenefile.py }
                - { name: code, mountPath: /app/hear/identity.py,  subPath: hear_identity.py }
                - { name: code, mountPath: /app/hear/pool.py,      subPath: hear_pool.py }
                - { name: code, mountPath: /app/hear/clips.py,     subPath: hear_clips.py }
                - { name: code, mountPath: /app/tools/hear_drain.py, subPath: tools_hear_drain.py }
                - { name: code, mountPath: /app/tools/fleet.py,    subPath: tools_fleet.py }
                - { name: code, mountPath: /app/hear/privacy/__init__.py, subPath: hear_privacy__init__.py }
                - { name: code, mountPath: /app/hear/privacy/purge.py, subPath: hear_privacy_purge.py }
                - { name: code, mountPath: /app/hear/privacy/silero_vad.py, subPath: hear_privacy_silero_vad.py }
                - { name: code, mountPath: /app/hear/privacy/transient_tdoa.py, subPath: hear_privacy_transient_tdoa.py }
                - { name: code, mountPath: /app/tools/hear_privacy_purge.py, subPath: tools_hear_privacy_purge.py }
                - { name: code, mountPath: /app/hear/resample.py, subPath: hear_resample.py }
                - { name: pool, mountPath: /pool }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits:   { cpu: "1",  memory: 512Mi }
          volumes:
            - name: code
              configMap:
                name: hear-drain-code
            - name: pool
              persistentVolumeClaim:
                claimName: hear-pool
