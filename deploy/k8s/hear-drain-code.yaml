        p.ingest_dets("nyquist_dets.csv", default_node="nyquist")   # node, off the SD card
        p.ingest_mqtt_jsonl("2026-09-08.jsonl")                     # phone, off MQTT
        recs = p.records()                                          # hear.corpus.Record, both sources
    
