  hear_wire.py: |
    #!/usr/bin/env python3
    """v2 frame: the sketch plus the three things a solver cannot work without.
    
    v1 (hear/sketch.py) carries no node id, no sequence number and no absolute time. Its 4 B stamp is
    microseconds WITHIN the PPS second and delegates the second to the mesh clock (sketch.py:87-88),
    so a one-second mislabel is 343 m of range error and nothing downstream can see it. v2 adds
    node_id (2 B), microseconds-of-day (5 B, 37 bits) and an 8-bit sequence, and pays for them by
    dropping v1's 2 B of bands+frames -- MEL_BANDS and FRAMES are compile-time constants
    (sketch.py:26-27) re-sent on every frame forever -- in favour of a 4-bit profile id inside the
    flags word v1 already spends 2 B on and uses one bit of. 173 B against the ~200 B usable in a
    Meshtastic payload (sketch.py:31,107).
    
    ⚠️THE FLAGS WORD IS FULLY ALLOCATED: 8 bits seq, 3 version, 4 profile, 1 retrigger, zero spare.
    A new per-detection flag (clipped, pps_locked, a class hint) costs a new profile id or a v3
    frame. That is what 13 header bytes buys.
    
    ⚠️`us_of_day` IS NOT v1's `node_us`, AND THE TWO KEYS NEVER MEET. Both are microseconds; one is
    sub-second, the other absolute within the day. Sharing a name is the 343 m mistake above waiting
    to happen, so this module ships no alias and no compatibility shim.
    
    ⚠️A v2 FRAME CANNOT CARRY AN UNLISTED GEOMETRY. profile_for() raises rather than inventing an id.
    That is the honest cost of spending 4 bits instead of 16 on the sketch shape.
    
    ⚠️A PROFILE NAMES THE WHOLE GEOMETRY, NOT JUST THE SHAPE. (bands, frames) does not say what a
    byte MEANS: two 20x8 frames at different NFFT, different hop or different band layout are the
    same shape and different measurements. v1 states its rate in flags bits 8-11 and its layout in
    bit 12; the v2 flags word has no spare bit for either, so a v2 frame was LESS self-describing
    than the v1 it replaced. PROFILE_GEOMETRY closes that -- the id names bands, frames, NFFT, hop,
    rate, layout and the band edges together, which is what 4 bits are for.
    
    ⚠️AND THE COST: profiles 0, 1 and 2 share a shape, so a single bit flip in the profile field
    relabels a frame's rate without changing its length, and nothing inside the frame can catch it.
    The transport CRC is the only guard. That is worse than a length mismatch and better than a frame
    that cannot say what its bands mean at all; test_backend_pipeline pins it so it is not assumed
    away.
    
    This module refuses; it never masks. EVERY out-of-range input raises ValueError and nothing is
    wrapped, clamped or coerced on the way to the wire -- v1's `int(node_us) & 0xFFFFFFFF`
    (sketch.py:91) and its `min(int(peak), 0xFFFF)` (sketch.py:92) are precisely the bug class refused
    here. That the refusals are all one exception type is contract: a caller wraps pack_v2 in
    `except ValueError` and catches all of them. It imports hear/sketch.py and never edits it: v1
    pack/unpack keep working untouched.
    """
    from __future__ import annotations
    
    import math
    import struct
    from typing import Dict, NamedTuple, Optional, Tuple
    
    import numpy as np
    
    from . import sketch as SK
    
    VERSION: int = 2
    US_PER_DAY: int = 86_400_000_000        # 37 bits. Microseconds of day, the whole timestamp range.
    HDR_V2: int = 13                        # bytes. 5 ts + 2 ref + 2 peak + 2 node_id + 2 flags.
    
    # profile_id -> (bands, frames). LITERAL AND FROZEN: if SK.MEL_BANDS/SK.FRAMES were ever edited,
    # reading these from them would silently change the meaning of every deployed frame. A test
    # compares the two so an edit forces a NEW profile id instead of a reinterpretation.
    PROFILES: Dict[int, Tuple[int, int]] = {0: (20, 8), 1: (20, 8), 2: (20, 8), 3: (20, 8), 4: (20, 8)}
    
    
    class Geometry(NamedTuple):
        """Everything that decides what a byte of the sketch MEANS.
    
        ⚠️(bands, frames) IS NOT ENOUGH, WHICH IS WHY THIS EXISTS. Two 20x8 frames with different
        NFFT, different hop or different band layout are the same SHAPE and different MEASUREMENTS.
        v1 says so in its flags -- rate in bits 8-11, fixed-layout in bit 12 -- but the v2 flags word
        is fully allocated (8 seq, 3 version, 4 profile, 1 retrigger), so v2 has nowhere to put them.
        Folding them into the profile id is what 4 bits are FOR: the id then names the whole geometry
        and a v2 frame is self-describing again instead of less so than the v1 it replaced.
    
        `fs_hz` None means the profile does not state a rate. That is only honest for the legacy id.
        """
        bands: int
        frames: int
        nfft: int
        hop_s: float
        fs_hz: Optional[float]
        layout: str
        f_lo: float
        f_hi: float
    
    
    #: profile_id -> the full geometry. ⚠️APPEND ONLY. Editing an entry reinterprets every frame ever
    #: sent with that id; a changed geometry takes a NEW id. Ids are 4 bits, so there are 16.
    PROFILE_GEOMETRY: Dict[int, Geometry] = {
        # 0 is LEGACY and deliberately left as it was found: 20x8 with the rate and layout UNSTATED,
        # which is what every frame already sent under it actually means. It is not selectable for a
        # new frame -- see profile_for_geometry.
        0: Geometry(20, 8, 256, 0.004, None, SK.LAYOUT_NYQUIST, 300.0, 20000.0),
        1: Geometry(20, 8, 256, 0.004, 48000.0, SK.LAYOUT_FIXED, 300.0, 20000.0),
        2: Geometry(20, 8, 256, 0.004, 16000.0, SK.LAYOUT_FIXED, 300.0, 20000.0),
        # Schema 2.0 multi-rate profiles: 3 for 32 kHz (HUGBOT5000), 4 for 24 kHz
        3: Geometry(20, 8, 256, 0.004, 32000.0, SK.LAYOUT_FIXED, 300.0, 20000.0),
        4: Geometry(20, 8, 256, 0.004, 24000.0, SK.LAYOUT_FIXED, 300.0, 20000.0),
    }
    
    #: Ids a NEW frame may claim. 0 is excluded because a frame that cannot say its own rate is the
    #: defect, not a choice.
    LEGACY_PROFILES = frozenset({0})
    
    #: Valid profile ids for a NEW frame (excludes legacy/read-only profile 0).
    NEW_PROFILE_IDS: frozenset[int] = frozenset(k for k in PROFILE_GEOMETRY if k not in LEGACY_PROFILES)
    
    #: What pack_v2 uses when the caller names no profile.
    #:
    #: ⚠️A DECLARED CONSTANT, NOT A DERIVATION. It used to derive the id from q.shape, which is how a
    #: rate-unstated frame reached the wire: 20x8 matched exactly one id and that id said nothing
    #: about rate or band layout. Shape can no longer select an id at all (profile_for refuses when
    #: it is ambiguous, which 20x8 now is). A caller that does not care still gets a frame that
    #: STATES what its bands mean; a caller that does passes profile_id.
    DEFAULT_PROFILE: int = 1
    
    # 237 B Meshtastic payload minus 37 B protobuf/portnum, per sketch.py:31,107.
    MESHTASTIC_USABLE: int = 200
    
    _TS_BITS = 37
    _TS_MASK = (1 << _TS_BITS) - 1
    
    _F_RETRIG = 0x0001
    _F_PROFILE_SHIFT, _F_PROFILE_MASK = 1, 0x0F
    _F_VERSION_SHIFT, _F_VERSION_MASK = 5, 0x07
    _F_SEQ_SHIFT, _F_SEQ_MASK = 8, 0xFF
    
    _V1_HDR = 12                            # sketch.py:97, struct "<IhHBBH" -- bands at b[8], frames at b[9]
    
    
    def profile_shape(profile_id: int) -> Tuple[int, int]:
        """(bands, frames) for a profile id. Raises on an id this build does not know."""
        try:
            return PROFILES[int(profile_id)]
        except KeyError:
            raise ValueError("unknown profile id %d" % int(profile_id))
    
    
    def profile_geometry(profile_id: int) -> Geometry:
        """The full geometry a profile id names. Raises on an id this build does not know."""
        try:
            return PROFILE_GEOMETRY[int(profile_id)]
        except KeyError:
            raise ValueError("unknown profile id %d" % int(profile_id))
    
    
    def profile_for(bands: int, frames: int) -> int:
        """The profile id carrying this sketch SHAPE.
    
        ⚠️SHAPE ALONE NO LONGER IDENTIFIES A PROFILE, and this raises when it is ambiguous rather
        than picking one. 20x8 is now three profiles differing in rate and band layout, and choosing
        between them from the shape is exactly the guess that put unstated-rate frames on the wire in
        the first place. Use profile_for_geometry.
        """
        key = (int(bands), int(frames))
        ids = sorted(k for k, v in PROFILES.items() if v == key)
        if not ids:
            raise ValueError("no profile for %dx%d" % key)
        if len(ids) > 1:
            raise ValueError(
                "%dx%d is ambiguous across profiles %s -- they differ in rate or band layout, which "
                "the shape does not carry. Pass profile_id, or use profile_for_geometry(fs_hz=..., "
                "layout=...)." % (key[0], key[1], ids))
        return ids[0]
    
    
    def profile_for_geometry(bands: int, frames: int, fs_hz: float, layout: str,
                             nfft: int = SK.NFFT, hop_s: float = SK.HOP_S,
                             f_lo: float = SK.F_LO, f_hi: float = SK.F_HI) -> int:
        """The profile id for a COMPLETE geometry. Refuses anything unlisted and never invents an id.
    
        Refuses a legacy profile too: a new frame must be able to say what its bands mean.
        """
        want = Geometry(int(bands), int(frames), int(nfft), float(hop_s),
                        float(fs_hz), str(layout), float(f_lo), float(f_hi))
        for k, g in sorted(PROFILE_GEOMETRY.items()):
            if g == want and k not in LEGACY_PROFILES:
                return k
        raise ValueError(
            "no profile for %r. A geometry that is not listed cannot be encoded in 4 bits; allocate "
            "a new id in PROFILE_GEOMETRY rather than reinterpreting an existing one." % (want,))
    
    
    def wire_size_v2(profile_id: int = 0) -> int:
        bands, frames = profile_shape(profile_id)
        return HDR_V2 + bands * frames
    
    
    def fits_meshtastic_v2(profile_id: int = 0, overhead: int = 37) -> bool:
        """Mirrors sketch.fits_meshtastic against the same 237 B payload."""
        return wire_size_v2(profile_id) <= SK.MESHTASTIC_PAYLOAD - overhead
    
    
    def pack_v2(us_of_day: int, node_id: int, seq: int, ref_db: float, peak: int,
                q: np.ndarray, retrigger: bool = False,
                profile_id: Optional[int] = None) -> bytes:
        """13 B header + bands*frames int8.
    
        `us_of_day` is integer MICROSECONDS OF DAY, UTC -- not v1's sub-second `node_us`.
        `profile_id` None uses DEFAULT_PROFILE -- a declared id, not one derived from q.shape. The
        shape is still checked against it, so a mismatched sketch raises rather than being relabelled.
    
        Refuses, never wraps and never clamps: an out-of-range timestamp, node id, sequence, peak or
        ref_db raises ValueError rather than being masked into the field (the sketch.py:91-92 failure).
        A non-2-D `q` raises ValueError too, not the IndexError the shape lookup would give.
        """
        us = int(us_of_day)
        if not (0 <= us < US_PER_DAY):
            raise ValueError("us_of_day %d outside 0..86399999999" % us)
        nid = int(node_id)
        if not (0 <= nid <= 0xFFFF):
            raise ValueError("node_id %d outside 0..65535" % nid)
        s = int(seq)
        if not (0 <= s <= 0xFF):
            raise ValueError("seq %d outside 0..255" % s)
        pk = int(peak)
        if not (0 <= pk <= 0xFFFF):
            raise ValueError("peak %d outside 0..65535" % pk)
        # ref_db lands in an <h> at 0.25 dB, so the field tops out at -8192..8191.75 dB. Absurd input
        # either way -- the point is that it fails as a ValueError, not as a struct.error the caller's
        # `except ValueError` walks straight past.
        r4 = int(round(float(ref_db) * 4))
        if not (-0x8000 <= r4 <= 0x7FFF):
            raise ValueError("ref_db %r outside -8192..8191.75 dB" % (ref_db,))
    
        q = np.asarray(q)
        if q.ndim != 2:
            raise ValueError("q is %d-D; a sketch is 2-D (bands, frames)" % q.ndim)
        pid = DEFAULT_PROFILE if profile_id is None else int(profile_id)
        if pid not in NEW_PROFILE_IDS:
            raise ValueError("profile_id %d is not a valid new profile id (valid: %s)"
                             % (pid, sorted(NEW_PROFILE_IDS)))
        bands, frames = profile_shape(pid)
        if q.shape != (bands, frames):
            raise ValueError("q shape %r does not match profile %d (%dx%d)"
                             % (tuple(q.shape), pid, bands, frames))
    
        flags = ((_F_RETRIG if retrigger else 0)
                 | ((pid & _F_PROFILE_MASK) << _F_PROFILE_SHIFT)
                 | ((VERSION & _F_VERSION_MASK) << _F_VERSION_SHIFT)
                 | ((s & _F_SEQ_MASK) << _F_SEQ_SHIFT))
        hdr = (us.to_bytes(5, "little") + struct.pack("<hHHH", r4, pk, nid, flags))
        return hdr + q.astype(np.int8).tobytes()
    
    
    def unpack_v2(b: bytes) -> Dict:
        """Decode a v2 frame. Raises on a length, version or timestamp-invariant violation rather
        than reshaping whatever arrived."""
        if len(b) < HDR_V2:
            raise ValueError("v2 frame is %d bytes, header needs %d" % (len(b), HDR_V2))
        flags = struct.unpack_from("<H", b, 11)[0]
        pid = (flags >> _F_PROFILE_SHIFT) & _F_PROFILE_MASK
        bands, frames = profile_shape(pid)
        n = HDR_V2 + bands * frames
        if len(b) != n:
            raise ValueError("v2 frame is %d bytes, profile %d needs %d" % (len(b), pid, n))
        version = (flags >> _F_VERSION_SHIFT) & _F_VERSION_MASK
        if version != VERSION:
            raise ValueError("frame version %d is not %d" % (version, VERSION))
    
        ts40 = int.from_bytes(b[0:5], "little")
        # Second, independent check on the timestamp: the top 3 bits of the uint40 are a strict zero
        # invariant, so a corrupted high byte cannot pass as a plausible time.
        if ts40 >> _TS_BITS:
            raise ValueError("ts40 bits 37-39 set (0x%010x): not a microseconds-of-day frame" % ts40)
        us = ts40 & _TS_MASK
        if us >= US_PER_DAY:
            raise ValueError("us_of_day %d outside 0..86399999999" % us)
    
        ref4, peak, node_id, _ = struct.unpack_from("<hHHH", b, 5)
        q = np.frombuffer(b[HDR_V2:n], dtype=np.int8).reshape(bands, frames)
        geom = profile_geometry(pid)
        fs = geom.fs_hz
        layout = geom.layout
        vb = None if fs is None else SK.valid_bands(fs, bands, layout=layout)
        be = None if fs is None else SK.band_edges_hz(fs, bands, layout=layout)
        return {"version": VERSION, "us_of_day": us,
                "node_id": node_id, "seq": (flags >> _F_SEQ_SHIFT) & _F_SEQ_MASK,
                "ref_db": ref4 / 4.0, "peak": peak,
                "retrigger": bool(flags & _F_RETRIG), "profile_id": pid,
                "bands": bands, "frames": frames, "flags": flags,
                "fs_hz": fs, "layout": layout, "valid_bands": vb, "band_edges_hz": be,
                "q": q, "db": q.astype(float) / 2.0 + ref4 / 4.0}
    
    
    def version_of(b: bytes, explicit_version: Optional[int] = None) -> int:
        """1 or 2, by length plus self-consistency.
    
        If explicit_version is provided (e.g. from MQTT topic or transport envelope),
        it is honored directly if the byte length and structure match the requested version.
        Otherwise, v2 is tested FIRST and that order is contract.
    
        ⚠️THE HEURISTIC DISCRIMINATION IS NOT EXACT AND NOTHING CAN MAKE IT SO: v1 has no version field to read
        (sketch.py:97). A v1 frame whose bands*frames happened to equal a v2 profile's payload and
        whose bytes 11-12 happened to spell version 2 would be misread. With MEL_BANDS 20 and
        FRAMES 8 frozen (sketch.py:26-27) that collision does not exist in this repo, which is a
        property of the constants and not of this function.
        """
        if explicit_version == 1:
            if len(b) >= _V1_HDR and 1 <= b[8] <= 64 and 1 <= b[9] <= 64:
                want = _V1_HDR + b[8] * b[9]
                if 0 <= len(b) - want <= 16:
                    return 1
            raise ValueError(f"explicit v1 specified but frame is not a valid v1 frame: {len(b)} bytes")
    
        if explicit_version == 2 or explicit_version is None:
            if len(b) >= HDR_V2:
                flags = struct.unpack_from("<H", b, 11)[0]
                pid = (flags >> _F_PROFILE_SHIFT) & _F_PROFILE_MASK
                version = (flags >> _F_VERSION_SHIFT) & _F_VERSION_MASK
                if version == VERSION and pid in PROFILES and len(b) >= wire_size_v2(pid):
                    if not (int.from_bytes(b[0:5], "little") >> _TS_BITS):
                        return VERSION
            if explicit_version == 2:
                raise ValueError(f"explicit v2 specified but frame is not a valid v2 frame: {len(b)} bytes")
    
        if len(b) >= _V1_HDR and 1 <= b[8] <= 64 and 1 <= b[9] <= 64:
            want = _V1_HDR + b[8] * b[9]
            if 0 <= len(b) - want <= 16:
                return 1
        raise ValueError("unrecognised frame: %d bytes" % len(b))
    
    
    def decode(b: bytes, explicit_version: Optional[int] = None) -> Dict:
        """version_of() then the matching unpacker. A v1 result gains 'version': 1 from HERE --
        sketch.py is read-only -- and keeps its own 'node_us' key. Nothing else is renamed."""
        v = version_of(b, explicit_version=explicit_version)
        if v == VERSION:
            flags = struct.unpack_from("<H", b, 11)[0]
            pid = (flags >> _F_PROFILE_SHIFT) & _F_PROFILE_MASK
            n = wire_size_v2(pid)
            return unpack_v2(b[:n])
        node_us, ref4, peak, bands, frames, flags = struct.unpack("<IhHBBH", b[:12])
        want = 12 + bands * frames
        d = SK.unpack(b[:want])
        d["version"] = 1
        return d
    
    
    def us_of_day_from_utc(t_utc_s: float) -> int:
        return int(round((float(t_utc_s) % 86400.0) * 1e6)) % US_PER_DAY
    
    
    def unwrap_utc(us_of_day: int, ref_utc_s: float) -> float:
        """Absolute UTC seconds, nearest-wrap against `ref_utc_s`.
    
        THE MIDNIGHT RULE: `ref_utc_s` must be within 12 h of the true event time -- a frame's own
        receive time always is. A receiver clock a whole day wrong shifts every node by the SAME
        86400 s, which cancels in TDoA; the only case where the day reaches the geometry is a group
        straddling midnight, and unwrapping each frame against its own receive time handles that.
        Feeding one shared reference to a whole group is what breaks it.
        """
        ref = float(ref_utc_s)
        t = math.floor(ref / 86400.0) * 86400.0 + int(us_of_day) / 1e6
        while t - ref > 43200.0:
            t -= 86400.0
        while ref - t > 43200.0:
            t += 86400.0
        return t
    
  hear_sketch.py: |
    #!/usr/bin/env python3
    """Log-mel sketch: what a node ships instead of audio, sized to one Meshtastic packet.
    
    A Meshtastic payload is 237 bytes, ~200 usable after protobuf framing. The sketch is
    MEL_BANDS x FRAMES int8 values -- 160 B at the default 20x8 -- leaving room for a header.
    
    WHY A SKETCH AND NOT A LEARNED EMBEDDING. A learned embedding is only as general as the classes
    it was trained on, and it goes stale the day you add a new sound. A log-mel sketch is just a
    coarse spectrogram: the node commits to no interpretation, and the central side can train new
    classifiers on the same bytes forever -- gunshots today, cicadas next, whatever after. That is
    the whole point of putting the hard maths elsewhere.
    
    ⚠️QUANTISATION IS PER-EVENT AND THE SCALE MUST TRAVEL. Levels span the noise floor to a clipped
    rifle report; a fixed int8 scale would either saturate or waste its range. The reference level is
    sent in the header so the central side can undo it. Without that the sketch carries shape but not
    amplitude, and amplitude is the single strongest feature this project has measured.
    """
    from __future__ import annotations
    
    import math
    import struct
    from typing import Dict, Optional, Tuple
    
    import numpy as np
    
    MEL_BANDS = 20
    FRAMES = 8
    F_LO, F_HI = 300.0, 20000.0
    HOP_S = 0.004
    NFFT = 256
    MESHTASTIC_PAYLOAD = 237
    
    # ⚠️THE BAND EDGES DEPEND ON fs AND THE FRAME COULD NOT SAY SO.
    # `mel_filterbank` clamps its top edge to Nyquist, so 20 bands span 300 Hz-20 kHz on a 48 kHz
    # phone and 300 Hz-7.84 kHz on a 16 kHz node. Band 12 is 4.6 kHz on one and 1.9 kHz on the other.
    # The header carried `bands` and `frames` but never `fs`, so two frames that mean entirely
    # different things were byte-indistinguishable -- and the whole point of the phones emitting this
    # format is that one corpus is built from both. Four bits of the flags word now carry a sample
    # rate code. 0 stays "unstated", which is what every frame written before this said implicitly.
    FS_CODES = {8000.0: 1, 16000.0: 2, 22050.0: 3, 24000.0: 4, 32000.0: 5,
                44100.0: 6, 48000.0: 7, 96000.0: 8, 192000.0: 9}
    FS_BY_CODE = {v: k for k, v in FS_CODES.items()}
    FS_SHIFT = 8                      # flags bits 8-11; bits 0-7 stay event flags (bit0 = retrigger)
    FS_MASK = 0x0F
    
    # The event bits, named. ⚠️These are v1 positions and must be read off `event_flags` (flags &
    # 0xFF), never off the raw word: in v2 bit 1 is a profile-id bit, so masking the raw flags tags a
    # good v2 frame as context-starved.
    FLAG_RETRIGGER = 0x0001
    FLAG_NO_CONTEXT = 0x0002
    
    LAYOUT_NYQUIST = "nyquist"      # legacy: edges rescaled to each node's Nyquist
    LAYOUT_FIXED = "fixed"          # edges always over [F_LO, F_HI]; bands above Nyquist go empty
    LAYOUT_BIT = 1 << 12            # flags bit 12 set => LAYOUT_FIXED
    
    #: Above this rate the two layouts are IDENTICAL, because min(F_HI, fs/2*0.98) == F_HI.
    #: Every 48 kHz sensor in this fleet is above it, so the flag changes not one byte a phone sends.
    LAYOUT_EQUIVALENT_ABOVE_HZ = F_HI / 0.49    # 40816.3 Hz at F_HI = 20 kHz
    
    
    
    
    def fs_code(fs: Optional[float]) -> int:
        """Code for `fs`, or 0 when it is not one this format can name.
    
        0 rather than an error: an odd rate is still worth sketching, and "unstated" is an honest
        thing for the frame to say. It is NOT the same as a stated rate, and `unpack` keeps them apart.
        """
        return 0 if fs is None else FS_CODES.get(float(fs), 0)
    
    
    def band_edges_hz(fs: float, bands: int = MEL_BANDS,
                      f_lo: float = F_LO, f_hi: float = F_HI,
                      layout: str = LAYOUT_NYQUIST) -> np.ndarray:
        """The bands+2 triangle edges this fs and layout produce. What a consumer needs to know
        whether two frames are comparable at all."""
        hi = f_hi if layout == LAYOUT_FIXED else min(f_hi, fs / 2.0 * 0.98)
        return _mel_to_hz(np.linspace(_hz_to_mel(f_lo), _hz_to_mel(hi), bands + 2))
    
    
    def valid_bands(fs: float, bands: int = MEL_BANDS, f_lo: float = F_LO, f_hi: float = F_HI,
                    layout: str = LAYOUT_FIXED, strict: bool = False) -> int:
        """How many of `bands` carry any FFT bin at this rate. Under `fixed` a slow node's top bands
        are empty and must be MASKED, not fed to a model as if they were measurements of silence:
        unmasked they cost 1.7 points of cross-rate AUC (0.9306 against 0.9473).
    
        ⚠️`strict=False` (the default, and what the 0.9473 was measured with) counts every band with
        a bin below Nyquist, so the TOP one is partially covered and reads systematically low. That
        band is still worth more than nothing on this corpus; `strict=True` drops it if you would
        rather have fewer, cleaner bands."""
        if layout == LAYOUT_NYQUIST:
            return int(bands)
        e = band_edges_hz(fs, bands, f_lo, f_hi, LAYOUT_FIXED)
        nyq = fs / 2.0
        if strict:
            # every triangle wholly below Nyquist. Excludes the one straddling band, whose energy is
            # systematically low because part of its passband does not exist on this node.
            return int(sum(1 for b in range(bands) if e[b + 2] <= nyq))
        return int(sum(1 for b in range(bands) if e[b] < nyq))
    
    
    def common_bands(rates: "Sequence[float]", bands: int = MEL_BANDS, **kw) -> int:
        """Bands usable by EVERY rate in `rates` -- the width of a matrix they can share."""
        return min(valid_bands(float(r), bands, layout=LAYOUT_FIXED, **kw) for r in rates)
    
    
    def _hz_to_mel(f):
        return 2595.0 * np.log10(1.0 + np.asarray(f, float) / 700.0)
    
    
    def _mel_to_hz(m):
        return 700.0 * (10 ** (np.asarray(m, float) / 2595.0) - 1.0)
    
    
    def mel_filterbank(fs: float, nfft: int = NFFT, bands: int = MEL_BANDS,
                       f_lo: float = F_LO, f_hi: float = F_HI,
                       layout: str = LAYOUT_NYQUIST) -> np.ndarray:
        """Triangular mel bank, area-normalised.
    
        ⚠️`layout` DECIDES WHETHER TWO SENSORS ARE COMPARABLE AT ALL.
    
        `nyquist` (the shipped default) rescales the whole bank to each node's Nyquist, so band 12 is
        5826 Hz at 48 kHz and 3072 Hz at 16 kHz. Measured on the 228 labelled events: a model trained
        on 48 kHz sketches and applied to the same audio at 16 kHz drops from AUC 0.9634 to **0.9141**,
        purely from the axis moving.
    
        `fixed` puts the edges over [f_lo, f_hi] whatever the rate. Bands whose support is wholly
        above a node's Nyquist get no FFT bins, so their power is zero and they quantise to the floor;
        the rest mean the same frequency everywhere. With those empty bands masked off
        (`valid_bands`), the same cross-rate transfer is **0.9473 / 0.9485** in both directions.
    
        The cost, stated rather than hidden: at 16 kHz only 15 of 20 bands are usable, so a slow node
        resolves its own spectrum more coarsely than the rescaled bank would. That is the trade -- one
        model across the fleet, against per-node resolution.
        """
        if layout not in (LAYOUT_NYQUIST, LAYOUT_FIXED):
            raise ValueError("layout must be %r or %r" % (LAYOUT_NYQUIST, LAYOUT_FIXED))
        hi = f_hi if layout == LAYOUT_FIXED else min(f_hi, fs / 2.0 * 0.98)
        edges = _mel_to_hz(np.linspace(_hz_to_mel(f_lo), _hz_to_mel(hi), bands + 2))
        freqs = np.fft.rfftfreq(nfft, 1.0 / fs)
        fb = np.zeros((bands, len(freqs)))
        for b in range(bands):
            lo, mid, up = edges[b], edges[b + 1], edges[b + 2]
            if up <= lo:
                continue
            rise = (freqs - lo) / max(mid - lo, 1e-9)
            fall = (up - freqs) / max(up - mid, 1e-9)
            fb[b] = np.clip(np.minimum(rise, fall), 0.0, None)
            s = fb[b].sum()
            if s > 0:
                fb[b] /= s
        return fb
    
    
    def sketch(x: np.ndarray, fs: float, bands: int = MEL_BANDS, frames: int = FRAMES,
               hop_s: float = HOP_S, nfft: int = NFFT, f_lo: float = F_LO,
               f_hi: float = F_HI, layout: str = LAYOUT_NYQUIST) -> Tuple[np.ndarray, float]:
        """(int8 [bands x frames], ref_db). Frames start at the sample the caller passes as index 0.
    
        `layout` decides what band k MEANS -- see [mel_filterbank]. At any rate above
        LAYOUT_EQUIVALENT_ABOVE_HZ the two are the same bytes."""
        x = np.asarray(x, float)
        fb = mel_filterbank(fs, nfft, bands, f_lo=f_lo, f_hi=f_hi, layout=layout)
        hop = max(1, int(hop_s * fs))
        win = np.hanning(nfft)
        out = np.zeros((bands, frames))
        for t in range(frames):
            s = t * hop
            seg = x[s:s + nfft]
            if len(seg) < nfft:
                seg = np.pad(seg, (0, nfft - len(seg)))
            P = np.abs(np.fft.rfft(seg * win, nfft)) ** 2
            out[:, t] = fb @ P
        db = 10.0 * np.log10(out + 1e-12)
        ref = float(db.max())
        # 0.5 dB per step over a 64 dB window: enough to hold a spectrum's shape, and 64 dB is
        # wider than the useful dynamic range between this site's noise floor and a clipped report.
        q = np.clip(np.round((db - ref) * 2.0), -128, 127).astype(np.int8)
        return q, ref
    
    
    def pack(node_us: int, ref_db: float, peak: int, q: np.ndarray, flags: int = 0,
             fs: Optional[float] = None, layout: str = LAYOUT_NYQUIST) -> bytes:
        """Wire format. Header is 12 B; the sketch is bands*frames int8.
    
        `node_us` is microseconds within the PPS second -- the whole second comes from the mesh's own
        clock, so the timestamp costs 4 bytes rather than 8 and still resolves to 1 us.
    
        `fs` is folded into flags bits 8-11 (see FS_CODES). Pass it: a frame that cannot say what its
        bands mean is only comparable to frames from an identical node.
        """
        body = q.astype(np.int8).tobytes()
        f = (int(flags) & 0xFFFF) | ((fs_code(fs) & FS_MASK) << FS_SHIFT)
        if layout == LAYOUT_FIXED:
            f |= LAYOUT_BIT
        elif layout != LAYOUT_NYQUIST:
            raise ValueError("layout must be %r or %r" % (LAYOUT_NYQUIST, LAYOUT_FIXED))
        hdr = struct.pack("<IhHBBH", int(node_us) & 0xFFFFFFFF, int(round(ref_db * 4)),
                          min(int(peak), 0xFFFF), q.shape[0], q.shape[1], f)
        return hdr + body
    
    
    def unpack(b: bytes) -> Dict:
        """Decode a wire frame. Raises ValueError on anything that is not one.
    
        ⚠️A radio DELIVERS TRUNCATED FRAMES. This used to slice the body and reshape it, so a short
        packet surfaced as numpy's "cannot reshape array of size 157 into shape (20,8)" from three
        frames down the stack -- and a body that was short by a whole row of the sketch, with the
        slice landing on a multiple of `frames`, would have reshaped CLEANLY into the wrong geometry.
        """
        if len(b) < 12:
            raise ValueError("frame is %d B, shorter than the 12 B header" % len(b))
        node_us, ref4, peak, bands, frames, flags = struct.unpack("<IhHBBH", b[:12])
        if bands <= 0 or frames <= 0:
            raise ValueError("header declares a %dx%d sketch" % (bands, frames))
        want = 12 + bands * frames
        if len(b) != want:
            raise ValueError("frame is %d B; header declares %dx%d, so it must be %d"
                             % (len(b), bands, frames, want))
        q = np.frombuffer(b[12:want], dtype=np.int8).reshape(bands, frames)
        code = (flags >> FS_SHIFT) & FS_MASK
        fs = FS_BY_CODE.get(code)
        layout = LAYOUT_FIXED if (flags & LAYOUT_BIT) else LAYOUT_NYQUIST
        return {"node_us": node_us, "ref_db": ref4 / 4.0, "peak": peak,
                "flags": flags, "event_flags": flags & 0xFF, "retrigger": bool(flags & 1),
                "fs_code": code, "fs_hz": fs, "layout": layout,
                # how many of this frame's bands carry a measurement. None when the rate is unstated:
                # without it there is no way to know which bands a slow node left empty.
                "valid_bands": None if fs is None else valid_bands(fs, bands, layout=layout),
                # None, not a guess: two frames whose band edges are unknown must not be silently
                # stacked into one feature matrix. See hear/corpus.py.
                "band_edges_hz": None if fs is None else band_edges_hz(fs, bands, layout=layout),
                "q": q, "db": q.astype(float) / 2.0 + ref4 / 4.0}
    
    
    def wire_size(bands: int = MEL_BANDS, frames: int = FRAMES) -> int:
        return 12 + bands * frames
    
    
    def fits_meshtastic(bands: int = MEL_BANDS, frames: int = FRAMES, overhead: int = 37) -> bool:
        """237 B payload minus protobuf/portnum overhead. Default 20x8 leaves headroom."""
        return wire_size(bands, frames) <= MESHTASTIC_PAYLOAD - overhead
    
