            if d.get("node"):
                d["node_from"] = "file"
            else:
                if not default_node:
                    out._skip(n, "no_node")
                    continue
                d["node"], d["node_from"] = default_node, "argument"
            d["schema"] = gen.name
            out.rows.append(d)
        return out
    
    
    def read_file(path: str, default_node: Optional[str] = None) -> SceneRead:
        with open(path, "r", errors="replace") as fh:
            return read_text(fh.read(), default_node=default_node)
    
