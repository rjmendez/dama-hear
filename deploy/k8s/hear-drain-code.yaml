            raise ValueError("empty mel_hex")
        if len(s) != 2 * bands * slices:
            raise ValueError("mel_hex is %d hex chars, %dx%d needs %d"
                             % (len(s), bands, slices, 2 * bands * slices))
        try:
            b = bytes.fromhex(s)
        except ValueError as e:
            raise ValueError("mel_hex is not hex: %s" % e)
