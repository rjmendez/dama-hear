    FORBIDDEN_SUBSTRINGS = (
        "transcript", "text", "words", "tokens", "embedding", "embed", "mfcc", "mel",
        "spectrogram", "feature", "samples", "audio", "waveform", "pcm", "voiceprint",
        "speaker", "identity", "content", "excerpt", "snippet",
    )
    
