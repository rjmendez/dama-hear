---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hear-heartbeat-state
  namespace: dama
  labels:
    app: hear-heartbeat
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hear-heartbeat
  namespace: dama
  labels:
    app: hear-heartbeat
  annotations:
    dama-hear/what: >-
      Receives hear_node heartbeat and event POSTs, commits each accepted record to the
      phase-0 durable outbox, and then reflects it into the existing short-TTL dama:hear:*
      Redis compatibility keys.
spec:
  replicas: 1
  # Recreate, not RollingUpdate: this pod holds hostPort 5051 AND a ReadWriteOnce state PVC, so a
  # surge pod can never become ready alongside the outgoing one -- it stays Pending forever and
  # the rollout hangs. Tear the old pod down first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hear-heartbeat
  template:
    metadata:
      labels:
        app: hear-heartbeat
      annotations:
        # Forces a new ReplicaSet (Recreate: a full pod restart) whenever
        # hear-heartbeat-code.yaml's content changes. The code file below is mounted
        # with subPath, which kubelet's ConfigMap sync does not live-update.
        checksum/hear-heartbeat-code: 'e63e91c26fd76e158618276f484552e03b8ce2c10e21516bfa2ffcbafdb643d2'
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "5051"
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: receiver
          image: python:3.13-slim
          command: ["/bin/sh", "-lc"]
          args:
            - |
              set -e
              LIB=/deps
              export PYTHONPATH="$LIB:/app"
              if ! python -c 'import redis,sys; sys.exit(0 if redis.__version__=="7.4.0" else 1)' 2>/dev/null; then
                echo "installing redis==7.4.0 into $LIB"
                pip install --no-cache-dir --upgrade --target "$LIB" 'redis==7.4.0' >/dev/null 2>&1
              fi
              if [ ! -d "$LIB/numpy" ]; then
                echo "installing numpy into $LIB"
                pip install --no-cache-dir --upgrade --target "$LIB" 'numpy==2.2.6' >/dev/null 2>&1
              fi
              if [ ! -d "$LIB/onnxruntime" ]; then
                echo "installing onnxruntime into $LIB"
                pip install --no-cache-dir --upgrade --target "$LIB" 'onnxruntime==1.27.0' >/dev/null 2>&1
              fi
              MODEL="${HEAR_SILERO_VAD_MODEL:-/pool/models/silero_vad.onnx}"
              MODEL_SHA256=1a153a22f4509e292a94e67d6f9b85e8deb25b4988682b7e174c65279d8788e3
              if [ ! -f "$MODEL" ]; then
                echo "fetching silero_vad.onnx"
                mkdir -p /pool/models
                python3 -c "import urllib.request; urllib.request.urlretrieve('https://raw.githubusercontent.com/snakers4/silero-vad/master/src/silero_vad/data/silero_vad.onnx', '$MODEL.tmp')"
                echo "$MODEL_SHA256  $MODEL.tmp" | sha256sum -c - >/dev/null
                mv "$MODEL.tmp" "$MODEL"
              fi
              export HEAR_SILERO_VAD_MODEL="$MODEL"
              exec python /app/tools/hear_heartbeat_receiver.py --port 5051
          ports:
            - { name: http, containerPort: 5051, hostPort: 5051 }
          env:
            - { name: HEAR_HEARTBEAT_TTL_S, value: "30" }
            - { name: HEAR_HEARTBEAT_SOCKET_TIMEOUT_S, value: "0.5" }
            - { name: HEAR_DURABLE_STORE, value: "sqlite" }
            - { name: HEAR_DURABLE_DB, value: "/state/heartbeat-receiver.sqlite3" }
            - { name: HEAR_DURABLE_REPLAY_LIMIT, value: "256" }
            - { name: HEAR_BATCH_CREDENTIALS_FILE, value: "/var/run/dama-hear/batch-credentials/credentials.json" }
            - { name: HEAR_BATCH_RAW_DIR, value: "/state/ingest-batch" }
            - { name: HEAR_SILERO_VAD_MODEL, value: "/pool/models/silero_vad.onnx" }
            - { name: REDIS_HOST, value: "audit-redis.infra.svc.cluster.local" }
            - { name: REDIS_PORT, value: "6379" }
            - name: REDIS_PASS
              valueFrom:
                secretKeyRef:
                  name: dama-redis-secret
                  key: REDIS_PASS
                  optional: true
            - name: HEAR_HEARTBEAT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hear-heartbeat-token
                  key: token
          volumeMounts:
            - { name: code, mountPath: /app/hear/__init__.py, subPath: hear__init__.py }
            - { name: code, mountPath: /app/hear/sketch.py, subPath: hear_sketch.py }
            - { name: code, mountPath: /app/hear/identity.py, subPath: hear_identity.py }
            - { name: code, mountPath: /app/hear/clips.py, subPath: hear_clips.py }
            - { name: code, mountPath: /app/hear/ingest/__init__.py, subPath: hear_ingest__init__.py }
            - { name: code, mountPath: /app/hear/ingest/envelope.py, subPath: hear_ingest_envelope.py }
            - { name: code, mountPath: /app/hear/ingest/batch.py, subPath: hear_ingest_batch.py }
            - { name: code, mountPath: /app/hear/ingest/observability.py, subPath: hear_ingest_observability.py }
            - { name: code, mountPath: /app/hear/ingest/clipupload.py, subPath: hear_ingest_clipupload.py }
            - { name: code, mountPath: /app/hear/privacy/__init__.py, subPath: hear_privacy__init__.py }
            - { name: code, mountPath: /app/hear/privacy/purge.py, subPath: hear_privacy_purge.py }
            - { name: code, mountPath: /app/hear/privacy/silero_vad.py, subPath: hear_privacy_silero_vad.py }
            - { name: code, mountPath: /app/hear/privacy/transient_tdoa.py, subPath: hear_privacy_transient_tdoa.py }
            - { name: code, mountPath: /app/hear/resample.py, subPath: hear_resample.py }
            - { name: code, mountPath: /app/tools/hear_heartbeat_receiver.py, subPath: tools_hear_heartbeat_receiver.py }
            - { name: deps, mountPath: /deps }
            - { name: batch-credentials, mountPath: /var/run/dama-hear/batch-credentials, readOnly: true }
            - { name: pool, mountPath: /pool }
            - { name: state, mountPath: /state }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: "1",  memory: 256Mi }
      volumes:
        - name: code
          configMap:
            name: hear-heartbeat-code
        - name: deps
          emptyDir: {}
        - name: batch-credentials
          secret:
            secretName: hear-batch-credentials
            optional: true
        - name: pool
          persistentVolumeClaim:
            claimName: hear-pool
        - name: state
          persistentVolumeClaim:
            claimName: hear-heartbeat-state
---
apiVersion: v1
kind: Service
metadata:
  name: hear-heartbeat
  namespace: dama
  labels:
    app: hear-heartbeat
spec:
  selector:
    app: hear-heartbeat
  ports:
    - { name: http, port: 5051, targetPort: http }
