---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hear-heartbeat-state
  namespace: dama
  labels:
    app: hear-heartbeat
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hear-heartbeat
  namespace: dama
  labels:
    app: hear-heartbeat
  annotations:
    dama-hear/what: >-
      Receives hear_node heartbeat and event POSTs, commits each accepted record to the
      phase-0 durable outbox, and then reflects it into the existing short-TTL dama:hear:*
      Redis compatibility keys.
spec:
  replicas: 1
  # Recreate, not RollingUpdate: this pod holds hostPort 5051 AND a ReadWriteOnce state PVC, so a
  # surge pod can never become ready alongside the outgoing one -- it stays Pending forever and
  # the rollout hangs. Tear the old pod down first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hear-heartbeat
  template:
    metadata:
      labels:
        app: hear-heartbeat
      annotations:
        # Forces a new ReplicaSet (Recreate: a full pod restart) whenever
        # hear-heartbeat-code.yaml's content changes. The code file below is mounted
        # with subPath, which kubelet's ConfigMap sync does not live-update.
        checksum/hear-heartbeat-code: '825ab427bb565eedf85b95cc00ca6fc351b1325b3f79f5c79d2ea8d2dc4b4b1e'
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "5051"
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: receiver
          image: python:3.13-slim
          command: ["/bin/sh", "-lc"]
          args:
            - |
              set -e
              LIB=/deps
              export PYTHONPATH="$LIB:/app"
              if ! python -c 'import redis,sys; sys.exit(0 if redis.__version__=="7.4.0" else 1)' 2>/dev/null; then
                echo "installing redis==7.4.0 into $LIB"
                pip install --no-cache-dir --upgrade --target "$LIB" 'redis==7.4.0' >/dev/null 2>&1
              fi
              exec python /app/tools/hear_heartbeat_receiver.py --port 5051
          ports:
            - { name: http, containerPort: 5051, hostPort: 5051 }
          env:
            - { name: HEAR_HEARTBEAT_TTL_S, value: "30" }
            - { name: HEAR_HEARTBEAT_SOCKET_TIMEOUT_S, value: "0.5" }
            - { name: HEAR_DURABLE_STORE, value: "sqlite" }
            - { name: HEAR_DURABLE_DB, value: "/state/heartbeat-receiver.sqlite3" }
            - { name: HEAR_DURABLE_REPLAY_LIMIT, value: "256" }
            - { name: REDIS_HOST, value: "audit-redis.infra.svc.cluster.local" }
            - { name: REDIS_PORT, value: "6379" }
            - name: REDIS_PASS
              valueFrom:
                secretKeyRef:
                  name: dama-redis-secret
                  key: REDIS_PASS
                  optional: true
            - name: HEAR_HEARTBEAT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hear-heartbeat-token
                  key: token
          volumeMounts:
            - { name: code, mountPath: /app/hear/__init__.py, subPath: hear__init__.py }
            - { name: code, mountPath: /app/hear/ingest/__init__.py, subPath: hear_ingest__init__.py }
            - { name: code, mountPath: /app/hear/ingest/envelope.py, subPath: hear_ingest_envelope.py }
            - { name: code, mountPath: /app/hear/ingest/batch.py, subPath: hear_ingest_batch.py }
            - { name: code, mountPath: /app/hear/ingest/observability.py, subPath: hear_ingest_observability.py }
            - { name: code, mountPath: /app/tools/hear_heartbeat_receiver.py, subPath: tools_hear_heartbeat_receiver.py }
            - { name: deps, mountPath: /deps }
            - { name: state, mountPath: /state }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: "1",  memory: 256Mi }
      volumes:
        - name: code
          configMap:
            name: hear-heartbeat-code
        - name: deps
          emptyDir: {}
        - name: state
          persistentVolumeClaim:
            claimName: hear-heartbeat-state
---
apiVersion: v1
kind: Service
metadata:
  name: hear-heartbeat
  namespace: dama
  labels:
    app: hear-heartbeat
spec:
  selector:
    app: hear-heartbeat
  ports:
    - { name: http, port: 5051, targetPort: http }
