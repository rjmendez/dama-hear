  tools_hear_heartbeat_receiver.py: |
    #!/usr/bin/env python3
    """Tiny hear_node heartbeat/event receiver that writes short-TTL Redis state."""
    from __future__ import annotations
    
    import argparse
    import json
    import os
    import re
    import socket
    from datetime import datetime, timezone
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from typing import Any, Callable, Dict, Mapping, Optional
    from urllib.parse import urlparse
    
    import redis
    
    REDIS_HOST = os.environ.get("REDIS_HOST", "audit-redis.infra.svc.cluster.local")
    REDIS_PORT = int(os.environ.get("REDIS_PORT", "6379"))
    REDIS_PASS = os.environ.get("REDIS_PASS")
    AUTH_TOKEN = os.environ.get("HEAR_HEARTBEAT_TOKEN")
    
    
    def _configured_auth_token(token: Optional[str]) -> str:
        if token is None:
            raise ValueError("HEAR_HEARTBEAT_TOKEN / --auth-token must be set")
        token = token.strip()
        if not token:
            raise ValueError("HEAR_HEARTBEAT_TOKEN / --auth-token must be non-empty")
        return token
    
    
    def _parse_port(env_val: Optional[str], default: int = 5051) -> int:
        if not env_val:
            return default
        if env_val.startswith("tcp://"):
            return int(env_val.rsplit(":", 1)[-1])
        try:
            return int(env_val)
        except ValueError:
            return default
    
    
    API_PORT = _parse_port(os.environ.get("HEAR_HEARTBEAT_PORT", "5051"))
    HEARTBEAT_TTL_S = int(os.environ.get("HEAR_HEARTBEAT_TTL_S", "30"))
    MAX_BODY_BYTES = int(os.environ.get("HEAR_HEARTBEAT_MAX_BODY_BYTES", "8192"))
    SOCKET_TIMEOUT_S = float(os.environ.get("HEAR_HEARTBEAT_SOCKET_TIMEOUT_S", "0.5"))
    EVENT_STREAM_KEY = os.environ.get("HEAR_EVENT_STREAM_KEY", "dama:hear:events")
    EVENT_STREAM_MAXLEN = int(os.environ.get("HEAR_EVENT_STREAM_MAXLEN", "1024"))
    RECEIVER_SCHEMA_VERSION = 1
    _DEVICE_ID_RE = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$")
    _CLASS_RE = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$")
    _FW_RE = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._:-]{0,62}$")
    _EVENT_TYPES = {"clip_written", "detection_batch_ready"}
    
    
    class RequestError(ValueError):
        def __init__(self, message: str, status: int = 400):
            super().__init__(message)
            self.status = status
    
    
    class HeartbeatReceiverStore:
        def __init__(self, client: Any, heartbeat_ttl_s: int = HEARTBEAT_TTL_S,
                     event_stream_key: str = EVENT_STREAM_KEY,
                     event_stream_maxlen: int = EVENT_STREAM_MAXLEN,
                     redis_target: Optional[str] = None):
            self.client = client
            self.heartbeat_ttl_s = heartbeat_ttl_s
            self.event_stream_key = event_stream_key
            self.event_stream_maxlen = event_stream_maxlen
            self.redis_target = redis_target or "unknown"
    
        def write_heartbeat(self, payload: Dict[str, Any]) -> Dict[str, Any]:
            record = dict(payload)
            record["received_at"] = utc_now()
            record["receiver_schema_version"] = RECEIVER_SCHEMA_VERSION
            body = encode_json(record)
            node_id = record["device_id"]
            pipe = self.client.pipeline(transaction=False)
            pipe.setex(f"dama:hear:{node_id}", self.heartbeat_ttl_s, body)
            pipe.sadd("dama:hear:devices", node_id)
            pipe.set("dama:hear:latest", body)
            pipe.execute()
            return record
    
        def write_event(self, payload: Dict[str, Any]) -> Dict[str, Any]:
            record = dict(payload)
            record["received_at"] = utc_now()
            record["receiver_schema_version"] = RECEIVER_SCHEMA_VERSION
            body = encode_json(record)
            node_id = record["device_id"]
            pipe = self.client.pipeline(transaction=False)
            pipe.sadd("dama:hear:devices", node_id)
            pipe.set(f"dama:hear:event:{node_id}", body)
            pipe.xadd(self.event_stream_key, {"device_id": node_id, "payload": body},
                      maxlen=self.event_stream_maxlen, approximate=True)
            pipe.execute()
            return record
    
    
    class ReceiverServer(ThreadingHTTPServer):
        daemon_threads = True
        request_queue_size = 16
    
        def __init__(self, server_address, handler_cls, store: HeartbeatReceiverStore):
            super().__init__(server_address, handler_cls)
            self.store = store
    
    
    def utc_now() -> str:
        return datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z")
    
    
    def encode_json(data: Mapping[str, Any]) -> str:
        return json.dumps(data, separators=(",", ":"), sort_keys=True)
    
    
    def _require_object(payload: Any, label: str) -> Dict[str, Any]:
        if not isinstance(payload, dict):
            raise RequestError(f"{label} must be an object")
        return payload
    
    
    def _require_string(payload: Mapping[str, Any], key: str) -> str:
        value = payload.get(key)
        if not isinstance(value, str) or not value.strip():
            raise RequestError(f"{key} must be a non-empty string")
        return value.strip()
    
    
    def _require_ident(payload: Mapping[str, Any], key: str, regex: re.Pattern[str], label: str) -> str:
        value = _require_string(payload, key)
        if not regex.fullmatch(value):
            raise RequestError(f"{key} must be a short {label} token")
        return value
    
    
    def _require_int(payload: Mapping[str, Any], key: str) -> int:
        value = payload.get(key)
        if isinstance(value, bool) or not isinstance(value, int):
            raise RequestError(f"{key} must be an integer")
        return value
    
    
    def _require_bool(payload: Mapping[str, Any], key: str) -> bool:
        value = payload.get(key)
        if not isinstance(value, bool):
            raise RequestError(f"{key} must be a boolean")
        return value
    
    
    def _validate_common(payload: Any, telemetry_path: str, *, require_gps: bool = True) -> Dict[str, Any]:
        body = _require_object(payload, "payload")
        if body.get("telemetry_path") != telemetry_path:
            raise RequestError(f"telemetry_path must be {telemetry_path!r}")
        if body.get("telemetry_schema_version") != 1:
            raise RequestError("telemetry_schema_version must be 1")
        _require_ident(body, "device_id", _DEVICE_ID_RE, "device id")
        _require_ident(body, "class", _CLASS_RE, "class")
        _require_ident(body, "fw_version", _FW_RE, "firmware id")
        _require_int(body, "uptime_s")
    
        # Heartbeats carry the node's current GPS-fix figure; advisory event payloads do NOT, and the
        # firmware serializer in hear_push_payload.h intentionally keeps them that small. Reading
        # `gps.fix` out of every telemetry path therefore rejects the event shape the fleet actually
        # emits, which is exactly the "field exists everywhere" bug this receiver exists to keep out.
        if require_gps:
            gps = _require_object(body.get("gps"), "gps")
            _require_int(gps, "fix")
    
        time_state = _require_object(body.get("time"), "time")
        time_valid = _require_bool(time_state, "valid")
        ts = body.get("ts")
        if time_valid:
            if ts is None:
                raise RequestError("ts is required when time.valid is true")
            _require_string(body, "ts")
        elif ts is not None:
            raise RequestError("ts must be null when time.valid is false")
        return body
    
    
    def validate_heartbeat_payload(payload: Any) -> Dict[str, Any]:
        body = _validate_common(payload, "hear/heartbeat", require_gps=True)
        counters = _require_object(body.get("counters"), "counters")
        for key in ("scene_rows_written", "dets_rows_written", "clips_written", "clips_evicted"):
            _require_int(counters, key)
        if body.get("wifi") is not None:
            wifi = _require_object(body.get("wifi"), "wifi")
            if wifi.get("rssi_dbm") is not None:
                _require_int(wifi, "rssi_dbm")
        return body
    
    
    def validate_event_payload(payload: Any) -> Dict[str, Any]:
        body = _validate_common(payload, "hear/event", require_gps=False)
        event_type = _require_string(body, "event_type")
        if event_type not in _EVENT_TYPES:
            raise RequestError("event_type must be one of %s" % ", ".join(sorted(_EVENT_TYPES)))
        _require_int(body, "event_seq")
        event = _require_object(body.get("event"), "event")
        if event_type == "clip_written":
            _require_string(event, "clip_basename")
            _require_int(event, "clips_written")
            _require_int(event, "clips_evicted")
        else:
            _require_int(event, "dets_rows_written")
            _require_int(event, "batch_rows")
        return body
    
    
    def make_handler(store: HeartbeatReceiverStore,
                     max_body_bytes: int = MAX_BODY_BYTES,
                     auth_token: Optional[str] = AUTH_TOKEN,
                     socket_timeout_s: float = SOCKET_TIMEOUT_S) -> type[BaseHTTPRequestHandler]:
        class ReceiverHandler(BaseHTTPRequestHandler):
            server_version = "hear-heartbeat-receiver/1"
    
            def setup(self) -> None:
                super().setup()
                self.connection.settimeout(socket_timeout_s)
    
            def do_GET(self) -> None:
                if urlparse(self.path).path != "/healthz":
                    self.send_error(404)
                    return
                self.send_json({
                    "status": "ok",
                    "service": "hear-heartbeat-receiver",
                    "redis_target": store.redis_target,
                })
    
            def do_POST(self) -> None:
                path = urlparse(self.path).path
                routes: Dict[str, tuple[Callable[[Any], Dict[str, Any]], Callable[[Dict[str, Any]], Dict[str, Any]]]] = {
                    "/api/hear/heartbeat": (validate_heartbeat_payload, store.write_heartbeat),
                    "/api/hear/event": (validate_event_payload, store.write_event),
                }
                route = routes.get(path)
                if route is None:
                    self.send_error(404)
                    return
                validator, writer = route
                try:
                    self.require_auth(auth_token)
                    writer(validator(self.read_json_body(max_body_bytes)))
                except RequestError as exc:
                    self.send_json({"error": str(exc)}, exc.status)
                    return
                except Exception as exc:  # pragma: no cover - exercised with a fake failing store.
                    self.send_json({"error": "redis write failed", "detail": str(exc)}, 503)
                    return
                self.send_response(204)
                self.send_header("Content-Length", "0")
                self.end_headers()
    
            def require_auth(self, token: Optional[str]) -> None:
                if not token:
                    return
                got = self.headers.get("X-Hear-Token")
                if got != token:
                    raise RequestError("unauthorized", status=401)
    
            def read_json_body(self, max_body_bytes: int) -> Any:
                raw_len = self.headers.get("Content-Length")
                if raw_len is None:
                    raise RequestError("missing Content-Length")
                try:
                    length = int(raw_len)
                except ValueError as exc:
                    raise RequestError("invalid Content-Length") from exc
                if length < 0:
                    raise RequestError("invalid Content-Length")
                if length > max_body_bytes:
                    raise RequestError(
                        f"payload too large ({length} > {max_body_bytes} bytes)", status=413)
                try:
                    raw = self.rfile.read(length)
                except (TimeoutError, socket.timeout) as exc:
                    raise RequestError("request body read timed out", status=408) from exc
                if len(raw) != length:
                    raise RequestError("truncated request body")
                try:
                    return json.loads(raw.decode("utf-8"))
                except UnicodeDecodeError as exc:
                    raise RequestError("request body must be UTF-8 JSON") from exc
                except json.JSONDecodeError as exc:
                    raise RequestError("malformed JSON") from exc
    
            def send_json(self, data: Mapping[str, Any], code: int = 200) -> None:
                body = json.dumps(data, separators=(",", ":")).encode("utf-8")
                self.send_response(code)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
    
            def log_message(self, fmt: str, *args: Any) -> None:
                return
    
        return ReceiverHandler
    
    
    def make_redis_client(redis_host: str = REDIS_HOST, redis_port: int = REDIS_PORT,
                          redis_pass: Optional[str] = REDIS_PASS) -> redis.Redis:
        return redis.Redis(
            host=redis_host,
            port=redis_port,
            password=redis_pass or None,
            decode_responses=True,
            socket_connect_timeout=0.25,
            socket_timeout=0.25,
            retry_on_timeout=False,
        )
    
    
    def create_server(bind: str, port: int, store: HeartbeatReceiverStore,
                      max_body_bytes: int = MAX_BODY_BYTES,
                      auth_token: Optional[str] = AUTH_TOKEN,
                      socket_timeout_s: float = SOCKET_TIMEOUT_S) -> ReceiverServer:
        return ReceiverServer(
            (bind, port),
            make_handler(store, max_body_bytes=max_body_bytes,
                         auth_token=auth_token, socket_timeout_s=socket_timeout_s),
            store,
        )
    
    
    def parse_args(argv: Optional[list[str]] = None) -> argparse.Namespace:
        ap = argparse.ArgumentParser(description=__doc__)
        ap.add_argument("--bind", default="0.0.0.0")
        ap.add_argument("--port", type=int, default=API_PORT)
        ap.add_argument("--redis-host", default=REDIS_HOST)
        ap.add_argument("--redis-port", type=int, default=REDIS_PORT)
        ap.add_argument("--redis-pass", default=REDIS_PASS)
        ap.add_argument("--heartbeat-ttl", type=int, default=HEARTBEAT_TTL_S)
        ap.add_argument("--max-body-bytes", type=int, default=MAX_BODY_BYTES)
        ap.add_argument("--event-stream-key", default=EVENT_STREAM_KEY)
        ap.add_argument("--event-stream-maxlen", type=int, default=EVENT_STREAM_MAXLEN)
        ap.add_argument("--auth-token", default=AUTH_TOKEN)
        ap.add_argument("--socket-timeout-s", type=float, default=SOCKET_TIMEOUT_S)
        return ap.parse_args(argv)
    
    
    def main(argv: Optional[list[str]] = None) -> int:
        args = parse_args(argv)
        auth_token = _configured_auth_token(args.auth_token)
        target = f"{args.redis_host}:{args.redis_port}"
        store = HeartbeatReceiverStore(
            make_redis_client(args.redis_host, args.redis_port, args.redis_pass),
            heartbeat_ttl_s=args.heartbeat_ttl,
            event_stream_key=args.event_stream_key,
            event_stream_maxlen=args.event_stream_maxlen,
            redis_target=target,
        )
        print(f"[hear-heartbeat] Redis target configured -> {target}")
        print(f"[hear-heartbeat] Listening on http://{args.bind}:{args.port}")
        create_server(args.bind, args.port, store, max_body_bytes=args.max_body_bytes,
                      auth_token=auth_token, socket_timeout_s=args.socket_timeout_s).serve_forever()
        return 0
    
    
    if __name__ == "__main__":
        raise SystemExit(main())
    
  tools_hear_mqtt_bridge.py: |
    #!/usr/bin/env python3
    """Bridges hear_node telemetry that arrives over MQTT into dama:hear:* Redis state.
    
    The fleet's LAN subnet turned out unreachable inbound from this cluster (see
    hear-heartbeat.yaml), so hear_node now pushes to dama-gotchi's public AWS ingest API
    instead: hear_node -> API Gateway -> batch_ingest Lambda -> SQS -> forwarder Lambda ->
    Oxalis SQS queue -> dama-sqs-consumer.py (already running, unrelated to this repo) ->
    this cluster's local mqtt-broker, topic `dama/<device_id>/telemetry`.
    
    That broker also carries dama-gotchi's own phone/GNSS telemetry on the same topic
    pattern, keyed only by device_id -- this bridge must ignore anything that is not a
    hear_node message rather than error on it. It reuses hear_heartbeat_receiver's own
    validate_*/write_* logic (rather than re-implementing the schema) specifically so the
    LAN and AWS paths can never drift onto incompatible Redis shapes.
    """
    from __future__ import annotations
    
    import argparse
    import json
    import logging
    import os
    import sys
    from datetime import datetime, timezone
    from typing import Any, Callable, Dict, Optional, Tuple
    
    import paho.mqtt.client as mqtt
    
    sys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))
    from tools.hear_heartbeat_receiver import (  # noqa: E402
        HeartbeatReceiverStore,
        RequestError,
        make_redis_client,
        validate_event_payload,
        validate_heartbeat_payload,
    )
    
    logger = logging.getLogger("hear_mqtt_bridge")
    
    MQTT_HOST = os.environ.get("MQTT_HOST", "mqtt-broker.agents.svc.cluster.local")
    MQTT_PORT = int(os.environ.get("MQTT_PORT", "1883"))
    MQTT_TOPIC = os.environ.get("MQTT_TOPIC", "dama/+/telemetry")
    MQTT_CLIENT_ID = os.environ.get("MQTT_CLIENT_ID", "hear-mqtt-bridge")
    MQTT_KEEPALIVE_S = int(os.environ.get("MQTT_KEEPALIVE_S", "60"))
    
    REDIS_HOST = os.environ.get("REDIS_HOST", "audit-redis.infra.svc.cluster.local")
    REDIS_PORT = int(os.environ.get("REDIS_PORT", "6379"))
    REDIS_PASS = os.environ.get("REDIS_PASS")
    
    # telemetry_path -> (validator, HeartbeatReceiverStore method name). Kept as a lookup table
    # (not if/elif) so adding a third hear_node message kind is one line here, not a new branch
    # in dispatch_message().
    _ROUTES: Dict[str, Tuple[Callable[[Any], Dict[str, Any]], str]] = {
        "hear/heartbeat": (validate_heartbeat_payload, "write_heartbeat"),
        "hear/event": (validate_event_payload, "write_event"),
    }
    
    
    class BridgeStats:
        """Plain counters for observability/tests. Not persisted anywhere."""
    
        def __init__(self) -> None:
            self.accepted = 0
            self.ignored = 0
            self.rejected = 0
            self.malformed = 0
    
    
    def dispatch_message(store: HeartbeatReceiverStore, raw: bytes, topic: str,
                          stats: Optional[BridgeStats] = None) -> Optional[Dict[str, Any]]:
        """Decode and route one MQTT message payload; never raises.
    
        A malformed payload, a message for a device that isn't a hear_node (this topic
        pattern also carries dama-gotchi's own telemetry), or one that fails schema
        validation must not crash the bridge or block the messages behind it -- so every
        failure path here logs and returns None instead of propagating.
        """
        stats = stats if stats is not None else BridgeStats()
        try:
            payload = json.loads(raw.decode("utf-8"))
        except (UnicodeDecodeError, json.JSONDecodeError) as exc:
            stats.malformed += 1
            logger.warning("dropping malformed message on %s: %s", topic, exc)
            return None
        if not isinstance(payload, dict):
            stats.malformed += 1
            logger.warning("dropping non-object message on %s", topic)
            return None
    
        route = _ROUTES.get(payload.get("telemetry_path"))
        if route is None:
            stats.ignored += 1
            return None
        validator, writer_name = route
    
        try:
            # batch_ingest/forwarder normalize the transport timestamp to numeric
            # milliseconds. The Redis contract uses an RFC3339 string.
            # Seconds, like the receiver's own timestamps; sub-second precision stays in ts_ms.
            ts = payload.get("ts")
            if isinstance(ts, (int, float)) and not isinstance(ts, bool):
                payload = dict(payload)
                payload["ts"] = datetime.fromtimestamp(ts / 1000, tz=timezone.utc).isoformat(
                    timespec="seconds").replace("+00:00", "Z")
            body = validator(payload)
        except RequestError as exc:
            stats.rejected += 1
            logger.warning("rejected %s message on %s: %s", payload.get("telemetry_path"), topic, exc)
            return None
        except (ValueError, OverflowError, OSError) as exc:
            # A numeric ts outside what datetime can represent (inf, NaN, absurd magnitudes) is a bad
            # message, not a reason to stop the bridge.
            stats.rejected += 1
            logger.warning("rejected %s message on %s: unusable numeric ts: %s",
                           payload.get("telemetry_path"), topic, exc)
            return None
    
        writer: Callable[[Dict[str, Any]], Dict[str, Any]] = getattr(store, writer_name)
        record = writer(body)
        stats.accepted += 1
        return record
    
    
    def make_client(store: HeartbeatReceiverStore, topic: str = MQTT_TOPIC,
                    client_id: str = MQTT_CLIENT_ID,
                    stats: Optional[BridgeStats] = None) -> mqtt.Client:
        stats = stats if stats is not None else BridgeStats()
        client = mqtt.Client(client_id=client_id, clean_session=True)
    
        def _on_connect(c, userdata, flags, rc, *args):
            if rc != 0:
                logger.error("mqtt connect failed rc=%s", rc)
                return
            logger.info("connected; subscribing to %s", topic)
            c.subscribe(topic, qos=1)
    
        def _on_message(c, userdata, msg):
            dispatch_message(store, msg.payload, msg.topic, stats)
    
        def _on_disconnect(c, userdata, rc, *args):
            if rc != 0:
                logger.warning("unexpected mqtt disconnect rc=%s; client will auto-reconnect", rc)
    
        client.on_connect = _on_connect
        client.on_message = _on_message
        client.on_disconnect = _on_disconnect
        client.stats = stats
        return client
    
    
    def parse_args(argv: Optional[list[str]] = None) -> argparse.Namespace:
        ap = argparse.ArgumentParser(description=__doc__)
        ap.add_argument("--mqtt-host", default=MQTT_HOST)
        ap.add_argument("--mqtt-port", type=int, default=MQTT_PORT)
        ap.add_argument("--mqtt-topic", default=MQTT_TOPIC)
        ap.add_argument("--mqtt-client-id", default=MQTT_CLIENT_ID)
        ap.add_argument("--mqtt-keepalive-s", type=int, default=MQTT_KEEPALIVE_S)
        ap.add_argument("--redis-host", default=REDIS_HOST)
        ap.add_argument("--redis-port", type=int, default=REDIS_PORT)
        ap.add_argument("--redis-pass", default=REDIS_PASS)
        return ap.parse_args(argv)
    
    
    def main(argv: Optional[list[str]] = None) -> int:
        logging.basicConfig(level=logging.INFO, format="[hear-mqtt-bridge] %(message)s")
        args = parse_args(argv)
        redis_target = f"{args.redis_host}:{args.redis_port}"
        store = HeartbeatReceiverStore(
            make_redis_client(args.redis_host, args.redis_port, args.redis_pass),
            redis_target=redis_target,
        )
        client = make_client(store, topic=args.mqtt_topic, client_id=args.mqtt_client_id)
        logger.info("Redis target -> %s", redis_target)
        logger.info("MQTT broker -> %s:%s topic=%s", args.mqtt_host, args.mqtt_port, args.mqtt_topic)
        client.connect(args.mqtt_host, args.mqtt_port, keepalive=args.mqtt_keepalive_s)
        client.loop_forever()
        return 0
    
    
    if __name__ == "__main__":
        raise SystemExit(main())
    
