    #: `refused` and `expired` are terminal for the *upload*; `purged` is terminal for the
    #: `clip_key` itself (silero-vad-privacy-contract.md §6).
    CLIP_KEY_TERMINAL_STATES: Tuple[str, ...] = (STATE_PROMOTED, STATE_PURGED)
    
