  hear_clips.py: |
    #!/usr/bin/env python3
    """The clip store: names off a node, WAV bytes into the pool, and one append-only index of both.
    
    ⚠️NOT ONE CLIP HAD EVER LEFT A NODE. Measured 2026-09-09 across the fleet: 625 clips written,
    ~478 already destroyed. Every node writes 4.0 s WAVs into /clips against a 6,291,456 B budget --
    exactly 49 files of 128,044 B -- and evicts to make room. The pool is the archive; the card is a
    buffer that is already full on all three nodes (`budget_left_clips 0`).
    
    WHAT THIS MODULE IS FOR, and what it deliberately is not:
    
      * it turns a node-supplied string into a local path, in ONE place, refusing everything else
      * it probes the 44-byte WAV header without decoding audio, and names every way that can fail
      * it keeps `clips/index.jsonl`, which is the record of what arrived AND of what was destroyed
    
    ⚠️THE INDEX IS THE DURABLE RECORD; THE AUDIO IS A CACHE. `prune()` deletes WAVs and never index
    lines. A clip the node has already evicted cannot be re-fetched from anywhere, so the row that
    says it existed, when, on which node and why it did not arrive is the only thing left of it.
    
    ⚠️IDENTITY IS THE NAME, NOT THE CONTENT. `clip_key` hashes node + boot + sample, which is unique
    by construction and is known BEFORE the bytes are -- and skipping a fetch is the entire cost this
    module exists to avoid. A content hash would collide two clips of the same silence and drop a
    real timestamped event. hear/pool.py:71 solved the same problem the same way.
    """
    from __future__ import annotations
    
    import hashlib
    import json
    import os
    import re
    import shutil
    from typing import Any, Dict, Iterable, List, Optional
    
    CLIP_SCHEMA_VERSION = 1
    #: 44-byte canonical header + 64000 samples * 2 bytes. night_node.ino CLIP_BYTES.
    CLIP_BYTES = 128044
    CLIP_PRE_S = 1.0
    CLIP_POST_S = 3.0
    CLIP_DIR = "/clips"
    INDEX_NAME = "index.jsonl"
    FS_NOMINAL_HZ = 16000.0
    #: Measured header spread is 15986-16000 Hz; 64 Hz is 4x the observed 14 Hz.
    FS_TOLERANCE_HZ = 64.0
    
    #: Every terminal and non-terminal state one clip can be in. `index_row` refuses anything else --
    #: an outcome that is not on this list cannot be counted, and an uncounted refusal is the failure
    #: this whole lane exists to prevent.
    OUTCOMES = ("stored", "already_held", "evicted_before_fetch", "refused_bad_body",
                "refused_short", "refused_http", "deferred_by_cap", "refused_name",
                "probed_404", "refused_store")
    
    #: Once an index row reaches one of these, the name is never probed again. Without it the drain
    #: re-probes 321 already-dead nyquist names every 15 minutes forever (measured 2026-09-09).
    #: ⚠️`probed_404` IS DELIBERATELY NOT HERE. night_node.ino:2436 answers 404 for ANY failed
    #: SD.open, not only for a missing file: max_files is 8 and the long-lived set reaches 6
    #: (dets.csv + scene.csv + the open clip + /ls's directory and entry + health.csv) with
    #: clip_evict_worse_than() taking 2 more during an eviction (night_node.ino:1725-1731). One
    #: descriptor-exhausted moment must not retire a clip that is still on the card.
    TERMINAL_OUTCOMES = ("stored", "evicted_before_fetch")
    
    #: Consecutive 404s before a name is called destroyed. 2, not 1: a 404 costs ~0.1 s, so
    #: confirming the 321 already-dead nyquist names costs one extra ~32 s pass, once.
    CONFIRM_404 = 2
    
    #: ⚠️BOTH SHIPPED SHAPES. The flashed fleet writes `<node>-<boot>-<sample>.wav`; the checkout's
    #: clip_name() prepends `%02u-` priority. A parser that knew only one would refuse the entire
    #: live fleet or the entire next reflash.
    _NAME_RE = re.compile(r"^(?:(\d{2})-)?([A-Za-z0-9_]+)-([0-9a-fA-F]+)-(\d+)\.wav$")
    _MAX_BASENAME = 64
    
    
    def parse_clip_name(name: str) -> Dict[str, Any]:
        """A node-side clip path -> its parts. Raises ValueError on anything else.
    
        ⚠️THIS IS THE ONLY PLACE A NODE-SUPPLIED STRING BECOMES A LOCAL PATH. The dets.csv `clip`
        column is written by firmware and read by a process with the PVC mounted; `..`, a nested
        separator and a non-.wav suffix are all refused HERE so no caller has to remember to. Callers
        build local paths from `basename`, never from `raw`.
        """
        if not isinstance(name, str):
            raise ValueError("clip name is %r, not a string" % (name,))
        raw = name.strip()
        if not raw:
            raise ValueError("empty clip name")
        if ".." in raw:
            raise ValueError("clip name %r contains '..'" % raw)
        if not raw.startswith(CLIP_DIR + "/"):
            raise ValueError("clip name %r is not under %s/" % (raw, CLIP_DIR))
        basename = raw[len(CLIP_DIR) + 1:]
        if "/" in basename:
            raise ValueError("clip name %r nests below %s/" % (raw, CLIP_DIR))
        if len(basename) > _MAX_BASENAME:
            raise ValueError("clip basename is %d chars, over the %d cap" % (len(basename),
                                                                            _MAX_BASENAME))
        m = _NAME_RE.match(basename)
        if not m:
            raise ValueError("clip basename %r is not <prio->?<node>-<boot>-<sample>.wav" % basename)
        prio, node, boot, sample = m.groups()
        return {"raw": raw, "basename": basename, "node": node, "boot": boot,
                "sample": int(sample), "prio": None if prio is None else int(prio)}
    
    
    def clip_key(node: str, boot: str, sample: int) -> str:
        """The identity of one clip. Same shape as hear.pool.key(): sha256 truncated to 32 hex."""
        h = hashlib.sha256()
        for part in ("clip", node, boot, str(sample)):
            h.update(part.encode())
            h.update(b"\x1f")
        return h.hexdigest()[:32]
    
    
    def bad_name_key(node: str, raw: str) -> str:
        """Identity for a dets cell that would not parse, so it can be counted and de-duplicated.
    
        It gets a key of its own rather than being dropped: a name the firmware wrote and this parser
        refuses is a firmware/parser disagreement, and one that vanished from the census would be
        indistinguishable from a clip that was never written.
        """
        h = hashlib.sha256()
        for part in ("clip-badname", node, raw):
            h.update(part.encode())
            h.update(b"\x1f")
        return h.hexdigest()[:32]
    
    
    def _day(ts_utc_s: Optional[float]) -> str:
        """UTC day partition, hear.pool._day() semantics: `unanchored` rather than a guessed day."""
        if not ts_utc_s:
            return "unanchored"
        import datetime as _dt
        return _dt.datetime.fromtimestamp(ts_utc_s, _dt.timezone.utc).strftime("%Y-%m-%d")
    
    
    def clips_dir(root: str) -> str:
        return os.path.join(root, "clips")
    
    
    def store_path(root: str, day: str, node: str, basename: str) -> str:
        return os.path.join(clips_dir(root), day, node, basename)
    
    
    def index_path(root: str) -> str:
        return os.path.join(clips_dir(root), INDEX_NAME)
    
    
    def wav_probe(body: bytes) -> Dict[str, Any]:
        """Parse the 44-byte canonical header. No audio is decoded.
    
        ⚠️IT DOES NOT REQUIRE 16000 Hz. mach shipped a whole boot headed 22624 Hz, and refusing it
        here would delete the evidence of the fs_clean latch bug rather than record it. The rate is
        REPORTED; whether it is usable is the tagger's decision, not the store's.
        """
        out: Dict[str, Any] = {"ok": False, "reason": None, "fs_hz": None, "channels": None,
                               "bits": None, "data_bytes": None, "total_bytes": len(body)}
        if len(body) < 44:
            out["reason"] = "header_short_%d" % len(body)
            return out
        if body[0:4] != b"RIFF":
            out["reason"] = "not_riff"
            return out
        if body[8:12] != b"WAVE":
            out["reason"] = "not_wave"
            return out
        if body[12:16] != b"fmt ":
            out["reason"] = "no_fmt_chunk"
            return out
        fmt = int.from_bytes(body[20:22], "little")
        out["channels"] = int.from_bytes(body[22:24], "little")
        out["fs_hz"] = int.from_bytes(body[24:28], "little")
        out["bits"] = int.from_bytes(body[34:36], "little")
        if body[36:40] != b"data":
            out["reason"] = "no_data_chunk"
            return out
        out["data_bytes"] = int.from_bytes(body[40:44], "little")
        if fmt != 1:
            out["reason"] = "audio_format_%d" % fmt
            return out
        if out["channels"] != 1:
            out["reason"] = "channels_%d" % out["channels"]
            return out
        if out["bits"] != 16:
            out["reason"] = "bits_%d" % out["bits"]
            return out
        if 44 + out["data_bytes"] != len(body):
            out["reason"] = "data_len_%d_body_%d" % (out["data_bytes"], len(body))
            return out
        if len(body) != CLIP_BYTES:
            out["reason"] = "total_%d_expected_%d" % (len(body), CLIP_BYTES)
            return out
        out["ok"] = True
        return out
    
    
    def index_row(*, clip: str, parts: Optional[Dict[str, Any]], node: str, body: Optional[bytes],
                  probe: Optional[Dict[str, Any]], dets: Dict[str, Any], path: Optional[str],
                  outcome: str, fetched_at: float, reason: Optional[str] = None,
                  probe_404s: int = 0) -> Dict[str, Any]:
        """One index line.
    
        ⚠️IT NEVER INVENTS A TIME. Every time field is copied from the parent dets row or left None,
        and `t_start/t_end` are null for an unanchored clip rather than derived from `fetched_at`.
        They exist at all so no consumer re-derives CLIP_PRE_SAMPLES for itself.
    
        ⚠️`fs_hz` AND `wav_header_fs_hz` TRAVEL SIDE BY SIDE, ALWAYS. The CSV's estimate and the
        file's own header disagreed by 6,624 Hz for a whole boot on mach. Keeping one would have made
        that invisible; keeping the disagreement is the point.
        """
        if outcome not in OUTCOMES:
            raise ValueError("unknown clip outcome %r; known: %s" % (outcome, ", ".join(OUTCOMES)))
        ts = dets.get("ts_utc_s")
        anchored = bool(dets.get("anchored"))
        row: Dict[str, Any] = {
            "schema_version": CLIP_SCHEMA_VERSION,
            "clip_key": (clip_key(parts["node"], parts["boot"], parts["sample"]) if parts
                         else bad_name_key(node, clip)),
            "clip": clip,
            "basename": parts["basename"] if parts else None,
            "node": node,
            "boot": parts["boot"] if parts else None,
            "sample": parts["sample"] if parts else None,
            "prio": parts["prio"] if parts else None,
            "outcome": outcome,
            "reason": reason,
            "path": path,
            "bytes": len(body) if body is not None else None,
            "sha256": hashlib.sha256(body).hexdigest() if body is not None else None,
            "utc_us": dets.get("utc_us"),
            "ts_utc_s": ts,
            "anchored": anchored,
            "t_start_utc_s": (ts - CLIP_PRE_S) if (anchored and ts) else None,
            "t_end_utc_s": (ts + CLIP_POST_S) if (anchored and ts) else None,
            "uptime_s": dets.get("uptime_s"),
            "fs_hz": dets.get("fs_hz"),
            "wav_header_fs_hz": (probe or {}).get("fs_hz"),
            "trigger": dets.get("trigger"),
            "clip_why": dets.get("clip_why"),
            "dets_origin": dets.get("dets_origin"),
            "record_key": dets.get("record_key"),
            "fetched_at": fetched_at,
            "probe_404s": probe_404s,
        }
        return row
    
    
    def read_index(root: str) -> Dict[str, Dict[str, Any]]:
        """clip_key -> the LAST line for that key. One pass, the way Pool.keys() does it.
    
        An unreadable line is skipped rather than fatal: the index is append-only and a torn tail
        from a killed pod must not make the whole negative cache unreadable, which would re-probe
        every dead name on the card.
        """
        p = index_path(root)
        out: Dict[str, Dict[str, Any]] = {}
        if not os.path.exists(p):
            return out
        with open(p, "r", errors="replace") as fh:
            for line in fh:
                line = line.strip()
                if not line:
                    continue
                try:
                    row = json.loads(line)
                except Exception:
                    continue
                k = row.get("clip_key")
                if isinstance(k, str):
                    out[k] = row
        return out
    
    
    def read_outcomes(root: str) -> Dict[str, Dict[str, Any]]:
        """clip_key -> just the two fields the negative cache needs. The SAME last-line-wins pass as
        `read_index`, at a measured 191 B resident per key against that function's 3,096 B.
    
        ⚠️THE DRAIN MUST NOT MATERIALISE THE WHOLE INDEX. The index is append-only and never
        compacted; at the spec's 1,109 clips/day the full-row dict reaches the drain container's
        512Mi limit in ~152 days and the drain then OOMKills, which returns the fleet to destroying
        every clip. The same walk at 191 B/key is ~7 years, and nothing here reads a field the
        dispatch loop does not use.
        """
        p = index_path(root)
        out: Dict[str, Dict[str, Any]] = {}
        if not os.path.exists(p):
            return out
        with open(p, "r", errors="replace") as fh:
            for line in fh:
                line = line.strip()
                if not line:
                    continue
                try:
                    row = json.loads(line)
                except Exception:
                    continue
                k = row.get("clip_key")
                if isinstance(k, str):
                    out[k] = {"outcome": row.get("outcome"), "probe_404s": row.get("probe_404s") or 0}
        return out
    
    
    def rows_for_basenames(root: str, names) -> Dict[str, Dict[str, Any]]:
        """basename -> its LAST index row, for the given basenames only.
    
        Same reason as `read_outcomes`: `prune` needs whole rows, but only for the handful of files it
        actually deleted, so it streams the index rather than holding all of it.
        """
        want = set(names)
        out: Dict[str, Dict[str, Any]] = {}
        p = index_path(root)
        if not want or not os.path.exists(p):
            return out
        with open(p, "r", errors="replace") as fh:
            for line in fh:
                line = line.strip()
                if not line:
                    continue
                try:
                    row = json.loads(line)
                except Exception:
                    continue
                b = row.get("basename")
                if b in want:
                    out[b] = row
        return out
    
    
    def append_index(root: str, rows: Iterable[Dict[str, Any]]) -> int:
        p = index_path(root)
        os.makedirs(os.path.dirname(p), exist_ok=True)
        n = 0
        with open(p, "a") as fh:
            for row in rows:
                fh.write(json.dumps(row, sort_keys=True) + "\n")
                n += 1
        return n
    
    
    def _audio_files(root: str) -> List[Dict[str, Any]]:
        """Every stored WAV under clips/<day>/<node>/, with its day, node and size."""
        base = clips_dir(root)
        out: List[Dict[str, Any]] = []
        if not os.path.isdir(base):
            return out
        for day in sorted(os.listdir(base)):
            d = os.path.join(base, day)
            if not os.path.isdir(d):
                continue
            for node in sorted(os.listdir(d)):
                nd = os.path.join(d, node)
                if not os.path.isdir(nd):
                    continue
                for fn in sorted(os.listdir(nd)):
                    if not fn.endswith(".wav"):
                        continue
                    p = os.path.join(nd, fn)
                    try:
                        st = os.stat(p)
                    except OSError:
                        continue
                    out.append({"day": day, "node": node, "basename": fn, "path": p,
                                "bytes": st.st_size, "mtime": st.st_mtime})
        return out
    
    
    def sweep_tmp(root: str, now: float, older_than_s: float = 900.0) -> Dict[str, Any]:
        """Delete abandoned `*.tmp` part-files under clips/<day>/<node>/.
    
        ⚠️`_audio_files` FILTERS ON `.wav`, SO A `.wav.<pid>.tmp` IS INVISIBLE TO THE CAP. A pod
        killed by `activeDeadlineSeconds: 780` mid-write leaks up to 128044 B per node per run onto a
        5Gi PVC that nothing else would ever reclaim. `older_than_s` is one drain interval, and the
        pid in the name means a live writer's file is never the one being swept.
        """
        base = clips_dir(root)
        out: Dict[str, Any] = {"tmp_deleted": 0, "tmp_bytes": 0}
        if not os.path.isdir(base):
            return out
        for day in sorted(os.listdir(base)):
            d = os.path.join(base, day)
            if not os.path.isdir(d):
                continue
            for node in sorted(os.listdir(d)):
                nd = os.path.join(d, node)
                if not os.path.isdir(nd):
                    continue
                for fn in sorted(os.listdir(nd)):
                    if not fn.endswith(".tmp"):
                        continue
                    p = os.path.join(nd, fn)
                    try:
                        st = os.stat(p)
                        if now - st.st_mtime < older_than_s:
                            continue
                        os.remove(p)
                    except OSError:
                        continue
                    out["tmp_deleted"] += 1
                    out["tmp_bytes"] += st.st_size
        return out
    
    
    def audio_bytes(root: str) -> int:
        return sum(f["bytes"] for f in _audio_files(root))
    
    
    def _day_order(day: str) -> tuple:
        """Oldest UTC day first. `unanchored` sorts LAST because it has no day to compare and any
        ordering imposed on it would be a guess presented as a measurement."""
        return (1, "") if day == "unanchored" else (0, day)
    
    
    def _prune_order(f: Dict[str, Any]) -> tuple:
        """Deletion order: `unanchored` FIRST, by file mtime, then the dated days oldest first.
    
        ⚠️THE OPPOSITE OF `_day_order`, AND DELIBERATELY. An anchored clip carries utc_us,
        t_start/t_end and a record_key that joins it to its sketch and its scene rows; an unanchored
        one carries none of that and joins to nothing. Sorting unanchored last paid the whole cap out
        of the joinable clips and protected the ones with the least recoverable context. Within
        `unanchored` the order is mtime -- a measured arrival time, not a day guessed from nothing.
        """
        if f["day"] == "unanchored":
            return (0, f["mtime"], f["node"], f["basename"])
        return (1, f["day"], f["node"], f["basename"])
    
    
    def prune(root: str, max_bytes: int, now: float) -> Dict[str, Any]:
        """Delete whole WAV files, `unanchored` first and then oldest UTC day, until the audio tree
        is at or under max_bytes. Abandoned `*.tmp` part-files are swept on every call, cap or no cap.
    
        ⚠️AUDIO IS THE ONLY PRUNABLE THING. The index row survives and gains `audio_pruned_at`, which
        is appended as a new line (the index is append-only and `read_index` keeps the last line per
        key) rather than rewritten in place. The row's outcome stays `stored`, so a pruned clip is
        still never re-probed: the node destroyed it long ago and the 404 would cost a request to
        learn nothing.
        """
        files = _audio_files(root)
        before = sum(f["bytes"] for f in files)
        out: Dict[str, Any] = {"bytes_before": before, "bytes_after": before,
                               "files_deleted": 0, "days_touched": []}
        out.update(sweep_tmp(root, now))
        if max_bytes is None or before <= max_bytes:
            return out
        files.sort(key=_prune_order)
        running, deleted, days, gone = before, 0, [], []
        for f in files:
            if running <= max_bytes:
                break
            try:
                os.remove(f["path"])
            except OSError:
                continue
            running -= f["bytes"]
            deleted += 1
            if f["day"] not in days:
                days.append(f["day"])
            gone.append(f["basename"])
        rows = []
        for row in rows_for_basenames(root, gone).values():
            r = dict(row)
            r["audio_pruned_at"] = now
            rows.append(r)
        if rows:
            append_index(root, rows)
        out["bytes_after"] = running
        out["files_deleted"] = deleted
        out["days_touched"] = days
        return out
    
    
    def free_bytes(root: str) -> int:
        """Free bytes on the filesystem holding the pool. The clip lane refuses to fill a PVC."""
        os.makedirs(root, exist_ok=True)
        return shutil.disk_usage(root).free
    
  hear_tags.py: |
    #!/usr/bin/env python3
    """The tag store: what a model said about a pooled clip, and the read-only join back to scene.csv.
    
    ⚠️A TAG IS A MODEL'S OPINION, NEVER A LABEL. `provenance` is the literal string "model" on every
    row this module writes, and it is written here rather than inferred by any caller, so no code
    path can promote a score into looking like something a human heard. The one thing this project
    has already done wrong at scale is train on its own model's output -- all 35 dama ant models were
    fitted on circular self-labels -- and the guard against repeating it is that the tag rows say, in
    a machine-readable field, what they are.
    
    ⚠️IT NEVER IMPORTS hear.pool, AND THAT IS LOAD-BEARING RATHER THAN STYLE. `scene_overlap` takes
    an already-constructed Pool. deploy/k8s/gen_configmap.py resolves every `hear.*` import in a
    shipped module -- by an `ast.walk`, which sees a function-local import exactly as well as a
    top-level one -- and would then correctly demand hear/pool.py (and numpy, and scenefile, and
    corpus) in the hear-tag bundle for the sake of one analysis-only query the CronJob never calls.
    Taking the Pool as an argument is what keeps that closure honest instead of dodged.
    
    ⚠️THE SAMPLE JOIN IS WEAKER THAN THE UTC JOIN AND SAYS SO IN ITS OWN RESULT. Neither scene.csv
    nor dets.csv carries a boot id, and `sample` restarts at 0 on every boot, so two rows with the
    same sample counter can be from different boots hours apart. `basis` is "utc" whenever the clip
    is anchored; the sample basis is OFF unless a caller asks for it, and when it is used the result
    carries `weak: True` and the reason. A silent match across a reboot would be indistinguishable
    from a real one, which is the only kind of wrong answer this repo treats as worse than no answer.
    """
    from __future__ import annotations
    
    import hashlib
    import json
    import os
    from typing import Any, Dict, Iterator, List, Optional, Set, Tuple
    
    TAG_SCHEMA_VERSION = 1
    TAGS_NAME = "tags.jsonl"
    
    #: The clip's own geometry, from hear.clips. Repeated here as a local constant rather than
    #: imported so that a bundle carrying tags.py without clips.py still parses; the two are checked
    #: against each other by tests/test_hear_tag.py.
    CLIP_PRE_S = 1.0
    CLIP_POST_S = 3.0
    FS_NOMINAL_HZ = 16000.0
    
    #: How many scene rows one overlap query will return before it says it truncated. A 4.0 s clip
    #: covers 4 or 5 rows of 1.024 s, so anything near this cap means the query matched something it
    #: should not have -- it is a tripwire, not a page size.
    SCENE_ROWS_CAP = 64
    
    BASIS_UTC = "utc"
    BASIS_SAMPLE = "sample"
    BASIS_NONE = "none"
    
    
    def tags_path(root: str) -> str:
        return os.path.join(root, "clips", TAGS_NAME)
    
    
    def tag_key(clip_key: str, model_name: str, model_version: str,
                model_sha256: Optional[str] = None) -> str:
        """Identity of one (clip, model, model version, WEIGHTS DIGEST). sha256 truncated to 32 hex.
    
        Re-tagging with the SAME weights is a no-op duplicate the reader collapses; a NEW version or a
        NEW digest produces a DIFFERENT key and therefore a new row beside the old one. Nothing is
        overwritten, because the old row is the only record of what the previous model said about
        audio that may already have been pruned.
    
        ⚠️THE DIGEST IS IN THE KEY BECAUSE THE VERSION STRING IS A PROMISE AND THE DIGEST IS A
        MEASUREMENT. `model_block` already says "the sha256 IS the identity"; keying on the version
        alone meant a re-exported yamnet.tflite dropped in under the same MODEL_VERSION was treated
        as already-tagged for every clip already scored, and clips/tags.jsonl then held two models'
        scores under one version string with nothing anywhere comparing digests.
        """
        h = hashlib.sha256()
        for part in ("tag", clip_key, model_name, model_version, model_sha256 or ""):
            h.update(part.encode())
            h.update(b"\x1f")
        return h.hexdigest()[:32]
    
    
    def read_tags(root: str) -> Iterator[Dict[str, Any]]:
        """Every stored tag row. An unparseable line is skipped, not fatal: the store is append-only
        and a torn tail from a killed pod must not make the whole resume set unreadable."""
        p = tags_path(root)
        if not os.path.exists(p):
            return
        with open(p, "r", errors="replace") as fh:
            for line in fh:
                line = line.strip()
                if not line:
                    continue
                try:
                    yield json.loads(line)
                except Exception:
                    continue
    
    
    def read_resume(root: str) -> Tuple[Set[str], Dict[str, int]]:
        """ONE pass over the tag store -> (every tag_key held, `name/version/sha256` -> row count).
    
        One pass because `run()` needs both and the store is the only thing either can be read from;
        two passes over a file that grows with the corpus is the kind of cost that gets a check
        disabled. `versions_held` is the reported half, and it is now on a production path rather
        than being a function only the tests ever called.
        """
        keys: Set[str] = set()
        versions: Dict[str, int] = {}
        for r in read_tags(root):
            k = r.get("tag_key")
            if isinstance(k, str):
                keys.add(k)
            m = r.get("model") or {}
            vk = "%s/%s/%s" % (m.get("name"), m.get("version"), m.get("sha256"))
            versions[vk] = versions.get(vk, 0) + 1
        return keys, versions
    
    
    def read_tagged(root: str) -> Set[str]:
        """Every tag_key already held. THE resume token, the same shape as hear_score's key rescan --
        no watermark, so there is nothing to tear and no second source of truth to disagree with."""
        return read_resume(root)[0]
    
    
    def versions_held(root: str) -> Dict[str, int]:
        """`name/version/sha256` -> row count. ⚠️VERSION MIXING IS REPORTED, NEVER MERGED. Two model
        versions scoring the same clip produce two rows by construction (both the version and the
        weights digest are in the key), and a consumer that averaged or de-duplicated across them
        would be averaging two different models.
    
        ⚠️THE DIGEST IS IN THE REPORTED KEY, NOT ONLY IN THE ROW. Keyed on `name/version` this
        returned ONE entry for two different weight files scored under one version string -- the
        exact mixing the docstring claims is reported.
        """
        return read_resume(root)[1]
    
    
    def append_tags(root: str, rows) -> int:
        p = tags_path(root)
        os.makedirs(os.path.dirname(p), exist_ok=True)
        n = 0
        with open(p, "a") as fh:
            for row in rows:
                fh.write(json.dumps(row, sort_keys=True) + "\n")
                n += 1
        return n
    
    
    def sample_window(row: Dict[str, Any]) -> Optional[Dict[str, Any]]:
        """The clip's window in the node's own sample counter, or None when the name carried none.
    
        night_node.ino:1848 writes the clip from `d.sample - CLIP_PRE_SAMPLES`, and clip_name()
        embeds `d.sample` -- the TRIGGER, not the window start. Deriving the start here is what stops
        every consumer re-deriving CLIP_PRE_SAMPLES for itself and getting it 1.0 s wrong.
        """
        s = row.get("sample")
        if s is None:
            return None
        return {"node": row.get("node"), "boot": row.get("boot"),
                "start_sample": int(s) - int(CLIP_PRE_S * FS_NOMINAL_HZ),
                "end_sample": int(s) + int(CLIP_POST_S * FS_NOMINAL_HZ)}
    
    
    def _scene_ref(r: Dict[str, Any]) -> Dict[str, Any]:
        """The scene row's identity and window, NOT its mel payload.
    
        A tag row is ~5 KB of embedding already; carrying five 80-band mel vectors into it would
        triple that to restate rows the pool holds. `key` is the pool key, which is what a reader
        joins on.
        """
        return {"key": r.get("key"), "node": r.get("node"), "ts_utc_s": r.get("ts_utc_s"),
                "utc_us": r.get("utc_us"), "sample": r.get("sample"),
                "span_ms": r.get("span_ms"), "anchored": bool(r.get("anchored")),
                "bands": r.get("bands"), "slices": r.get("slices")}
    
    
    def _span_s(r: Dict[str, Any]) -> Optional[float]:
        try:
            v = float(r.get("span_ms"))
        except (TypeError, ValueError):
            return None
        return v / 1000.0 if v > 0 else None
    
    
    def _days_touched(t0: float, t1: float) -> List[str]:
        """The UTC day partitions a [t0, t1] window can land in. A 4.0 s clip at 23:59:58 straddles
        midnight, and scanning only its start day would silently drop the rows after it."""
        import datetime as _dt
        out = []
        for t in (t0, t1):
            d = _dt.datetime.fromtimestamp(t, _dt.timezone.utc).strftime("%Y-%m-%d")
            if d not in out:
                out.append(d)
        return out
    
    
    def scene_overlap(pl, row: Dict[str, Any], *, allow_sample_basis: bool = False,
                      max_rows: int = SCENE_ROWS_CAP) -> Dict[str, Any]:
        """READ-ONLY. The scene rows whose window overlaps this clip's.
    
        `pl` is a hear.pool.Pool -- taken as an argument, never imported (see the module docstring).
        `row` is one clips/index.jsonl row.
    
        -> {"basis": "utc"|"sample"|"none", "rows": [...], "refused": str|None, "weak": bool,
            "weakness": str|None, "truncated": bool, "scanned": int, "refused_records": int}
    
        ⚠️A 4.0 s clip against 1.024 s scene rows is 64000/16384 = 3.906 rows, so the answer is 4 or 5
        depending on phase and NEVER fewer. A query returning 0 on an anchored clip means the scene
        store does not hold that node/day, which is a real finding and is returned as an empty list
        with basis "utc" -- not as a refusal, and not as a silent fallback to the sample basis.
    
        ⚠️`refused_records` COUNTS, NEVER JUST SKIPS. A row inside a dated partition should always
        carry a usable `ts_utc_s`/`span_ms` by construction (`_scene_path`/`_day` route on exactly
        that), so one that does not is a malformed row, not a normal gap -- and this is the layer that
        handles unanchored/unusable records by refusing to use them AND saying how many, rather than
        letting them fall out of the count silently the way an unconditional `continue` would.
        """
        out: Dict[str, Any] = {"basis": BASIS_NONE, "rows": [], "refused": None, "weak": False,
                               "weakness": None, "truncated": False, "scanned": 0,
                               "refused_records": 0}
        node = row.get("node")
        if not node:
            out["refused"] = "the index row names no node, so no scene partition can be selected"
            return out
    
        t0, t1 = row.get("t_start_utc_s"), row.get("t_end_utc_s")
        if row.get("anchored") and t0 is not None and t1 is not None:
            out["basis"] = BASIS_UTC
            for day in _days_touched(float(t0), float(t1)):
                for r in pl.scene(node=node, day=day, anchored_only=True):
                    out["scanned"] += 1
                    ts, span = r.get("ts_utc_s"), _span_s(r)
                    if ts is None or span is None:
                        out["refused_records"] += 1
                        continue
                    if float(ts) < float(t1) and float(ts) + span > float(t0):
                        if len(out["rows"]) >= max_rows:
                            out["truncated"] = True
                            return out
                        out["rows"].append(_scene_ref(r))
            return out
    
        win = sample_window(row)
        if win is None or win.get("start_sample") is None:
            out["refused"] = ("the clip is unanchored and its name carried no sample counter, so it "
                              "has no window in either basis")
            return out
        if not allow_sample_basis:
            out["refused"] = ("the clip is unanchored, and the sample basis is off by default: "
                              "neither scene.csv nor dets.csv carries a boot id and `sample` resets "
                              "to 0 every boot, so this join can match a DIFFERENT boot's rows. Pass "
                              "allow_sample_basis=True to take it with that risk stated on the row")
            return out
    
        out["basis"] = BASIS_SAMPLE
        out["weak"] = True
        out["weakness"] = ("no boot id exists in scene.csv or dets.csv and `sample` restarts at 0 on "
                           "every boot, so these rows are only certainly the same boot if the node "
                           "has not rebooted between them -- which nothing here can check")
        s0, s1 = win["start_sample"], win["end_sample"]
        # ⚠️THE UNANCHORED PARTITION ONLY. An anchored scene row has a UTC and would have matched the
        # basis above; reaching into it on a sample counter would join a dated row to a clockless one
        # on a number neither of them promises is comparable.
        for r in pl.scene(node=node, day="unanchored"):
            out["scanned"] += 1
            if r.get("anchored"):
                out["refused_records"] += 1
                continue
            span = _span_s(r)
            try:
                start = int(r.get("sample"))
            except (TypeError, ValueError):
                out["refused_records"] += 1
                continue
            if span is None:
                out["refused_records"] += 1
                continue
            end = start + int(round(span * FS_NOMINAL_HZ))
            if start < s1 and end > s0:
                if len(out["rows"]) >= max_rows:
                    out["truncated"] = True
                    return out
                out["rows"].append(_scene_ref(r))
        return out
    
    
    #: The sketch's own geometry, from hear.sketch (FRAMES, NFFT, HOP_S). Repeated here as local
    #: constants rather than imported -- TAG_CODE in deploy/k8s/gen_configmap.py deliberately ships
    #: tags.py WITHOUT hear/sketch.py, the same reason CLIP_PRE_S/CLIP_POST_S above are repeated
    #: rather than imported from hear.clips. Checked against hear.sketch by test_hear_tag.py.
    SKETCH_FRAMES = 8
    SKETCH_NFFT = 256
    SKETCH_HOP_S = 0.004
    
    
    def _sketch_span_s(fs_hz: Any) -> Optional[float]:
        """The sketch's own window length in seconds, at the rate IT was cut at.
    
        night_node.ino: `SKETCH_SPAN = NFFT + (FRAMES-1)*HOP` samples, `SKETCH_BACK = HOP` samples,
        the window starting one hop before the trigger sample. NFFT is a SAMPLE count, so its
        duration depends on fs -- 256/16000 = 16 ms on a node, 256/48000 = 5.33 ms on a 48 kHz phone
        -- while HOP_S is a fixed 4 ms grid regardless of fs. That is why docs/acoustic-stack.md
        measures the sketch window at 33-44 ms rather than one number: 5.33 + 7*4 = 33.3 ms at 48 kHz,
        16 + 7*4 = 44 ms at 16 kHz, both reproduced by this formula.
        """
        try:
            fs = float(fs_hz)
        except (TypeError, ValueError):
            return None
        if fs <= 0:
            return None
        return SKETCH_NFFT / fs + (SKETCH_FRAMES - 1) * SKETCH_HOP_S
    
    
    def _sketch_ref(r: Dict[str, Any], is_trigger: bool) -> Dict[str, Any]:
        """The sketch record's identity and window, not its frame bytes -- same discipline as
        `_scene_ref`: a reader joins on `key`, it does not need the mel payload restated."""
        return {"key": r.get("key"), "node": r.get("node"), "ts_utc_s": r.get("ts_utc_s"),
                "utc_us": r.get("utc_us"), "sample": r.get("sample"), "fs_hz": r.get("fs_hz"),
                "anchored": bool(r.get("anchored")), "trigger": r.get("trigger"),
                "clip": r.get("clip"), "is_trigger": is_trigger}
    
    
    def sketch_overlap(pl, row: Dict[str, Any], *, source: str = "node",
                       allow_sample_basis: bool = False,
                       max_rows: int = SCENE_ROWS_CAP) -> Dict[str, Any]:
        """READ-ONLY. The pooled sketches (dets/detection records, hear.pool's `records` store) whose
        ~33-44 ms window overlaps this clip's 4.0 s window.
    
        `pl` is a hear.pool.Pool, taken as an argument, never imported -- see the module docstring;
        the same reason `scene_overlap` does it. `row` is one clips/index.jsonl row.
    
        -> {"basis": "utc"|"sample"|"none", "rows": [...], "refused": str|None, "weak": bool,
            "weakness": str|None, "truncated": bool, "scanned": int, "refused_records": int}
    
        One row of `rows` carries `is_trigger: True` when its `key` equals `row["record_key"]` -- the
        clip's OWN triggering sketch, already joined by identity and not by a window guess. Every
        other row is a DIFFERENT detection that happened to fall inside the same 4.0 s clip; on the
        live fleet a retrigger inside `CLIP_DEDUPE_SAMPLES` is common, so 2+ rows is a real finding,
        not a bug.
    
        ⚠️SAME REFUSAL DISCIPLINE AS scene_overlap, restated because this is a different store: an
        unanchored clip refuses the UTC basis and says why; the sample basis is opt-in and marks
        itself `weak` because neither dets.csv nor scene.csv carries a boot id and `sample` resets to
        0 every boot. A sketch record found in a dated partition that is itself unanchored, or that
        states no `fs_hz` (so its window cannot be computed), is REFUSED and COUNTED in
        `refused_records` -- never silently dropped, and never counted as "no sketches here" the way
        an uncounted `continue` would read.
        """
        out: Dict[str, Any] = {"basis": BASIS_NONE, "rows": [], "refused": None, "weak": False,
                               "weakness": None, "truncated": False, "scanned": 0,
                               "refused_records": 0}
        node = row.get("node")
        if not node:
            out["refused"] = "the index row names no node, so no sketch partition can be selected"
            return out
    
        trigger_key = row.get("record_key")
        t0, t1 = row.get("t_start_utc_s"), row.get("t_end_utc_s")
        if row.get("anchored") and t0 is not None and t1 is not None:
            out["basis"] = BASIS_UTC
            for day in _days_touched(float(t0), float(t1)):
                for r in pl.raw(source=source, day=day):
                    if r.get("node") != node:
                        continue
                    out["scanned"] += 1
                    if not r.get("anchored") or r.get("ts_utc_s") is None:
                        out["refused_records"] += 1
                        continue
                    span = _sketch_span_s(r.get("fs_hz"))
                    if span is None:
                        out["refused_records"] += 1
                        continue
                    s0 = float(r["ts_utc_s"]) - SKETCH_HOP_S
                    s1 = s0 + span
                    if s0 < float(t1) and s1 > float(t0):
                        if len(out["rows"]) >= max_rows:
                            out["truncated"] = True
                            return out
                        out["rows"].append(_sketch_ref(r, r.get("key") == trigger_key))
            return out
    
        win = sample_window(row)
        if win is None or win.get("start_sample") is None:
            out["refused"] = ("the clip is unanchored and its name carried no sample counter, so it "
                              "has no window in either basis")
            return out
        if not allow_sample_basis:
            out["refused"] = ("the clip is unanchored, and the sample basis is off by default: "
                              "neither dets.csv nor scene.csv carries a boot id and `sample` resets "
                              "to 0 every boot, so this join can match a DIFFERENT boot's rows. Pass "
                              "allow_sample_basis=True to take it with that risk stated on the row")
            return out
    
        out["basis"] = BASIS_SAMPLE
        out["weak"] = True
        out["weakness"] = ("no boot id exists in dets.csv or scene.csv and `sample` restarts at 0 on "
                           "every boot, so these rows are only certainly the same boot if the node "
                           "has not rebooted between them -- which nothing here can check")
        cs0, cs1 = win["start_sample"], win["end_sample"]
        for r in pl.raw(source=source, day="unanchored"):
            if r.get("node") != node:
                continue
            out["scanned"] += 1
            if r.get("anchored"):
                out["refused_records"] += 1
                continue
            try:
                trig_sample = int(r.get("sample"))
            except (TypeError, ValueError):
                out["refused_records"] += 1
                continue
            fs = r.get("fs_hz") or FS_NOMINAL_HZ
            try:
                fs = float(fs)
            except (TypeError, ValueError):
                out["refused_records"] += 1
                continue
            start = trig_sample - int(round(SKETCH_HOP_S * fs))
            span = _sketch_span_s(r.get("fs_hz"))
            if span is None:
                out["refused_records"] += 1
                continue
            end = start + int(round(span * fs))
            if start < cs1 and end > cs0:
                if len(out["rows"]) >= max_rows:
                    out["truncated"] = True
                    return out
                out["rows"].append(_sketch_ref(r, r.get("key") == trigger_key))
        return out
    
    
    def joined_context(pl, tag_row: Dict[str, Any], index_row: Dict[str, Any], *,
                       allow_sample_basis: bool = False) -> Dict[str, Any]:
        """READ-ONLY. One tag (a model's opinion of a clip) joined onto the scene rows and the
        sketches whose window overlaps that clip -- LAYER 4 of the clip pipeline.
    
        ⚠️THIS IS A QUERY, NOT AN EXPORT. It builds one dict in memory and writes nothing; the spec
        (§12) REFUSES a training-label export or a persisted scene-row label join, because fitting
        a scene/sketch model on a tag would measure whether a 20-band descriptor can reconstruct what
        a full-fidelity model already decided -- the same shape as the 35 dama ant models trained on
        circular self-labels. `scene_overlap`/`sketch_overlap` stay the only sanctioned join, and this
        function is the two of them called together plus the tag's own claim -- nothing more.
    
        ⚠️A LABEL IS ALWAYS A MODEL OUTPUT, NEVER GROUND TRUTH, AND THIS IS ENFORCED HERE, NOT
        TRUSTED FROM THE CALLER. `tag_row["provenance"]` must be the literal string "model" -- a
        caller that hands this function a row it built by hand without that field gets a ValueError,
        not a silently-blessed result. The returned bundle restates `provenance`, `model` and `claim`
        at its own top level so a consumer reading only this dict, and never the tag row underneath
        it, still cannot mistake a score for something a human confirmed.
    
        -> {"tag_key", "clip_key", "node", "provenance": "model", "model": {...}, "claim": {...},
            "scene": scene_overlap(...), "sketch": sketch_overlap(...),
            "refused": str|None}
    
        `refused` is set, and both sub-joins are left at basis "none", only when the clip itself
        cannot be placed in either basis: unanchored, with no sample counter, or with
        `allow_sample_basis=False` (the default) left at that default. That is `index_row`'s own
        unanchored clip being refused and counted -- one refusal here reads as one refusal in a
        caller's tally, not two, because it is the SAME clip failing the SAME way in both stores.
        """
        if tag_row.get("provenance") != "model":
            raise ValueError("tag row %r carries provenance %r, not the literal 'model' -- refusing "
                             "to join it as though it were a label"
                             % (tag_row.get("tag_key"), tag_row.get("provenance")))
        scene = scene_overlap(pl, index_row, allow_sample_basis=allow_sample_basis)
        sketch = sketch_overlap(pl, index_row, allow_sample_basis=allow_sample_basis)
        refused = None
        if scene["basis"] == BASIS_NONE and sketch["basis"] == BASIS_NONE:
            refused = scene["refused"] or sketch["refused"]
        return {
            "tag_key": tag_row.get("tag_key"),
            "clip_key": tag_row.get("clip_key"),
            "node": index_row.get("node"),
            "provenance": "model",
            "model": tag_row.get("model"),
            "claim": tag_row.get("claim"),
            "scene": scene,
            "sketch": sketch,
            "refused": refused,
        }
    
