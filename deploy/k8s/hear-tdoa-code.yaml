    #!/usr/bin/env python3
    """Recovering c -- and therefore air temperature -- from acoustic arrivals, or refusing to.
    
    Every range this project quotes is a time multiplied by c, and c was never measured. On
    2026-09-05 no thermometer was read all session, so `c = 345.238 m/s` (23 C, from the
    operator's recollection) is a free parameter propagated into every bearing, every TDoA
    bound and every shockwave fit. This module is about getting it from the acoustics instead,
    and -- more often -- about saying honestly that a given data set cannot.
    
        c(T) = 331.3 + 0.606 T    (m/s, C)
    
    0.606 m/s per degC is 0.176% of c. That single number sets every budget here: **a 1 degC
    temperature costs 0.176% of whatever propagation time you measure**, so recovering T to
    +/-1 degC over a 36 m path (105 ms) needs that path timed to +/-185 us.
    
    ## The two ways to get c, and what each one costs
    
    **1. Absolute.** Time the flight over a surveyed range: c = R / (t_arrive - t_emit).
    Needs BOTH ends. A surveyed range and a good arrival clock are not enough -- without an
    emission observable (a trigger sensor, a muzzle-flash frame, or a receiver co-located with
    the source) there is no t_emit and the inversion does not exist. `absolute_budget()` states
    what timing precision the range demands before anyone goes looking for one.
    
    **2. Relative, over a known baseline.** Put a clock-synced receiver AT the source. Then
    the delay to a second surveyed receiver IS the propagation time over the surveyed
    separation, and c = d / tau with no emission time anywhere. `speed_from_baseline()`.
    
    ## ⚠️Three receivers and one unknown source CANNOT determine c
    
    N receivers on a shared clock give N-1 independent delays per event. An event with an
    unknown source costs `dim` unknowns (2 on the ground, 3 in the air) plus the one shared
    unknown c. Three ground receivers: 2 equations, 3 unknowns. Under-determined by exactly
    one, for any number of events and any number of bursts -- extra rounds from the same spot
    repeat the same two equations, and a new firing point brings its own two unknowns with it.
    
    This is not a conditioning problem that better data fixes; `determines_speed()` counts it.
    MEASURED on the three surveyed phones of 2026-09-05: refitting a gated burst at c = 320
    and at c = 360 m/s (a 12.5% span, -19 C to +47 C) moved the fitted source by **0.73 m** and
    left the delay residual at **0.00 ms** at both ends. Reading c off that geometry would need
    the source position surveyed to ~6 cm.
    
    ## What a delay alone does give you
    
    |tau| <= d/c is one-sided in c as well as in tau: a delay measured over a surveyed pair
    means `c <= d/|tau|`. It needs no source position and no emission time, so it survives when
    everything else fails -- see `speed_upper_bound()`. It is weak (the best of the 2026-09-05
    phone pairs gives c <= 369.5 m/s, T <= 63 C) but it is a measurement, not an assumption.
    
    `apparent_speed()` is the other assumption-free reading: 1/|s| for the slowness projected
    onto the receivers' own plane. Elevation and wavefront curvature both inflate it, so it is
    an upper bound too, approached only by a wave travelling in that plane.
    """
    from __future__ import annotations
    
    import itertools
    import math
    from dataclasses import dataclass
    from typing import Dict, List, Optional, Sequence, Tuple
    
    import numpy as np
    
    from .shockwave import sound_speed  # noqa: F401  (re-exported: one definition of c per repo)
    
    DC_DT = 0.606          # m/s per degC
    C0 = 331.3             # m/s at 0 C
    
    
    def temperature_c(c: float) -> float:
        """Inverse of `sound_speed`: dry-air temperature in degC implied by c in m/s."""
        return (float(c) - C0) / DC_DT
    
    
    def temperature_sigma_c(c: float, sigma_c: float) -> float:
        """degC uncertainty from a m/s uncertainty. Linear: sigma_T = sigma_c / 0.606."""
        return abs(float(sigma_c)) / DC_DT
    
    
    def fractional_speed_error(delta_t_c: float) -> float:
        """Fraction of c that a temperature error of `delta_t_c` degC is worth, at ~20 C.
    
        0.176% per degC. Quoted so that a timing budget can be argued in per-cent rather than
        in degrees, which is where the sign of an error is easy to lose.
        """
        return abs(float(delta_t_c)) * DC_DT / sound_speed(20.0)
    
    
    # ── the two inversions ──────────────────────────────────────────────────────────────────────────
    
    def speed_from_baseline(tau_s: float, d_m: float) -> float:
        """c from a delay measured over a KNOWN separation with the source at one receiver.
    
        This is the whole relative method: if a clock-synced node sits at the source, the delay
        to a second surveyed node is the propagation time over the surveyed separation. No
        emission time, no absolute clock, no source solve.
        """
        tau = abs(float(tau_s))
        if tau <= 0.0:
            raise ValueError("delay must be > 0 s (got %r): a zero delay carries no speed" % tau_s)
        if d_m <= 0.0:
            raise ValueError("separation must be > 0 m (got %r)" % d_m)
        return float(d_m) / tau
    
    
    def speed_upper_bound(tau_s: float, d_m: float) -> float:
        """c <= d/|tau| -- the plane-wave bound read as a bound on the SPEED, not on the delay.
    
        `consistency.physically_possible` asks whether a delay is possible at an assumed c.
        Turned around, the same inequality is the only statement about c that a single surveyed
        pair can make without knowing where the source was. One-sided and usually weak, but it
        costs nothing and it is falsifiable.
        """
        if d_m <= 0.0:
            raise ValueError("separation must be > 0 m (got %r)" % d_m)
        tau = abs(float(tau_s))
        if tau <= 0.0:
            return math.inf
        return float(d_m) / tau
    
    
    def apparent_speed(positions, arrivals) -> float:
        """1/|s| for the slowness projected onto the receivers' own plane. An UPPER bound on c.
    
        A wavefront in a homogeneous medium has slowness magnitude 1/c whatever emitted it --
        muzzle blast, Mach cone or echo. Receivers measure only the projection of that vector
        into the subspace they span, so the recovered magnitude is |s| cos(angle out of the
        plane) <= 1/c, i.e. the apparent speed is >= c. Wavefront curvature over a finite
        aperture pushes it the same way. Equality only for a wave travelling in the plane.
        """
        P = np.asarray(positions, dtype=float)
        t = np.asarray(arrivals, dtype=float).reshape(-1)
        if P.ndim != 2 or P.shape[0] < 3 or P.shape[0] != t.shape[0]:
            raise ValueError("need >= 3 positions and one arrival each, got %r / %r"
                             % (P.shape, t.shape))
        s = np.linalg.pinv(P[1:] - P[0]) @ (t[1:] - t[0])
        n = float(np.linalg.norm(s))
        return math.inf if n == 0.0 else 1.0 / n
    
    
    # ── budgets: what precision the question actually demands ───────────────────────────────────────
    
    @dataclass(frozen=True)
    class Budget:
        """What a given geometry costs in timing, and whether a clock can pay it."""
        path_m: float
        c_mps: float
        path_time_s: float
        target_dT_c: float
        required_sigma_s: float
        available_sigma_s: Optional[float] = None
    
        @property
        def feasible(self) -> Optional[bool]:
            if self.available_sigma_s is None:
                return None
            return self.available_sigma_s <= self.required_sigma_s
    
        @property
        def shortfall(self) -> Optional[float]:
            """How many times too coarse the available clock is. > 1 means it cannot pay."""
            if self.available_sigma_s is None:
                return None
            return self.available_sigma_s / self.required_sigma_s
    
        def achievable_dT_c(self) -> Optional[float]:
            """The temperature precision the available clock DOES buy over this path."""
            if self.available_sigma_s is None:
                return None
            return self.target_dT_c * self.shortfall
    
        def summary(self) -> str:
            head = ("path %.2f m = %.3f ms at c = %.3f m/s; +/-%.2f degC needs the path timed to "
                    "+/-%.0f us" % (self.path_m, self.path_time_s * 1e3, self.c_mps,
                                    self.target_dT_c, self.required_sigma_s * 1e6))
            if self.available_sigma_s is None:
                return head
            return head + ("; the clock offered is +/-%.0f us -- %.0fx too coarse, worth +/-%.0f degC"
                           % (self.available_sigma_s * 1e6, self.shortfall, self.achievable_dT_c()))
    
    
    def absolute_budget(path_m: float, target_dT_c: float = 1.0, c: Optional[float] = None,
                        temp_c: float = 20.0, available_sigma_s: Optional[float] = None) -> Budget:
        """Timing precision a path must be measured to for a target temperature precision.
    
        sigma_t / t = sigma_c / c, and sigma_c = 0.606 * dT, so sigma_t = t * 0.606 * dT / c.
        """
        c = sound_speed(temp_c) if c is None else float(c)
        if path_m <= 0.0:
            raise ValueError("path must be > 0 m (got %r)" % path_m)
        if target_dT_c <= 0.0:
            raise ValueError("target dT must be > 0 degC (got %r)" % target_dT_c)
        t = float(path_m) / c
        return Budget(float(path_m), c, t, float(target_dT_c), t * DC_DT * float(target_dT_c) / c,
                      None if available_sigma_s is None else float(available_sigma_s))
    
    
    # ── the counting argument ───────────────────────────────────────────────────────────────────────
    
    @dataclass(frozen=True)
    class Determinacy:
        equations: int
        unknowns: int
        determined: bool
        reason: str
    
        @property
        def deficit(self) -> int:
            return self.unknowns - self.equations
    
    
    def determines_speed(n_receivers: int, n_events: int = 1, dim: int = 2,
                         n_known_sources: int = 0, shared_clock: bool = True,
                         n_unknown_clock_offsets: int = 0) -> Determinacy:
        """Can this configuration determine c at all? Counts equations against unknowns.
    
        An `event` here is one SOURCE POSITION, not one round: twenty rounds fired from the
        same spot repeat the same delays and count once. Each event gives `n_receivers - 1`
        independent delays (a common emission time always cancels). Each event with an UNKNOWN
        source costs `dim` unknowns; an event whose source is surveyed costs none. c is one unknown shared by every event. Unsynchronised receivers
        cost one constant offset each -- `n_unknown_clock_offsets` covers the uncalibrated
        per-device microphone latency that phone clips ship with (`mic_bias_ns=0 UNCALIBRATED`).
    
        ⚠️This is necessary, not sufficient: it counts degrees of freedom and says nothing about
        conditioning, geometry or noise. It exists to catch the case that no amount of data can
        fix -- three receivers and an unknown source, which is 2 equations against 3 unknowns
        however many rounds are fired.
        """
        if n_receivers < 2:
            raise ValueError("need >= 2 receivers (got %d): one receiver has no delay" % n_receivers)
        if n_events < 1:
            raise ValueError("need >= 1 event (got %d)" % n_events)
        if n_known_sources > n_events:
            raise ValueError("cannot have more known sources (%d) than events (%d)"
                             % (n_known_sources, n_events))
        eq = n_events * (n_receivers - 1)
        unk = 1 + (n_events - n_known_sources) * int(dim) + int(n_unknown_clock_offsets)
        if not shared_clock:
            unk += n_receivers - 1
        ok = eq >= unk
        if ok:
            reason = ("%d equations vs %d unknowns: c is determined" % (eq, unk))
        else:
            reason = ("%d equations vs %d unknowns -- under-determined by %d. Every c in the "
                      "plausible range has a source that fits the delays exactly; more events at "
                      "new firing points bring their own unknowns and do not help. Survey a source "
                      "position, or put a synced receiver ON one." % (eq, unk, unk - eq))
        return Determinacy(eq, unk, ok, reason)
    
    
    # ── the honest top-level call ───────────────────────────────────────────────────────────────────
    
    @dataclass
    class SpeedVerdict:
        """c and T, or a refusal. `temp_c` is None whenever `valid` is False."""
        valid: bool
        reasons: List[str]
        c_mps: Optional[float] = None
        c_sigma_mps: Optional[float] = None
        temp_c: Optional[float] = None
        temp_sigma_c: Optional[float] = None
        c_upper_mps: Optional[float] = None
        temp_upper_c: Optional[float] = None
        note: Optional[str] = None
    
        def require_temperature(self) -> Tuple[float, float]:
            if not self.valid or self.temp_c is None:
                raise SoundSpeedUnrecoverable("; ".join(self.reasons) or "no usable inversion")
            return self.temp_c, self.temp_sigma_c
    
        def summary(self) -> str:
            if self.valid:
                return "c = %.2f +/- %.2f m/s  ->  T = %.1f +/- %.1f degC" % (
                    self.c_mps, self.c_sigma_mps or 0.0, self.temp_c, self.temp_sigma_c or 0.0)
            head = "REFUSED [" + "; ".join(self.reasons) + "]"
            if self.c_upper_mps is not None:
                head += "  bound only: c <= %.1f m/s, T <= %.1f degC" % (self.c_upper_mps,
                                                                        self.temp_upper_c)
            return head
    
    
    class SoundSpeedUnrecoverable(Exception):
        """Raised by SpeedVerdict.require_temperature() when no inversion is supported."""
    
    
    def recover_from_baseline(tau_s: float, d_m: float, sigma_tau_s: float,
                              sigma_d_m: float = 0.0) -> SpeedVerdict:
        """c and T from a delay over a surveyed separation with the source at one receiver.
    
        Both error terms are propagated: sigma_c/c = sqrt((sigma_d/d)^2 + (sigma_tau/tau)^2). The
        timing term dominates at every geometry this project has -- an RTK separation is good to
        ~2 cm out of 10 m (0.2%), a 110 us phone sync out of a 29 ms delay is 0.37%.
        """
        reasons: List[str] = []
        if abs(tau_s) <= 0.0:
            reasons.append("delay is zero: the source is equidistant, this pair carries no speed")
        if d_m <= 0.0:
            reasons.append("separation must be > 0 m")
        if sigma_tau_s < 0 or sigma_d_m < 0:
            reasons.append("sigmas must be >= 0")
        if reasons:
            return SpeedVerdict(False, reasons)
        c = speed_from_baseline(tau_s, d_m)
        frac = math.hypot(sigma_d_m / float(d_m), float(sigma_tau_s) / abs(float(tau_s)))
        sc = c * frac
        return SpeedVerdict(True, [], c_mps=c, c_sigma_mps=sc,
                            temp_c=temperature_c(c), temp_sigma_c=temperature_sigma_c(c, sc))
    
    
    def recover_from_delays(taus: Dict[Tuple[int, int], float], receiver_positions,
                            source_position=None, sigma_tau_s: float = 0.0,
                            n_unknown_clock_offsets: int = 0) -> SpeedVerdict:
        """c from a set of pairwise delays. REFUSES when the configuration cannot determine it.
    
        With `source_position` given, every pair contributes an independent estimate
        c = (d_j - d_i) / tau(i,j) and the spread across pairs is a real consistency check --
        it is the same test the delays' own ratio makes, and it needs no assumed c.
        Without it, three receivers are under-determined and the call returns the plane-wave
        UPPER bound instead of a number.
        """
        P = np.asarray(receiver_positions, dtype=float)
        if P.ndim == 1:
            P = P[:, None]
        n = P.shape[0]
        pairs = [(i, j) for i, j in itertools.combinations(range(n), 2)
                 if (i, j) in taus or (j, i) in taus]
        if not pairs:
            return SpeedVerdict(False, ["no delays given"])
    
        def tau(i, j):
            return float(taus[(i, j)]) if (i, j) in taus else -float(taus[(j, i)])
    
        ub = min(speed_upper_bound(tau(i, j), float(np.linalg.norm(P[j] - P[i]))) for i, j in pairs)
        if source_position is None:
            det = determines_speed(n, 1, dim=P.shape[1],
                                   n_unknown_clock_offsets=n_unknown_clock_offsets)
            if not det.determined:
                return SpeedVerdict(False, [det.reason], c_upper_mps=ub,
                                    temp_upper_c=temperature_c(ub),
                                    note="the plane-wave bound is the only statement about c that "
                                         "survives an unknown source")
        if source_position is None:
            return SpeedVerdict(False, ["a source position is required to invert delays for c"],
                                c_upper_mps=ub, temp_upper_c=temperature_c(ub))
    
        S = np.asarray(source_position, dtype=float).reshape(-1)
        if S.shape[0] != P.shape[1]:
            raise ValueError("source has %d components, receivers have %d" % (S.shape[0], P.shape[1]))
        d = np.linalg.norm(P - S, axis=1)
        est, wt = [], []
        for i, j in pairs:
            t = tau(i, j)
            dd = d[j] - d[i]
            if abs(t) <= 0.0:
                continue
            est.append(dd / t)
            wt.append(abs(t))
        if not est:
            return SpeedVerdict(False, ["every delay is zero at this source: no speed information"],
                                c_upper_mps=ub, temp_upper_c=temperature_c(ub))
        est = np.asarray(est, float)
        wt = np.asarray(wt, float)
        c = float(np.sum(est * wt) / np.sum(wt))
        reasons = []
        if len(est) > 1 and float(np.ptp(est)) > 0.05 * abs(c):
            reasons.append("pairs disagree on c by %.1f m/s (%.1f%%): the assumed source position or "
                           "at least one delay is wrong" % (float(np.ptp(est)), 100 * np.ptp(est) / abs(c)))
        if not (200.0 < c < 500.0):
            reasons.append("c = %.1f m/s is not a speed of sound in air" % c)
        if reasons:
            return SpeedVerdict(False, reasons, c_upper_mps=ub, temp_upper_c=temperature_c(ub))
        sigma = (float(np.std(est, ddof=1)) if len(est) > 1 else
                 c * float(sigma_tau_s) / max(abs(tau(*pairs[0])), 1e-12))
        return SpeedVerdict(True, [], c_mps=c, c_sigma_mps=sigma, temp_c=temperature_c(c),
                            temp_sigma_c=temperature_sigma_c(c, sigma))
    
  hear_solve_calibrate.py: |
    #!/usr/bin/env python3
    """Joint multi-event solve that ESTIMATES a per-node constant clock bias instead of assuming zero.
    
    WHY THIS EXISTS. A node whose timestamps carry a fixed offset is not a noisy node -- it is a lying
    node, and the two fail differently. Random scatter averages down over events and shows up in the
    residual; a constant offset does neither. It moves that node's range by c*bias for every event
    alike, and in an exactly-determined fit it relocates the answer without disturbing the residual at
    all. Nothing downstream can see it.
    
    The dama-gotchi phones are exactly this case. Their clock is fine -- GPSTimingSync anchors
    (UTC, CLOCK_BOOTTIME) per GPS fix at 1-5 ms -- but the audio path stamps System.nanoTime() after
    AudioRecord.read() returns, which adds the input-buffer and HAL latency of that particular handset:
    tens of milliseconds, constant per device, never measured. At 343 m/s a 70 ms offset is 24 m.
    
    THE WAY OUT IS REDUNDANCY ACROSS EVENTS, NOT ACROSS NODES. One event cannot separate "the source
    was over there" from "this node's clock is late" -- both stretch the same range. But the source
    MOVES between events and the bias does not, so over K events there are 2K+B unknowns (with the
    source height declared) against K*(N-1) equations, and the biases become observable. Measured on
    the 2-PPS-plus-3-phone layout: rank-deficient by one at K=1, full rank from K=2, condition number
    around 10-100 thereafter. So this is not a regularisation trick or a prior -- the information is
    genuinely in the data as soon as there is more than one event.
    
    ⚠️AT LEAST ONE NODE MUST BE TRUSTED. Bias is only defined relative to something. Adding a constant
    to every node's clock is indistinguishable from shifting t0, which the mean-subtraction already
    removes -- so if every node is allowed a bias the problem is rank-deficient by exactly one, for
    ever, at any K. `biased` names which nodes float; the rest are the reference. Passing every node
    raises rather than returning a confident answer off a singular fit.
    
    ⚠️THIS BUYS ACCURACY, NOT PRECISION. Removing a 70 ms bias does not make a 25 ms-scatter node into
    a good one. It stops that node from dragging every answer in one direction; it does not stop it
    from being noisy. Read `bias_sigma_ms` next to the estimate.
    """
    from __future__ import annotations
    
    import math
    from typing import Dict, Optional, Sequence
    
    import numpy as np
    from scipy.optimize import least_squares
    from scipy.sparse import coo_matrix
    
    from . import placement as PL
    from . import point as PT
    from . import shockwave as SW
    
    
    class CalibrationError(ValueError):
        """The layout or the data cannot support a bias estimate. Raised at the door, as everywhere
        else in this package, rather than decorating an answer nobody can check."""
    
    
    def _seed_grid(P: np.ndarray, margin_m: float, step_m: float, up_m: float) -> np.ndarray:
        lo, hi = P.min(axis=0) - margin_m, P.max(axis=0) + margin_m
        xs = np.arange(lo[0], hi[0] + step_m * 0.5, step_m)
        ys = np.arange(lo[1], hi[1] + step_m * 0.5, step_m)
        gx, gy = np.meshgrid(xs, ys, indexing="ij")
        return np.column_stack([gx.ravel(), gy.ravel(), np.full(gx.size, up_m)])
    
    
    def solve_multi(positions: Sequence, arrivals: Sequence[Sequence[float]],
                    biased: Sequence[bool], source_class: str, temp_c: float = 20.0,
                    fixed_up_m: float = 0.0, search_margin_m: float = 500.0,
                    grid_step_m: float = 10.0) -> Dict:
        """Fit K source positions and one constant clock bias per flagged node, together.
    
        `positions`  (N,3) east/north/up metres, one row per node, in one local frame.
        `arrivals`   (K,N) absolute seconds. NaN marks a node that did not hear that event.
        `biased`     (N,) bool. True = this node's clock offset is unknown and will be estimated.
                     At least one node must be False; that set defines the time reference.
        `fixed_up_m` the source height, DECLARED. Solving for it as well is possible in principle but
                     needs a non-coplanar array, and every array this was written for is flat.
    
        Returns the per-event positions, the estimated biases in milliseconds with their formal
        sigmas, and the usual observability verdicts.
        """
        if source_class in PT.CONE_CLASSES:
            raise ValueError("source class %r radiates off a Mach cone, not from a point"
                             % (source_class,))
        if source_class not in PT.POINT_CLASSES:
            raise ValueError("unknown source class %r" % (source_class,))
    
        P = PL._as3(positions)
        T = np.asarray(arrivals, float)
        if T.ndim != 2 or T.shape[1] != len(P):
            raise CalibrationError("arrivals must be (K, N) to match %d nodes; got %r"
                                   % (len(P), (T.shape,)))
        b_mask = np.asarray(biased, bool)
        if b_mask.shape != (len(P),):
            raise CalibrationError("biased must be one flag per node")
        if b_mask.all():
            raise CalibrationError(
                "every node is flagged biased, which is rank-deficient by exactly one at any number "
                "of events: adding the same constant to every clock is indistinguishable from moving "
                "t0, and t0 is already marginalised out. At least one node must be the reference.")
    
        K, N = T.shape
        nb = int(b_mask.sum())
        heard = np.isfinite(T)
        per_event = heard.sum(axis=1)
        if np.any(per_event < 3):
            raise CalibrationError("every event needs >= 3 nodes that heard it; worst has %d"
                                   % int(per_event.min()))
        n_eq = int((per_event - 1).sum())
        n_unk = 2 * K + nb
        if n_eq < n_unk:
            raise CalibrationError(
                "%d equations for %d unknowns (%d events x 2 + %d biases): add events, not nodes -- "
                "a bias is only separable from position because the source MOVES and it does not"
                % (n_eq, n_unk, K, nb))
    
        c = SW.sound_speed(temp_c)
        # Recentre per event. Arrivals are absolute epoch seconds where float64 spacing is 2.4e-7 s,
        # which is the same trap point.solve documents: differences survive it, absolutes do not.
        T0 = np.nanmin(T, axis=1, keepdims=True)
        Tc = T - T0
    
        G = _seed_grid(P, search_margin_m, grid_step_m, fixed_up_m)
        D = np.linalg.norm(G[:, None, :] - P[None, :, :], axis=2) / c
        seeds = np.empty((K, 2))
        for k in range(K):
            m = heard[k]
            rr = Tc[k][None, m] - D[:, m]
            rr = rr - rr.mean(axis=1, keepdims=True)
            seeds[k] = G[int(np.argmin((rr * rr).sum(axis=1)))][:2]
    
        bi = np.flatnonzero(b_mask)
    
        def _split(x):
            return x[:2 * K].reshape(K, 2), x[2 * K:]
    
        # Both the residual and the Jacobian are evaluated once per optimiser iteration, so a Python
        # loop over events inside them costs K times more than it looks. Measured with the loop in
        # place: 0.3 s at K=10, 2.0 s at K=20, 27.4 s at K=40 -- superlinear, and the whole point of
        # this routine is to use many events. Both are vectorised over events below.
        M = heard                                   # (K, N) bool
        NM = M.sum(axis=1, keepdims=True)           # nodes heard per event
        Tm = np.where(M, Tc, 0.0)
    
        def _masked_centre(R):
            """Subtract the per-event mean over the nodes that heard it, leaving absentees at zero.
            This IS the marginalisation of t0 -- exactly point._residual's mean subtraction, done per
            row and skipping the nodes that were not there."""
            R = np.where(M, R, 0.0)
            return np.where(M, R - R.sum(axis=1, keepdims=True) / NM, 0.0)
    
        def _ranges(S):
            s3 = np.column_stack([S, np.full(len(S), fixed_up_m)])       # (K,3)
            d = s3[:, None, :] - P[None, :, :]                            # (K,N,3)
            return d, np.maximum(np.linalg.norm(d, axis=2), 1e-3)         # floor: see jac()
    
        def resid(x):
            S, b = _split(x)
            full_b = np.zeros(N)
            full_b[bi] = b * 1e-3
            _, n = _ranges(S)
            return _masked_centre(Tm - full_b[None, :] - n / c).ravel()
    
        # Sparsity pattern, built ONCE. Event k's residuals touch only its own two position columns
        # plus the bias columns, so the Jacobian is mostly zeros; handing scipy a dense one makes it
        # SVD the lot every step. (An lil_matrix built element-by-element in a Python loop was tried
        # and was slower than dense -- the assignment cost more than the arithmetic it saved.)
        KK, II = np.nonzero(M)                       # heard (event, node) pairs, row-major
        ROW = KK * N + II
        rows_p = np.repeat(ROW, 2)
        cols_p = np.empty(2 * ROW.size, dtype=int)
        cols_p[0::2] = 2 * KK
        cols_p[1::2] = 2 * KK + 1
        rows_b, cols_b, sel_b = [], [], []
        for col, node in enumerate(bi):
            sel = M[KK, node]        # this bias only enters events where that node was actually heard
            rows_b.append(ROW[sel])
            cols_b.append(np.full(int(sel.sum()), 2 * K + col))
            sel_b.append(sel)
        ROWS = np.concatenate([rows_p] + rows_b)
        COLS = np.concatenate([cols_p] + cols_b)
    
        # The bias block does not depend on the parameters at all -- it is linear in b -- so it is
        # computed once here rather than on every iteration.
        inv_nm = (1.0 / NM[:, 0])[KK]
        bias_vals = []
        for col, node in enumerate(bi):
            v = (inv_nm - (II == node).astype(float)) * 1e-3
            bias_vals.append(v[sel_b[col]])
    
        def jac(x):
            S, _ = _split(x)
            d, n = _ranges(S)
            # d|s-P|/ds is the unit vector from P to s; the mean subtraction carries through linearly.
            Jp = -d[:, :, :2] / (n[:, :, None] * c)
            Jp = np.where(M[:, :, None], Jp, 0.0)
            Jp = np.where(M[:, :, None],
                          Jp - Jp.sum(axis=1, keepdims=True) / NM[:, :, None], 0.0)
            vals = np.concatenate([Jp[KK, II, :].ravel()] + bias_vals)
            return coo_matrix((vals, (ROWS, COLS)), shape=(K * N, n_unk)).tocsr()
    
        # Bound the positions to the region the seed grid scanned, for the reason point.solve
        # documents: an unbounded TDoA fit slides along a flat direction and returns a confident
        # coordinate from outside the searched box. Biases are bounded generously -- a second of
        # offset is far past anything an audio path can produce and still stops a runaway.
        plo = np.tile(P.min(axis=0)[:2] - search_margin_m, K)
        phi = np.tile(P.max(axis=0)[:2] + search_margin_m, K)
        lo = np.concatenate([plo, np.full(nb, -1000.0)])
        hi = np.concatenate([phi, np.full(nb, 1000.0)])
        x0 = np.clip(np.concatenate([seeds.ravel(), np.zeros(nb)]), lo, hi)
        fit = least_squares(resid, x0, jac=jac, bounds=(lo, hi), tr_solver="lsmr",
                            xtol=1e-14, ftol=1e-14, gtol=1e-14)
        S, b_ms = _split(fit.x)
    
        # Formal sigma from the Jacobian at the solution, scaled by the observed residual. This is the
        # fit's own opinion of its precision and it assumes the model is right; it is reported so a
        # caller can see when a bias is merely poorly determined rather than genuinely small.
        J = fit.jac
        J = J.toarray() if hasattr(J, "toarray") else np.asarray(J)
        dof = max(n_eq - n_unk, 1)
        s2 = float(fit.fun @ fit.fun) / dof
        try:
            cov = np.linalg.inv(J.T @ J) * s2
            sig = np.sqrt(np.clip(np.diag(cov)[2 * K:], 0, None))
            rank_ok = np.linalg.matrix_rank(J, tol=1e-9) == n_unk
        except np.linalg.LinAlgError:
            sig = np.full(nb, float("inf"))
            rank_ok = False
    
        bias_full = np.zeros(N)
        bias_full[bi] = b_ms
        sig_full = np.zeros(N)
        sig_full[bi] = sig
        return {
            "positions_m": [(float(S[k, 0]), float(S[k, 1]), float(fixed_up_m)) for k in range(K)],
            "bias_ms": [float(v) for v in bias_full],
            "bias_sigma_ms": [float(v) for v in sig_full],
            "bias_range_m": [float(v * 1e-3 * c) for v in bias_full],
            "biased_nodes": [int(i) for i in bi],
            "observable": bool(rank_ok),
            "n_events": K, "n_nodes": N, "n_equations": n_eq, "n_unknowns": n_unk,
            "rms_residual_ms": math.sqrt(float(fit.fun @ fit.fun) / n_eq) * 1000.0,
            "up_assumed_m": float(fixed_up_m),
            "sound_speed_mps": c,
            "source_class": source_class,
            "note": None if rank_ok else
                    "the joint fit is rank deficient: the biases are not separable from the positions "
                    "for this layout and event set. More EVENTS, spread over different bearings, is "
                    "the fix -- more nodes is not.",
        }
    
  tools_hear_tdoa.py: |
    #!/usr/bin/env python3
    """Drive the shipped TDoA solvers over the pool, and account for every record that did not solve.
    
        python3 tools/hear_tdoa.py --pool ~/hear-pool --source-class blast          # solve
        python3 tools/hear_tdoa.py --pool ~/hear-pool --source-class blast --census # read-only
        python3 tools/hear_tdoa.py --pool ~/hear-pool --plan-only                   # survey only
        python3 tools/hear_tdoa.py --pool ~/hear-pool --check                       # gate, exit 0/1
    
    WHY THIS EXISTS. `hear/solve/{point,shockwave,placement,consistency,soundspeed,calibrate}.py` and
    `hear/backend/{survey,associate,pipeline}.py` are written, tested and have ZERO callers outside
    tests/. The pool holds 11k sketches with absolute timestamps. Nothing joined the two. This file is
    the join and it reimplements none of them: geometry, association, sound speed, DOP and the
    determinacy counting all reach it from those modules.
    
    ⚠️THE PRODUCT IS THE FUNNEL, NOT THE EVENTS. Every pool row reaches exactly one terminal verdict
    and the run succeeds when it can explain why zero solved. `n_solved == 0` is exit 0. A run that
    cannot account for its own inputs is exit 2. On the corpus this was written against the honest
    answer is zero: across 30 one-minute bins in which all three surveyed nodes were simultaneously
    detecting, there were 0 three-node coincidences that satisfy their own pairwise geometry at
    zero margin. A tool whose only output is `events.jsonl` reports that as an empty directory.
    
    WHAT THIS CONTRIBUTES that no shipped module has, and nothing else:
    
      1. the pool -> arrival adapter (`admit`), including the four traps the pool schema sets
      2. the ARRIVAL SUB-SURVEY (`arrival_survey`), which routes around two verified library defects
      3. an UNGATED coincidence scan (`scan_coincidences`), so "coincident in time" and "consistent
         with a point source" are two separately countable populations -- `associate()` conflates
         them by design, and the two need opposite field responses
      4. an arrival-stream shuffle null (`shuffle_null`), so a coincidence count has a referent
      5. the attribution ledger
    
    ⚠️`Backend.ingest()` IS NOT USABLE HERE AND `Backend.flush()` IS MIRRORED, NOT CALLED.
    `ingest()` takes raw wire bytes and calls `wire.decode()`, which requires a v2 frame carrying
    node_id/seq/us_of_day. Pool records store v1 SKETCH bytes (`hear.sketch.unpack`, no node id and no
    seq in the frame at all -- which is exactly why the pool stores `node` and `ts_utc_s` as separate
    JSON columns beside the frame), so feeding a pool frame to `ingest()` gets `v1_frame_has_no_node_id`.
    This driver therefore composes at the `associate()` layer and reproduces ~15 lines of `flush()`'s
    model dispatch. `TestTheModelChoiceMatchesPipeline` pins the two together. The clean fix upstream
    is to extract `pipeline.solve_event(...)` from `flush()` and have both call it; that is a change to
    pipeline.py and is deliberately not made here.
    
    ⚠️TWO VERIFIED LIBRARY DEFECTS ARE ROUTED AROUND, NOT FIXED, AND THE DISCREPANCY IS REPORTED.
      (a) `associate.max_window_s` sizes the scan window off `survey.diameter_m()`, which maxes over
          ALL surveyed ids -- including `puc`, which `Survey.arrival_ids()` refuses and which
          survey.json marks PROVISIONAL at sigma 6.5 m. On this survey that is 99.6 ms where the
          arrival nodes alone give 79.1 ms: 26% too wide. It is not merely conservative. Measured on
          the live corpus: `associate()` returns 3 events at 79.1 ms and 2 at 99.6 ms, because the
          wider seed absorbs a wrong partner and the true third member is then lost to
          `duplicate_node_in_group`. A node that cannot contribute an arrival must not set the window.
      (b) `associate()`'s membership test is `int(d["node_id"]) in survey` -- plain position-dict
          membership. It never consults `arrival_ids()`, so a `puc` detection would enter the geometry
          beside sigma 0.5 m nodes. This driver pre-filters; `nodeclass.require_arrival` supplies the
          refusal message so the wording cannot drift from the module that owns it.
    Both are closed by building a SUB-SURVEY of the arrival nodes and passing that to `associate()`.
    `manifest.json` carries `window_s`, `window_s_full_survey` and `window_inflation_frac` so the
    library defect stays visible instead of being silently masked -- those numbers are the evidence
    for the eventual PR against associate.py.
    
    ⚠️A THIRD DEFECT IS CLOSED BEFORE THE GATE, NOT AT IT. `associate.arrival_is_usable` reads
    `d.get(k, True) is not False`, which admits None. `utc_trusted` is null on ALL 5,505 phone rows in
    this pool, so the gate written specifically for the phone audio path passes 100% of it -- the
    docstring's "ABSENT MEANS USABLE / only an EXPLICIT false is a refusal" rule has a third state it
    does not handle. `admit()` resolves that third state through `corpus.utc_trusted_of` (the derived
    rung, NOT the raw stored field) and hands `associate()` a real boolean, so its refusal path is live
    rather than decorative.
    
    ⚠️MARGIN_S IS A GROUPING HEURISTIC, AND ITS FLOOR IS NOT THE CLOCK. `associate.MARGIN_S = 0.030`
    was dimensioned against 85 ms round spacing and never against aperture; on this 16.87 m array it
    is 61% of the widest pair bound and 87% of the tightest, so the pairwise gate admits groups that
    cannot be one point source. This tool derives a margin from the array's own pair bounds. But the
    margin cannot simply be shrunk to the timing budget: PPS is 25-40 ns and
    `nodeclass.get("xiao-s3-pps").range_sigma_m(c)` is about 0.034 m -- roughly 20x SMALLER than the
    0.49-0.717 m survey sigma -- while the binding term, INTER-NODE ONSET-DETECTION JITTER, has never
    been measured on this fleet. So admissibility is judged separately, at tol_s = 0, and every excess
    is reported in metres. This file does not claim the derived margin is correct; it claims only that
    it is dimensioned to the aperture and that the binding uncertainty is unmeasured.
    
    WHAT IT WRITES, all under `--out` (default `<pool>/tdoa`) and NEVER inside the checkout:
    
        <out>/runs/<run_id>/manifest.json     policy, survey, window, funnel, onset_quality,
                                              conservation, not_composed, could_not_do, timings
        <out>/runs/<run_id>/coactivity.json
        <out>/runs/<run_id>/candidates.jsonl  ungated scan + bound_check + reached_associate
        <out>/runs/<run_id>/attempts.jsonl    one row per ASSOCIATED EVENT, ALWAYS a verdict
        <out>/runs/<run_id>/events.jsonl      solved AND strictly admissible only
        <out>/runs/<run_id>/null.json
        <out>/runs/<run_id>/plan.json
        <out>/arrivals/<day>/<source>.jsonl   the per-record ledger (append, deduped)
        <out>/latest.json                     {"run_id","at"} -- a FILE, not a symlink (k8s-safe)
        <out>/model_card.json
        <out>/state/tdoa_heartbeat.json       ring of the last 64 runs
    
    ⚠️ASSOCIATION IS NOT A PER-RECORD FUNCTION, so there is no per-record resume for it. The whole
    `--lookback-h` window is re-associated every run and emission is deduped on
    
        event_key = sha256("\\x1f".join(sorted(member pool_keys)))[:32]
    
    a content address of the member SET, and the keys it is deduped AGAINST are read from
    `runs/*/events.jsonl` -- the emission log -- and from nowhere else. ⚠️NOT from the arrival
    ledger, which carries an event_key for every arrival of every CANDIDATE whatever its verdict:
    reading it as an emission log let a run that REFUSED a group burn that member set's key
    permanently, so the next run solved it, filtered it against its own refusal, and wrote a 0-byte
    events.jsonl under a manifest claiming an emission. See `read_emitted_events`.
    
    Consequences, published rather than hidden: a backfill that adds a member produces a NEW
    event_key and the superseded row stays -- counted `event_membership_changed` and NAMED in
    `superseded_event_keys`, which is a count of new events reusing an arrival already published
    under a different key, not a count of new events; a backfill older than the lookback can never be associated (counted
    `outside_lookback_unassociated`, which is a hard `--check` failure -- the one thing a lookback
    costs, made loud). The per-record ledger resumes on sha256(pool_key|verdict|reason|event_key), so a
    record is written once per DISTINCT verdict and a verdict that later changes appends a transition
    row rather than rewriting history. A file/offset/timestamp watermark would be wrong for the same
    measured reason hear_score.py:64 gives: a later drain was observed appending 513 rows INTO an
    already-scanned partition.
    
    ⚠️EVERY ARRIVAL IN THIS POOL CARRIES AN UNKNOWN ONSET QUALITY, and the run says so in a number
    rather than passing them in silence. `onset_quality` in the manifest is the distribution over the
    three states -- crossed, not crossed, and never measured -- per source. Today the third bucket is
    100% of the admitted stream, because no producer in the chain measures the quantity at all: see
    _ONSET_UNSTATED_WHY for the four places that was checked. `--onset-unstated refuse` prices it.
    
    ⚠️--census WRITES NOTHING AT ALL, which is a deliberate deviation from "writes only the run
    summary". The check CronJob runs `--census || true` after the gate, and a read-only gate job that
    writes is a second writer nobody expects. `--no-write` is the flag for "compute everything, write
    nothing".
    
    WHAT A ZERO-EVENT RUN IS NOT. It is not evidence of no gunshots. The referent is the co-activity
    number, which is printed FIRST and short-circuits the whole run when it is zero: a coincidence
    rate over zero opportunity is a number with no referent. See `<out>/model_card.json`.
    """
