    #!/usr/bin/env python3
    """Position of a STATIONARY source from arrival times. A muzzle blast, a firework, a backfire.
    
    The sound leaves one point at one instant and spreads spherically, so a node at P hears it at
    
        t(P) = t0 + |s - P| / c
    
    Four unknowns collapse to three: t0 cancels in TDoA, so N nodes give N-1 equations for the 3D
    position. FOUR nodes determine it exactly and the residual is ~0 BY CONSTRUCTION; five is where a
    residual starts carrying information. (In the 2D era those numbers were three and four --
    docs/findings-2026-09-05.md:46-48 -- and adding the third unknown moved both up by one.)
    
    ⚠️DO NOT APPLY THIS TO A SUPERSONIC CRACK. The crack radiates off the bullet's Mach cone, not
    from the muzzle. For M855 at ~900 m/s and 23 degC the cone half-angle is 22.6 deg, so the crack
    arrives 67.4 deg off the trajectory (docs/findings-2026-09-05.md:42-43). Fitting a point source
    to it returns a confident position that is wrong by that angle. The caller must gate on a source
    class; `source_class` is a required argument for that reason and CONE_CLASSES is refused
    outright. What the array actually heard on 2026-09-05 was 92 cracks and 0 blast-only events
    (docs/findings-2026-09-05.md:36) -- the gate is not hypothetical. Cost of ignoring it, run in
    tests/test_point.py on a 400 m array: 134 m off at rms 188 ms with four nodes, and 145 m off at
    rms 0.00001 ms with three, where nothing in the result says so.
    
    ⚠️COLLINEAR NODES CANNOT PLACE A SOURCE. Reflect the source across the line the nodes sit on and
    every range is unchanged, so both fit identically at zero residual. That is the same degeneracy
    as the measured "offset is unobservable from same-side nodes" (+/-6 m moved the TDoAs by
    0.000 ms, docs/findings-2026-09-05.md:44-46), rotated. `solve` returns a verdict there and
    refuses to quote a coordinate.
    
    ⚠️COPLANAR NODES CANNOT PLACE A SOURCE IN HEIGHT. Reflect the source through the plane the nodes
    lie in and every range is unchanged, so both fit identically -- the same degeneracy as the
    collinear case, one dimension up. Every node at ground level IS that case, and it is the normal
    case for this project rather than an exotic one: nyquist and mach sit on one house. `up_m` is
    still returned, with `up_observable: False`, `up_mirror_m` giving the twin, and -- when the node
    plane is near-horizontal, so that "the other solution is underground" is a real statement rather
    than a coordinate accident -- `up_preferred_reason` naming which one survives physical sense.
    Callers that need height must break the plane, not the timing.
    
    DIMENSION. Positions are (east, north, up) metres in one local frame; 2-vectors are read as up=0.
    Use hear.geodesy to get there from lat/lon/height, and pass the ELLIPSOID height -- hMSL carries
    the geoid undulation, which is not a distance. This module no longer slices [:2] anywhere.
    """
    from __future__ import annotations
    
    import math
    from typing import Dict, List, Optional, Sequence, Tuple
    
    import numpy as np
    from scipy.optimize import least_squares
    
    from . import placement as PL
    from . import shockwave as SW
    
    # Model selection lives here and only here; hear/backend/pipeline.py imports these rather than
    # keeping its own list. JUDGEMENT: the vocabulary is ours, the split between the two is physics.
    POINT_CLASSES: frozenset = frozenset({"point", "blast", "muzzle", "firework", "backfire", "impact"})
    CONE_CLASSES: frozenset = frozenset({"crack", "shock", "supersonic"})
    
    
    def is_point_source(source_class: str) -> bool:
        """True for a spherical radiator, False for a Mach cone. Refuses to guess at anything else."""
        if source_class in POINT_CLASSES:
            return True
        if source_class in CONE_CLASSES:
            return False
        raise ValueError("unknown source class %r" % (source_class,))
    
    
    def _residual(s: np.ndarray, P: np.ndarray, t: np.ndarray, c: float) -> np.ndarray:
        """TDoA residual with t0 marginalised out, not differenced against node 0.
    
        Subtracting the mean IS the marginalisation -- it removes the direction a common time shift
        moves, exactly as placement.dop()'s (I - 11'/N) does -- so the answer cannot depend on which
        node the caller listed first.
        """
        r = t - np.linalg.norm(s[None, :] - P, axis=1) / c
        return r - r.mean()
    
    
    def _jacobian(s: np.ndarray, P: np.ndarray, t: np.ndarray, c: float) -> np.ndarray:
        """Exact derivative of _residual. Supplied rather than finite-differenced.
    
        least_squares' 2-point Jacobian perturbs a coordinate by ~1.5e-8*|x|, which at a few hundred
        metres of range is worth a few nanoseconds -- and the third unknown made that fragile in a way
        two never were. With a coplanar array the cost barely changes as the source moves off the node
        plane, so the true gradient in that direction is already tiny; differencing it against float64
        noise returned something indistinguishable from zero and the optimiser stopped ON the seed
        plane, reporting rms 0.019 ms where the true source scored exactly 0.0.
    
        The derivative itself is elementary -- d|s-P|/ds is the unit vector from P to s -- and the
        mean-subtraction in _residual is linear, so it carries straight through to the Jacobian.
        """
        d = s[None, :] - P
        n = np.linalg.norm(d, axis=1)
        J = -d / (n[:, None] * c)
        return J - J.mean(axis=0, keepdims=True)
    
    
    def _grid_seed(P: np.ndarray, t: np.ndarray, c: float,
                   margin_m: float, step_m: float, z_levels: int = 5) -> np.ndarray:
        """Coarse global scan. The TDoA cost is non-convex and a single Gauss-Newton from the centroid
        lands in a local minimum for sources outside the array -- shockwave.solve made the same call
        (shockwave.py:91-95).
    
        The horizontal grid is the expensive axis and keeps its full resolution. Height gets only a
        few levels on purpose: with near-coplanar nodes the cost surface is almost flat in z, so a
        fine z grid buys nothing a Gauss-Newton step will not find, and cubing the grid to discover
        that would be a waste. The levels span the node vertical extent plus the same margin, so a
        source above or below the array is still inside the search.
        """
        lo, hi = P.min(axis=0) - margin_m, P.max(axis=0) + margin_m
        xs = np.arange(lo[0], hi[0] + step_m * 0.5, step_m)
        ys = np.arange(lo[1], hi[1] + step_m * 0.5, step_m)
        zs = (np.linspace(lo[2], hi[2], z_levels) if hi[2] > lo[2]
              else np.array([float(P[:, 2].mean())]))
        gx, gy, gz = np.meshgrid(xs, ys, zs, indexing="ij")
        S = np.column_stack([gx.ravel(), gy.ravel(), gz.ravel()])
        d = np.linalg.norm(S[:, None, :] - P[None, :, :], axis=2) / c
        r = t[None, :] - d
        r = r - r.mean(axis=1, keepdims=True)
        return S[int(np.argmin((r * r).sum(axis=1)))]
    
    
    def _mirror_through_plane(s: np.ndarray, P: np.ndarray, normal: Sequence[float]) -> np.ndarray:
        """The twin solution: reflect the source through the node plane.
    
        When the nodes are coplanar this point has IDENTICAL ranges to every node, so it fits the
        arrival times to the last digit. It is not a worse answer that the optimiser missed; it is the
        same answer, and the data cannot choose between them.
        """
        n = np.asarray(normal, float)
        n = n / np.linalg.norm(n)
        return s - 2.0 * float((s - P.mean(axis=0)) @ n) * n
    
    
    def _report(s, P, t, c, n_eq, n_unk, rms_ms, t0, at_bound, source_class,
                search_margin_m, fixed_up_m):
        """Everything the solver says about a fit. One definition, shared by the 3-unknown and
        the declared-height paths, so the two cannot disagree about what a result means.
        """
        lin = PL.linearity(P)
        obs = lin >= PL.COLLINEAR_LINEARITY
    
        # Height observability is a SEPARATE question from horizontal observability, and for this
        # project it is usually the one that bites: nodes sitting on the ground are coplanar, and a
        # coplanar array cannot tell a source above the plane from its reflection below it. Both fit
        # to the last digit, so this is not something a better optimiser or a longer capture fixes.
        cop = PL.coplanarity(P)
        d3 = (PL.dop3(P, s) if len(P) >= 4
              else {"hdop": float("inf"), "vdop": float("inf"), "pdop": float("inf"),
                    "dof": 0, "singular": True})
        # A DECLARED height is not an observed one. Saying up_observable True here because the number
        # happens to be exact would be the worst possible lie: it is exact because it was assumed.
        up_obs = obs and not cop["coplanar"] and fixed_up_m is None
        mirror = (_mirror_through_plane(s, P, cop["plane_normal"])
                  if (obs and fixed_up_m is None) else None)
    
        # When the node plane is near-horizontal, "the other one is below the array" is a physical
        # statement and not a coordinate accident, so it is worth naming. This is a PREFERENCE from
        # outside the data, never a measurement: up_observable stays False either way.
        up_pref = None
        if obs and not up_obs and mirror is not None and cop["near_horizontal"]:
            hi = s if s[2] >= mirror[2] else mirror
            up_pref = ("the node plane is within 26 deg of horizontal, so the twin at up=%.1f m is "
                       "below it -- preferring up=%.1f m is an assumption that the source is above "
                       "the array, not a measurement" % (min(s[2], mirror[2]), hi[2]))
    
        return {
            "east_m": float(s[0]) if obs else None,
            "north_m": float(s[1]) if obs else None,
            "up_m": float(s[2]) if obs else None,
            "position_observable": obs,
            "up_observable": up_obs,
            "up_mirror_m": float(mirror[2]) if (mirror is not None and not up_obs) else None,
            "up_preferred_reason": up_pref,
            "t0_utc_s": t0 if obs else None,
            "range_m": float(np.linalg.norm(s - P.mean(axis=0))) if obs else None,
            "ground_range_m": float(np.linalg.norm(s[:2] - P.mean(axis=0)[:2])) if obs else None,
            "rms_residual_ms": rms_ms,
            "at_search_bound": at_bound,
            # Three unknowns now, so four nodes give an exact fit whose residual is ~0 by
            # construction. Five is where it starts carrying information -- one more than before.
            "residual_is_meaningful": n_eq > n_unk,
            "n_nodes": len(P), "n_equations": n_eq, "n_unknowns": n_unk,
            "up_assumed_m": float(fixed_up_m) if fixed_up_m is not None else None,
            "sound_speed_mps": c,
            "dop": PL.dop(P, s)["dop"],
            # hdop/vdop reported separately because they are not interchangeable: the vertical is the
            # weak axis of a ground-based array by construction, and a single combined figure hides
            # exactly the component this project keeps getting wrong.
            "hdop": d3["hdop"], "vdop": d3["vdop"], "pdop": d3["pdop"],
            "dop_dof": d3["dof"], "dop_singular": d3["singular"],
            "linearity": lin,
            "planarity_rms_m": cop["planarity_rms_m"],
            "vertical_spread_m": cop["vertical_spread_m"],
            "source_class": source_class,
            "note": (
                "source height was DECLARED as %.2f m, not measured: two unknowns, so three nodes "
                "suffice. Every reported coordinate is conditional on that height being right -- if "
                "the source is 10 m up and this said 0, the horizontal answer absorbs the error."
                % fixed_up_m if (fixed_up_m is not None and obs and not at_bound) else
                "solution is pinned at the edge of the searched region (search_margin_m=%.0f): the "
                "source is outside it, or a point-source model does not fit this data. The "
                "coordinates are the box edge, not a measurement." % search_margin_m
                if at_bound else
                "nodes are collinear (linearity %.4f): position is UNOBSERVABLE -- the source and "
                "its mirror reflected across the node line fit identically at zero residual." % lin
                if not obs else
                "nodes are coplanar (planarity rms %.3f m over %.1f m of vertical spread): HEIGHT is "
                "unobservable -- up=%.1f m and up=%.1f m fit identically. East/north are unaffected. "
                "Breaking the plane, not improving the timing, is what fixes this."
                % (cop["planarity_rms_m"], cop["vertical_spread_m"], s[2], mirror[2])
                if not up_obs else None),
        }
    
    
    def solve(positions: Sequence, arrivals: Sequence[float], source_class: str,
              temp_c: float = 20.0, search_margin_m: float = 500.0,
              grid_step_m: float = 10.0, fixed_up_m: Optional[float] = None) -> Dict:
        """Fit a stationary source position to arrival times.
    
        `positions` are east/north/up metres in one local frame; 2-vectors are read as up=0.
        `arrivals` are absolute seconds on a shared clock.
    
        Raises on a caller error -- too few nodes, mismatched lengths, non-finite input, or a source
        class that radiates off a cone. Returns `east_m: None` and `position_observable: False` with
        an UNOBSERVABLE note when the nodes are collinear, because the fit has a mirror twin across
        the node line that matches it to the last digit.
        """
        # fixed_up_m DECLARES the source height instead of solving for it: two unknowns, so three
        # nodes suffice again. This exists because going 3D raised the minimum node count from three
        # to four, and a lot of real arrays sit at three -- two PPS nodes plus a phone, say. Assuming
        # the source is on the ground is often true and always a CHOICE; the point is that it is now
        # written in the call and echoed in the result, rather than being smuggled in by a solver that
        # silently ignores the third axis. That was the old behaviour and it is what this whole change
        # set exists to remove.
        n_unk = 2 if fixed_up_m is not None else 3
        min_nodes = n_unk + 1
    
        # Two distinct faults, reported distinctly. Folding them into one message made a length
        # mismatch of 4 positions against 3 arrivals say "need >= 4 nodes ... got 4", which sends the
        # reader to count nodes they already have enough of.
        if len(positions) != len(arrivals):
            raise ValueError("positions and arrivals must be the same length: got %d and %d"
                             % (len(positions), len(arrivals)))
        if len(positions) < min_nodes:
            raise ValueError(
                "need >= %d nodes for a %dD fit: t0 cancels, so N nodes give N-1 equations for %d "
                "unknowns; got %d%s"
                % (min_nodes, n_unk, n_unk, len(positions),
                   "" if fixed_up_m is not None else
                   ". Pass fixed_up_m to declare the source height and solve in 2D instead"))
        if source_class in CONE_CLASSES:
            raise ValueError("source class %r radiates off a Mach cone, not from a point: "
                             "use shockwave.solve" % (source_class,))
        if source_class not in POINT_CLASSES:
            raise ValueError("unknown source class %r" % (source_class,))
        P = PL._as3(positions)
        t = np.asarray(arrivals, float)
        # Recentre before anything numerical touches it. `arrivals` are absolute epoch seconds
        # (~1.76e9), where float64 spacing is 2.4e-7 s. least_squares' 2-point Jacobian perturbs a
        # position by ~1.5e-8*|x|, worth ~4e-9 s of range -- entirely lost in that rounding, so the
        # Jacobian comes back EXACTLY zero and the optimiser exits on its first iteration with the
        # raw grid cell. Measured: 0.001 m error at t0=1e3, 6.58 m at real UTC, snapped to the grid.
        # shockwave.solve is immune only because it differences t[1:] - t[0] before it does anything.
        t_ref = float(t[0])
        t = t - t_ref
        if not (np.all(np.isfinite(P)) and np.all(np.isfinite(t))):
            raise ValueError("non-finite node position or arrival time")
    
        c = SW.sound_speed(temp_c)
        n_eq = len(P) - 1
        seed = _grid_seed(P, t, c, search_margin_m, grid_step_m)
    
        # BOUND THE REFINE TO THE REGION THAT WAS SEARCHED. Unbounded, the third unknown gave the
        # optimiser a nearly-flat direction to slide along whenever the nodes are coplanar -- the
        # cost barely changes as the source moves perpendicular to the node plane -- and inconsistent
        # arrivals (a Mach cone fed in as a blast) sent it to 33 km below ground at a confident-looking
        # 138 ms. That is not a fit; it is a runaway, and returning coordinates from outside the box
        # the grid seed scanned is indefensible whatever the residual says.
        lo = P.min(axis=0) - search_margin_m
        hi = P.max(axis=0) + search_margin_m
        # THE NODE PLANE IS A STATIONARY POINT OF THE COST, BY SYMMETRY. Every range depends on the
        # out-of-plane offset only through its square, so the gradient in that direction is EXACTLY
        # zero on the plane -- look at _jacobian: with s and every P in one plane, that column is all
        # zeros before the mean is even subtracted. A seed that lands on the plane therefore cannot
        # leave it, and the optimiser returns the plane while reporting convergence. Measured on a
        # 100 m square lifted 7.5 m over a ground-level source: it stopped at rms 0.019 ms and 2.2 m
        # of horizontal error where the true source scores exactly 0.0.
        #
        # So refine from the seed AND from seeds nudged either side of the node plane, and keep the
        # best. On a coplanar array the two sides are mirror twins and score identically, which is the
        # ambiguity `up_observable` reports; on a broken plane they are not, and this is what finds
        # the real one.
        # With the height declared there are genuinely two unknowns, so the optimiser is given two.
        # Equal bounds were tried first and least_squares rejects them ("each lower bound must be
        # strictly less than each upper"); an epsilon-wide window would have worked numerically and
        # lied about the dimensionality. These wrappers reuse _residual and _jacobian unchanged, so
        # the 2D and 3D paths cannot drift apart -- the Jacobian simply loses its third column.
        if fixed_up_m is not None:
            u0 = float(fixed_up_m)
            _lift = lambda s2: np.array([s2[0], s2[1], u0])
            # ⚠️CLIPPED, exactly as the 3D branch below clips its seeds. `_grid_seed` builds its axes
            # with np.arange(lo, hi + step/2, step), which OVERSHOOTS `hi` by up to step/2 -- on a
            # 17 m array with the default 500 m margin and 10 m step that is 3.4 m past the east
            # bound. When the coarse minimum happens to land in that last cell, least_squares raises
            # "Initial guess is outside of provided bounds" and the whole event is refused. It is
            # data-dependent, so it fires on some temperatures/geometries and not others: found by
            # tools/hear_tdoa.py at --temp-c 0 on a layout that solves cleanly at 20.
            fit = least_squares(lambda s2, *a: _residual(_lift(s2), *a),
                                np.clip(seed[:2], lo[:2], hi[:2]),
                                jac=lambda s2, *a: _jacobian(_lift(s2), *a)[:, :2],
                                args=(P, t, c), bounds=(lo[:2], hi[:2]),
                                xtol=1e-14, ftol=1e-14, gtol=1e-14)
            s = _lift(fit.x)
            _chk = slice(0, 2)
            at_bound = bool(np.any(np.isclose(s[:2], lo[:2], atol=1e-6))
                            or np.any(np.isclose(s[:2], hi[:2], atol=1e-6)))
            res = _residual(s, P, t, c)
            rms_ms = math.sqrt(float(res @ res) / n_eq) * 1000.0
            t0 = t_ref + float(np.mean(t - np.linalg.norm(s[None, :] - P, axis=1) / c))
            return _report(s, P, t, c, n_eq, n_unk, rms_ms, t0, at_bound, source_class,
                           search_margin_m, fixed_up_m)
        nrm = np.asarray(PL.coplanarity(P)["plane_normal"], float)
        span = float(np.linalg.norm(P.max(axis=0) - P.min(axis=0)))
        nudge = max(0.05 * span, 1.0)
        cands = [seed, seed + nudge * nrm, seed - nudge * nrm]
        best = None
        for s0 in cands:
            f = least_squares(_residual, np.clip(s0, lo, hi), jac=_jacobian, args=(P, t, c),
                              bounds=(lo, hi), xtol=1e-14, ftol=1e-14, gtol=1e-14)
            if best is None or f.cost < best.cost:
                best = f
        fit = best
        s = fit.x
        # Pinned means the best fit is outside the searched region: either the source really is, and
        # the caller should widen search_margin_m, or the model is wrong for this data. Either way it
        # is not a position, and saying so beats quoting the edge of a box as a measurement.
        _chk = slice(0, 2) if fixed_up_m is not None else slice(0, 3)
        at_bound = bool(np.any(np.isclose(s[_chk], lo[_chk], atol=1e-6))
                        or np.any(np.isclose(s[_chk], hi[_chk], atol=1e-6)))
        res = _residual(s, P, t, c)
        rms_ms = math.sqrt(float(res @ res) / n_eq) * 1000.0
        t0 = t_ref + float(np.mean(t - np.linalg.norm(s[None, :] - P, axis=1) / c))
        return _report(s, P, t, c, n_eq, n_unk, rms_ms, t0, at_bound, source_class,
                       search_margin_m, fixed_up_m)
    
  hear_solve_consistency.py: |
    #!/usr/bin/env python3
    """Array validity gate — can this array's delays be believed at all?
    
    Three independent arrays on this project have produced confident bearings that were fiction:
    the ESP intra-board pairs (scatter 22-78 us against a 110 us full scale), the ESP cross-board
    set (ring offsets 11-88 ms against a 1.5-2.1 ms physical bound), and the Kinect 4-mic bar.
    Nothing caught any of them. A GCC-PHAT peak-picker always returns a number, the median of a
    handful of pairs always looks plausible, and a bearing computed from contradictory delays is
    indistinguishable from a real one unless you check the delays against each other.
    
    The checks here are the ones that cost nothing:
    
    **Additivity.** Arrival times are one number per mic, so pairwise delays live in a space of
    dimension N-1, not C(N,2). Every closed loop must sum to zero: tau(i,k) == tau(i,j) + tau(j,k).
    That is an identity in the *measurement*, not in the geometry, so it needs NO ground truth and no
    trusted survey -- it gates every event, not the handful with a known answer.
    
    MEASURED over 205 unclipped Kinect impulses from 2026-09-05, at 30 us (half a sample at 16 kHz),
    per-pair bands already clamped to each pair's spatial Nyquist:
    
        worst loop over the field basis {012,123,013}   4 / 205   2.0%   (the published number)
        worst loop over this module's basis {012,013,023}  5 / 205   2.4%
        worst loop over ALL FOUR triangles              0 / 205   0.0%
        worst PAIR off the best-fit arrival times      31 / 205  15.1%   (closure_residual)
        the full verdict -- closure AND the bound       17 / 205   8.3%
        the full verdict with the band NOT clamped      0 / 205   0.0%
    
    ⚠️AND THE CONTROL, which the gate did not have when those numbers were published. A pass rate on
    real data means nothing without the rate on delays that CANNOT be a plane wave. Measured here
    (`null_pass_rate`, 4000 decoys per geometry, seed 20260905, each pair drawn independently and
    uniformly over its own |tau| <= d/c so the bound and Nyquist checks are disarmed by construction
    and additivity is tested alone):
    
        Kinect bar, tol 31.25 us (half a sample at 16 kHz)   0.50%   median decoy closure 171 us
        ESP intra-board 4x38.1 mm, tol 10.42 us (48 kHz)     0.075%  median decoy closure 117 us
    
    So the Kinect gate passes 8.3% of real impulses against 0.5% of decoys -- a ratio of 16.6. The
    survivors are not survivors of chance. Note the median decoy is 5.5x the tolerance: this geometry
    has room to spare, and a tolerance twice as loose would still be a real test.
    
    ⚠️THAT IS THE EASY NULL, AND THE OPERATIONAL ONE IS 17x WORSE. A uniform draw has no acoustic
    structure. The null that matters is MISASSOCIATION: three real impulses that are real, and are not
    the same event. Measured on the 2026-09-05 phone set by building 504 mismatched triplets -- each
    node's window from a different burst, so every pass is false by construction -- **43/504 = 8.5%
    pass the full gate**, against 45% for real bursts. The gate still discriminates 5:1, but "the gate
    passed" is not "this is true", and 8.5% is the number to plan around, not 0.5%. (Those 504 come
    from 9 bursts and are not independent; read it as an order of magnitude.) `null_from_events`
    reproduces this control from delays alone -- see its docstring for what that costs.
    
    ⚠️AND A COHERENT LIE PASSES EITHER NULL. 26 phone events once showed |tau| <= 0.2 ms on every pair
    with closure residual 0.00 ms and the gate said VALID -- whole-spectrum PHAT promoting out-of-band
    filter ringing, common-mode across nodes, to a tall peak at lag zero. All-zero delays are perfectly
    additive. No consistency check can see that; only the band restriction can.
    
    The spread across the first three lines is why this module gates on `closure_residual` and not on
    a maximum over triangles: a loop residual is a sum of up to three pair errors, so the same data
    scores 2-3x worse as a loop than as a pair, and WHICH loops you pick changes the answer. A
    tolerance of half a correlator sample is a statement about one pair, so it belongs on one pair.
    
    ⚠️What additivity CANNOT see, because it costs nothing:
      * a wrong geometry. The identity never mentions mic positions. Perfectly additive delays with
        a mismeasured baseline give a perfectly consistent wrong angle.
      * a per-mic constant timing offset. An error field of the form (o_j - o_i) is exactly additive
        and cancels in every loop. A clock skew between channels is INVISIBLE here.
      * a coherent peak-pick error that happens to be self-consistent (all pairs one period of the
        same tone off).
      Additivity proves the pairs agree with each other. It does not prove they are right.
    
    **Spatial Nyquist, per PAIR.** c/(2d). Above it a pair's cross-correlation has more than one
    candidate peak inside the physical lag window and GCC picks whichever is taller. Kinect pairs:
    57 mm -> 3023 Hz, 114 mm -> 1512 Hz, 167 mm -> 1036 Hz; the ESP intra-board 38.2 mm pair ->
    4501 Hz. Running every pair over 200-7000 Hz -- which is what produced three wrong Kinect
    bearings -- runs the widest pair nearly 7x above its limit. This was already written down for
    the ESP boards and was still missed on the Kinect, so it is a gate here rather than a comment.
    
    **The plane-wave bound.** |tau| <= d/c. On that same Kinect set it is the single most productive
    check: **117 of 205 impulses (57%) report a delay that no direction of arrival can produce**, and
    it removes 14 of the 31 events that survive the consistency check. A wave cannot cross d metres
    of baseline faster than sound; a delay past the bound is not a bad measurement, it is not a
    measurement. ⚠️the check only bites if the correlator is allowed to SEARCH past the bound -- the
    field script searched +/-1.15 d/c plus two samples, which is what made these 117 visible instead
    of silently clamped to a wrong lag at the edge.
    
    **The verdict REFUSES.** `check_array()` returns an `ArrayVerdict` whose direction is `None`
    when the array is inconsistent. It does not fall back to the median of contradictory pairs,
    because that is precisely the failure mode: the median of six pairs that disagree is a number
    with an error bar that looks fine and means nothing.
    
    ⚠️SELECTION EFFECT, measured. A fixed absolute tolerance is easier to pass near broadside. Of the
    205 impulses, 19% have |direction cosine| > 0.7 (near endfire); of the 17 that pass, NONE do --
    every survivor lies 58-117 deg off the array axis. Near endfire the true delay sits at the edge of
    the physical lag window, so any peak-pick error crosses the bound rather than merely widening the
    residual. A gated event set is therefore NOT an unbiased sample of directions, and a bearing
    histogram built from it will lean broadside. What would falsify this: gating a set of synthetic
    endfire arrivals at realistic SNR and seeing the same pass rate as broadside ones.
    
    Sign convention throughout: `taus[(i, j)]` is the arrival at mic j MINUS the arrival at mic i,
    in seconds. Either key order is accepted; (j, i) is read as the negation of (i, j).
    """
    from __future__ import annotations
    
    import itertools
    import math
    from dataclasses import dataclass
    from typing import Dict, List, Optional, Sequence, Tuple
    
    import numpy as np
    
    from .shockwave import sound_speed  # noqa: F401  (re-exported: one definition of c per repo)
    
    Pair = Tuple[int, int]
    
    # Half a sample is the honest floor for a parabolic-interpolated integer-lag correlator: the
    # field gate used 30 us at 16 kHz. Callers pass fs and get this, or state a tolerance outright.
    SUBSAMPLE_TOL_FRACTION = 0.5
    
    
    class ArrayInconsistent(Exception):
        """Raised by ArrayVerdict.require_direction() when the array failed its own checks."""
    
    
    # ── the three primitives ────────────────────────────────────────────────────────────────────────
    
    def spatial_nyquist(d: float, c: float) -> float:
        """Highest frequency a pair d metres apart can carry unambiguously, Hz. = c/(2d).
    
        Above it, half a wavelength fits inside the baseline more than once, so the correlation has
        several peaks within the physical lag window +/- d/c and the tallest one is not necessarily
        the true one. This is a property of the PAIR, not of the array: on a 4-mic bar the closest
        pair may be good to 3 kHz while the widest is aliased above 1 kHz.
        """
        d = float(d)
        if d <= 0.0:
            raise ValueError("spacing must be > 0 m (got %r): a zero baseline has no Nyquist" % d)
        return float(c) / (2.0 * d)
    
    
    def clamp_band(band: Tuple[float, float], d: float, c: float,
                   margin: float = 1.0) -> Optional[Tuple[float, float]]:
        """Trim an analysis band to a pair's spatial Nyquist. None when the whole band is above it.
    
        `margin` < 1 keeps a guard below the limit (0.95 is what the field script used). Returning
        None is deliberate: a pair whose usable band is empty must be DROPPED from the solve, not
        run anyway. Silently clamping such a pair to an empty band would leave GCC correlating
        nothing and still returning a lag.
        """
        lo, hi = float(band[0]), float(band[1])
        if not (hi > lo >= 0.0):
            raise ValueError("band must be 0 <= lo < hi (got %r)" % (band,))
        limit = margin * spatial_nyquist(d, c)
        if lo >= limit:
            return None
        return (lo, min(hi, limit))
    
    
    def physically_possible(tau: float, d: float, c: float, tol_s: float = 0.0) -> bool:
        """|tau| <= d/c. The bound a plane wave cannot exceed, whatever the direction of arrival.
    
        `tol_s` allows for the correlator's own quantisation (half a sample) so that a true endfire
        arrival, which sits exactly on the bound, is not rejected for a rounding.
        """
        if d <= 0.0:
            raise ValueError("spacing must be > 0 m (got %r)" % d)
        return abs(float(tau)) <= float(d) / float(c) + float(tol_s)
    
    
    # ── geometry helpers ────────────────────────────────────────────────────────────────────────────
    
    def _positions(mic_positions) -> np.ndarray:
        """Mic positions as (N, D) metres. A sequence of scalars is read as coordinates on a line."""
        P = np.asarray(mic_positions, dtype=float)
        if P.ndim == 1:
            P = P[:, None]
        if P.ndim != 2 or P.shape[0] < 2:
            raise ValueError("need >= 2 mic positions, got shape %r" % (P.shape,))
        return P
    
    
    def array_axis(mic_positions, tol_m: float = 1e-3) -> Tuple[np.ndarray, float, bool]:
        """Best-fit line through the mics: (unit axis, max perpendicular offset in m, collinear?).
    
        The axis is oriented from the first mic toward the last so that the sign of a recovered
        direction cosine is reproducible across runs.
        """
        P = _positions(mic_positions)
        Q = P - P.mean(axis=0)
        if P.shape[1] == 1:
            e = np.array([1.0])
            off = 0.0
        else:
            _, _, Vt = np.linalg.svd(Q, full_matrices=False)
            e = Vt[0]
            perp = Q - np.outer(Q @ e, e)
            off = float(np.max(np.linalg.norm(perp, axis=1)))
        if float(np.dot(P[-1] - P[0], e)) < 0.0:
            e = -e
        return e, off, off <= float(tol_m)
    
    
    def _axis_coords(mic_positions) -> Tuple[np.ndarray, np.ndarray, float, bool]:
        P = _positions(mic_positions)
        e, off, collinear = array_axis(mic_positions)
        s = (P - P[0]) @ e
        return P, s, off, collinear
    
    
    def spacing(mic_positions, i: int, j: int) -> float:
        """Straight-line distance between two mics, metres."""
        P = _positions(mic_positions)
        return float(np.linalg.norm(P[j] - P[i]))
    
    
    def plane_wave_taus(mic_positions, arrival_direction, c: float) -> Dict[Pair, float]:
        """Delays a plane wave arriving FROM `arrival_direction` produces. For tests and forward checks.
    
        `arrival_direction` points from the array toward the source (it is normalised here). With
        the far-field range R, t_i = (R - a.p_i)/c, so tau(i,j) = -a.(p_j - p_i)/c.
        """
        P = _positions(mic_positions)
        a = np.asarray(arrival_direction, dtype=float).reshape(-1)
        if a.shape[0] != P.shape[1]:
            raise ValueError("direction has %d components, positions have %d"
                             % (a.shape[0], P.shape[1]))
        n = float(np.linalg.norm(a))
        if n == 0.0:
            raise ValueError("arrival direction must be non-zero")
        a = a / n
        return {(i, j): float(-np.dot(a, P[j] - P[i]) / c)
                for i, j in itertools.combinations(range(P.shape[0]), 2)}
    
    
    # ── additivity ──────────────────────────────────────────────────────────────────────────────────
    
    def _tau(taus: Dict[Pair, float], i: int, j: int) -> float:
        if (i, j) in taus:
            return float(taus[(i, j)])
        if (j, i) in taus:
            return -float(taus[(j, i)])
        raise KeyError("no delay for pair (%d,%d)" % (i, j))
    
    
    def independent_triangles(n: int) -> List[Tuple[int, int, int]]:
        """A basis of the cycle space of the complete graph on n mics: C(n-1, 2) triangles.
    
        All C(n,3) triangles are checkable, but only C(n,2) - (n-1) of them are independent -- the
        rest are sums of these. For 4 mics that is 3 independent triangles out of 4, which is what
        the field script checked. The basis is the star spanning tree rooted at mic 0: every non-tree
        edge (i,j) closes exactly one loop 0 -> i -> j -> 0.
        """
        return [(0, i, j) for i, j in itertools.combinations(range(1, n), 2)]
    
    
    def additivity_residuals(taus: Dict[Pair, float], mic_positions,
                             triangles: Optional[Sequence[Tuple[int, int, int]]] = None
                             ) -> Dict[Tuple[int, int, int], float]:
        """Signed loop closure for each triangle, seconds: tau(i,k) - (tau(i,j) + tau(j,k)).
    
        Defaults to an independent basis. Pass `itertools.combinations(range(n), 3)` to see all of
        them; the extra ones are linear combinations of the basis and add no information, but they
        do make it obvious which mic is the odd one out.
        """
        P = _positions(mic_positions)
        n = P.shape[0]
        if n < 3:
            raise ValueError("additivity needs >= 3 mics, got %d (2 mics have no loop to close)" % n)
        tri = list(independent_triangles(n) if triangles is None else triangles)
        missing = sorted({(min(a, b), max(a, b))
                          for i, j, k in tri for a, b in ((i, j), (j, k), (i, k))
                          if (a, b) not in taus and (b, a) not in taus})
        if missing:
            raise ValueError("delays missing for pairs %r: additivity needs the closed loop" % missing)
        return {(i, j, k): _tau(taus, i, k) - (_tau(taus, i, j) + _tau(taus, j, k)) for i, j, k in tri}
    
    
    def additivity_residual(taus: Dict[Pair, float], mic_positions,
                            triangles: Optional[Sequence[Tuple[int, int, int]]] = None) -> float:
        """Worst absolute loop closure over the independent triangles, in SECONDS.
    
        This is the whole gate in one number and it needs no ground truth. Compare it against half a
        correlator sample: 30 us at 16 kHz, 10 us at 48 kHz. On the Kinect bar 98% of live-fire
        impulses fail it.
        """
        return max(abs(v) for v in additivity_residuals(taus, mic_positions, triangles).values())
    
    
    def arrival_times(taus: Dict[Pair, float], mic_positions) -> np.ndarray:
        """Least-squares arrival times (seconds, relative to mic 0) implied by the pairwise delays.
    
        The whole content of additivity is that N(N-1)/2 delays are generated by N-1 free numbers.
        Recovering those numbers directly is the basis-free way to say it, and it uses every pair
        instead of a spanning tree.
        """
        P = _positions(mic_positions)
        n = P.shape[0]
        keys = [(i, j) for i, j in itertools.combinations(range(n), 2)
                if (i, j) in taus or (j, i) in taus]
        if not keys:
            raise ValueError("no delays given")
        A = np.zeros((len(keys) + 1, n))
        b = np.zeros(len(keys) + 1)
        for r, (i, j) in enumerate(keys):
            A[r, j] = 1.0
            A[r, i] = -1.0
            b[r] = _tau(taus, i, j)
        A[-1, 0] = 1.0                              # gauge: t_0 = 0, the delays fix only differences
        t, *_ = np.linalg.lstsq(A, b, rcond=None)
        return t
    
    
    def closure_residual(taus: Dict[Pair, float], mic_positions) -> float:
        """Worst |tau(i,j) - (t_j - t_i)| over all pairs, seconds. Basis-INDEPENDENT.
    
        ⚠️`additivity_residual` is a maximum over a chosen basis of triangles and therefore depends
        on which basis you chose: measured over 205 Kinect impulses, the field script's basis passed
        4 events at 30 us, the library's default basis passed 5, and requiring all four triangles
        passed 0. Loop residuals are not independent -- for 4 mics the fourth triangle is
        r(0,2,3) = r(0,1,3) - r(0,1,2) + r(1,2,3), so it can be three times the largest of them.
    
        This number has no such freedom: it asks whether ANY set of arrival times explains the
        measured delays, which is the question the gate actually means to ask. It is the residual of
        an L2 fit, so it is a (tight in practice) upper bound on the best possible L-infinity fit.
        """
        P = _positions(mic_positions)
        t = arrival_times(taus, P)
        worst = 0.0
        for i, j in itertools.combinations(range(P.shape[0]), 2):
            try:
                m = _tau(taus, i, j)
            except KeyError:
                continue
            worst = max(worst, abs(m - (t[j] - t[i])))
        return float(worst)
    
    
    # ── the verdict ─────────────────────────────────────────────────────────────────────────────────
    
    @dataclass(frozen=True)
    class PairCheck:
        pair: Pair
        spacing_m: float
        tau_s: float
        max_tau_s: float                     # d/c, the plane-wave bound
        within_bound: bool
        nyquist_hz: float
        band_hz: Optional[Tuple[float, float]]
        band_within_nyquist: bool
        closure_s: float                     # tau minus the fitted (t_j - t_i): this pair's own share
        axis_cos: Optional[float]            # per-pair direction cosine, collinear arrays only
    
    
    @dataclass
    class ArrayVerdict:
        """What the array measurement is worth. `valid` False means: do not use this event.
    
        `axis_cos` / `cone_angle_deg` are None whenever `valid` is False. That is the point of the
        object -- there is no "best effort" bearing on this path.
        """
        valid: bool
        reasons: List[str]
        n_mics: int
        sound_speed_mps: float
        worst_additivity_s: float
        worst_closure_s: float
        additivity_tol_s: float
        triangles_s: Dict[Tuple[int, int, int], float]
        pairs: List[PairCheck]
        collinear: bool
        off_axis_m: float
        plane_wave_residual_s: Optional[float] = None
        plane_wave_tol_s: Optional[float] = None
        axis_cos: Optional[float] = None
        axis_cos_spread: Optional[float] = None
        cone_angle_deg: Optional[float] = None
        note: Optional[str] = None
    
        def require_direction(self) -> float:
            """The direction cosine, or ArrayInconsistent. Use this where a bearing is mandatory."""
            if not self.valid or self.axis_cos is None:
                raise ArrayInconsistent("; ".join(self.reasons) or "array failed its validity gate")
            return self.axis_cos
    
        def summary(self) -> str:
            head = "VALID" if self.valid else "REFUSED"
            return "%s  worst closure %.1f us / worst loop %.1f us (tol %.1f us)%s" % (
                head, self.worst_closure_s * 1e6, self.worst_additivity_s * 1e6,
                self.additivity_tol_s * 1e6,
                "" if self.valid else "  [" + "; ".join(self.reasons) + "]")
    
    
    def check_array(taus: Dict[Pair, float], mic_positions, *,
                    temp_c: Optional[float] = None, c: Optional[float] = None,
                    fs: Optional[float] = None, tol_s: Optional[float] = None,
                    bands: Optional[object] = None, nyquist_margin: float = 1.0,
                    plane_wave_tol_s: Optional[float] = None) -> ArrayVerdict:
        """Run every free check on one array measurement and return a verdict that can refuse.
    
        `taus`     pairwise delays, seconds, tau(i,j) = arrival at j minus arrival at i.
        `bands`    the analysis band actually used: one (lo, hi) for every pair, or a dict keyed by
                   pair. Omit it only if you genuinely do not know what band the correlator ran in --
                   and then the Nyquist check cannot run, which is how the Kinect bearings happened.
        `tol_s`    additivity tolerance. Derived as half a sample from `fs` when not given; one of
                   the two is required, because a residual without a tolerance is not a test.
        `plane_wave_tol_s` opt-in. Gates the extra check that arrival times are AFFINE in position
                   along the array -- which additivity does not imply. It is off by default because
                   it trusts the survey, and the Kinect offsets are marked "APPROXIMATE, NEVER
                   MEASURED"; failing an event on a geometry nobody measured would be blaming the
                   audio for the tape measure.
        """
        if c is None:
            c = sound_speed(20.0 if temp_c is None else temp_c)
        c = float(c)
        if tol_s is None:
            if fs is None:
                raise ValueError("give tol_s, or fs to derive half a sample from: a residual "
                                 "without a tolerance is not a test")
            tol_s = SUBSAMPLE_TOL_FRACTION / float(fs)
        tol_s = float(tol_s)
    
        P, s, off_axis, collinear = _axis_coords(mic_positions)
        n = P.shape[0]
        reasons: List[str] = []
    
        tri = additivity_residuals(taus, P)
        worst = max(abs(v) for v in tri.values())
        t_fit = arrival_times(taus, P)
        worst_closure = closure_residual(taus, P)
        # ⚠️gated on the basis-free closure, NOT on the triangle maximum: see closure_residual().
        if worst_closure > tol_s:
            bad = max(tri.items(), key=lambda kv: abs(kv[1]))[0]
            reasons.append("consistency: no arrival times explain these delays -- worst pair off by "
                           "%.1f us over tol %.1f us (worst loop %.1f us at triangle %s); at least "
                           "one pair's correlation peak is wrong"
                           % (worst_closure * 1e6, tol_s * 1e6, worst * 1e6, bad))
    
        def band_for(pair: Pair) -> Optional[Tuple[float, float]]:
            if bands is None:
                return None
            if isinstance(bands, dict):
                if pair in bands:
                    return tuple(bands[pair])          # type: ignore[return-value]
                rev = (pair[1], pair[0])
                return tuple(bands[rev]) if rev in bands else None  # type: ignore[return-value]
            return tuple(bands)                        # type: ignore[return-value]
    
        pairs: List[PairCheck] = []
        cosines: List[float] = []
        for i, j in itertools.combinations(range(n), 2):
            try:
                t = _tau(taus, i, j)
            except KeyError:
                continue
            d = float(np.linalg.norm(P[j] - P[i]))
            bound = d / c
            ok_bound = physically_possible(t, d, c, tol_s)
            if not ok_bound:
                reasons.append("pair (%d,%d): |tau| %.1f us exceeds the plane-wave bound %.1f us "
                               "(d = %.4f m) -- not a slow measurement, an impossible one"
                               % (i, j, abs(t) * 1e6, bound * 1e6, d))
            nyq = spatial_nyquist(d, c)
            band = band_for((i, j))
            ok_band = True
            if band is not None:
                limit = nyquist_margin * nyq
                if band[1] > limit:
                    ok_band = False
                    reasons.append("pair (%d,%d): analysis band %.0f-%.0f Hz runs above the pair's "
                                   "spatial Nyquist %.0f Hz (d = %.4f m) -- GCC can pick the wrong "
                                   "peak" % (i, j, band[0], band[1], nyq, d))
            ac = None
            if collinear and abs(s[j] - s[i]) > 0.0:
                ac = -c * t / (s[j] - s[i])
                cosines.append(ac)
            pairs.append(PairCheck((i, j), d, t, bound, ok_bound, nyq, band, ok_band,
                                   float(t - (t_fit[j] - t_fit[i])), ac))
    
        pw_res: Optional[float] = None
        axis_cos: Optional[float] = None
        spread: Optional[float] = None
        note: Optional[str] = None
        if collinear and n >= 2:
            # Is the fitted arrival time AFFINE in position along the array? A plane wave says yes.
            A = np.column_stack([s, np.ones(n)])
            coef, *_ = np.linalg.lstsq(A, t_fit, rcond=None)
            pw_res = float(np.max(np.abs(A @ coef - t_fit)))
            axis_cos = float(-coef[0] * c)
            spread = float(np.std(cosines)) if cosines else None
            if plane_wave_tol_s is not None and pw_res > plane_wave_tol_s:
                reasons.append("plane wave: arrival times are not affine in mic position (max %.1f us "
                               "over tol %.1f us) -- either the wave is not planar here or the "
                               "surveyed spacing is wrong" % (pw_res * 1e6, plane_wave_tol_s * 1e6))
            if abs(axis_cos) > 1.0 + 1e-9:
                reasons.append("direction cosine %.3f is outside [-1, 1]: no direction of arrival "
                               "produces these delays" % axis_cos)
            note = ("collinear array: only the angle from the array axis is observable. The source "
                    "lies on a cone about the axis; azimuth needs a second, non-parallel baseline.")
        else:
            note = ("non-collinear array (max %.4f m off the best-fit line): additivity and the "
                    "plane-wave bound still apply, but this module does not solve a 2D/3D "
                    "direction -- use a full DoA solver on the gated delays." % off_axis)
    
        valid = not reasons
        if not valid:
            axis_cos = None
            spread = None
        cone = (math.degrees(math.acos(max(-1.0, min(1.0, axis_cos))))
                if (valid and axis_cos is not None) else None)
        return ArrayVerdict(
            valid=valid, reasons=reasons, n_mics=n, sound_speed_mps=c,
            worst_additivity_s=worst, worst_closure_s=worst_closure,
            additivity_tol_s=tol_s, triangles_s=tri, pairs=pairs,
            collinear=collinear, off_axis_m=off_axis,
            plane_wave_residual_s=pw_res, plane_wave_tol_s=plane_wave_tol_s,
            axis_cos=axis_cos, axis_cos_spread=spread, cone_angle_deg=cone, note=note,
        )
    
    
    # ── the control the gate did not have ────────────────────────────────────────────────────────
    #
    # ⚠️A PASS RATE ON REAL DATA IS NOT A RESULT ON ITS OWN. The verdict passes 8.3% of 205 Kinect
    # impulses. That number means nothing until you know what it passes on delays that CANNOT be a
    # plane wave: if a random set inside the physical bound also passes at ~8%, the gate has selected
    # nothing and the survivors are survivors of chance. This is the control, and it is code rather
    # than a paragraph so it can be re-run when the tolerance or the geometry changes.
    #
    # The decoy is drawn per PAIR, independently and uniformly over its own bound |tau| <= d/c. That
    # is deliberately the HARDEST null available: it cannot be rejected by the plane-wave bound (it
    # obeys it by construction) or by the Nyquist check (a decoy carries no band), so the pass rate
    # it produces is additivity's discriminating power alone, with every other check disarmed. A
    # looser null -- delays drawn over some wider window -- would flatter the gate.
    
    def decoy_taus(mic_positions, c: float, rng=None) -> Dict[Pair, float]:
        """One set of pairwise delays that obeys every bound and is not a plane wave.
    
        Independent per pair, so with probability 1 no arrival-time vector explains them -- which is
        exactly what additivity is supposed to detect.
        """
        rng = np.random.default_rng() if rng is None else rng
        P = _positions(mic_positions)
        n = P.shape[0]
        out: Dict[Pair, float] = {}
        for i, j in itertools.combinations(range(n), 2):
            lim = spacing(P, i, j) / float(c)
            out[(i, j)] = float(rng.uniform(-lim, lim))
        return out
    
    
    def null_pass_rate(mic_positions, *, tol_s: float, c: float, trials: int = 2000,
                       seed: int = 20260905, **check_kw) -> Dict[str, float]:
        """Fraction of decoy delay sets the gate accepts. The false-alarm rate of the gate itself.
    
        Returns the rate, the trial count, and the median worst-pair closure residual over the
        decoys -- the last one says HOW far from consistent a decoy typically is, which is what
        tells you whether the tolerance is anywhere near the right size for this geometry.
        """
        rng = np.random.default_rng(seed)
        P = _positions(mic_positions)
        passed = 0
        residuals: List[float] = []
        for _ in range(int(trials)):
            taus = decoy_taus(P, c, rng)
            residuals.append(closure_residual(taus, P))
            v = check_array(taus, P, c=c, tol_s=tol_s, **check_kw)
            if v.valid:
                passed += 1
        return {"trials": float(trials), "pass_rate": passed / float(trials),
                "median_closure_us": float(np.median(residuals) * 1e6),
                "tol_us": float(tol_s * 1e6)}
    
    
    def null_from_events(events: Sequence[Dict[Pair, float]], mic_positions, *, tol_s: float,
                         c: float, trials: int = 2000, seed: int = 20260905,
                         **check_kw) -> Dict[str, float]:
        """The MISASSOCIATION null, built from real measured delays instead of a uniform draw.
    
        Each trial takes every pair's delay from a DIFFERENT event, so the marginal distribution of
        each pair is the empirical one -- real acoustic structure, real peak-pick errors -- while the
        joint is false by construction. This is the control that produced 8.5% on the 2026-09-05 phone
        set, 17x the uniform decoy rate, and it is the one to size an operation against.
    
        ⚠️WHAT THIS COSTS versus doing it on signals. The field control mismatched WINDOWS and
        re-correlated, so pairs sharing a node stayed coupled -- tau(0,1) and tau(0,2) both moved when
        node 0's window changed. Drawing per pair independently breaks that coupling, which makes an
        inconsistent set slightly EASIER to build and so tends to UNDERSTATE the pass rate. Prefer the
        signal-level control when you have the audio; use this when all you kept was the delays.
    
        Needs at least as many events as pairs, or a trial cannot draw them all from different events.
        """
        P = _positions(mic_positions)
        n = P.shape[0]
        pairs = list(itertools.combinations(range(n), 2))
        ev = [e for e in events if all(_has_pair(e, p) for p in pairs)]
        if len(ev) < len(pairs):
            raise ValueError("need >= %d events carrying every pair; got %d"
                             % (len(pairs), len(ev)))
        rng = np.random.default_rng(seed)
        passed = 0
        residuals: List[float] = []
        for _ in range(int(trials)):
            pick = rng.choice(len(ev), size=len(pairs), replace=False)
            taus = {p: _tau(ev[k], p[0], p[1]) for p, k in zip(pairs, pick)}
            residuals.append(closure_residual(taus, P))
            if check_array(taus, P, c=c, tol_s=tol_s, **check_kw).valid:
                passed += 1
        return {"trials": float(trials), "pass_rate": passed / float(trials),
                "median_closure_us": float(np.median(residuals) * 1e6),
                "tol_us": float(tol_s * 1e6), "events": float(len(ev))}
    
    
    def _has_pair(taus: Dict[Pair, float], pair: Pair) -> bool:
        return pair in taus or (pair[1], pair[0]) in taus
    
    
    def discrimination(real_pass_rate: float, mic_positions, *, tol_s: float, c: float,
                       trials: int = 2000, seed: int = 20260905, **check_kw) -> Dict[str, float]:
        """Put a measured pass rate next to the null. Ratio near 1 means the gate selected nothing.
    
        Stated as a ratio and not as a verdict: what counts as enough separation depends on how many
        events you can afford to lose, and that is the operator's call, not this module's.
        """
        null = null_pass_rate(mic_positions, tol_s=tol_s, c=c, trials=trials, seed=seed, **check_kw)
        r = null["pass_rate"]
        return {**null, "real_pass_rate": float(real_pass_rate),
                "ratio": float("inf") if r == 0.0 else float(real_pass_rate) / r}
    
